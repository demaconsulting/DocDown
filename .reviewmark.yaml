    title: Review that Shared Test Support Infrastructure is Correct
    context:
      - "docs/design/docdown-core.md"
      - "docs/reqstream/docdown-core.yaml"
    paths:
      - "test/DemaConsulting.DocDown.TestSupport/**/*.cs"                  # shared test support source

  # === DocDownPdf review-sets ===
  # DocDownPdf is a flat system: it has no subsystems, so its units are *direct* units whose
  # context is the parent system design doc plus the parent system requirements - two entries,
  # not the four a unit nested under a subsystem carries. Every .cs path is listed explicitly,
  # never by glob, matching the deliberate DocDownCore precedent: a glob would silently absorb a
  # future unit's source file into the wrong review-set. Globs are used only for the markdown and
  # YAML doc trees.

