  # Repo-level, un-prefixed id: DemaConsulting.DocDown.TestSupport is shared test infrastructure used by
  # DocDown.Core and DocDown.Pdf, and by the future DocDown.Tool and Office packages, so a
  # system-prefixed id would have become wrong in Increment 3, which added DocDown.Pdf as the second
  # consumer. Repo-level, un-prefixed ids already exist for repo-level concerns (Purpose, Decomposition,
  # OTS-*), and software-items.md uses the same reasoning for the fixed repo-level test/OtsSoftwareTests/
  # name. The standard is silent on test infrastructure, so this placement rationale is recorded here.
