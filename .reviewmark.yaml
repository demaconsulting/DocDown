  # sets follow the DocDownWord shape; subsystem and unit-under-subsystem sets follow the DocDownExcel
  # shape, with the unit-under-subsystem sets carrying the four context entries the Context Files table
  # requires. Every .cs path is listed explicitly, never by glob, so a future unit source file cannot be
  # silently absorbed. Each subsystem documents its supporting-type .cs files inline, so those files are
