  # === DocDownVisio review-sets ===
  # DocDownVisio is the Visio extraction system. Like DocDownPowerPoint it has three subsystems (Com,
  # Markdown, OpenXml) and one direct unit (VisioDocDownBuilderExtensions). System sets follow the
  # DocDownWord shape; subsystem and unit-under-subsystem sets follow the DocDownExcel shape, with the
  # unit-under-subsystem sets carrying the four context entries the Context Files table requires. Every
  # .cs path is listed explicitly, never by glob, so a future unit source file cannot be silently
  # absorbed. Each subsystem documents its supporting-type .cs files inline, so those files are reviewed
  # in the subsystem set (D8): Com holds the automation seam interface, the composing sink, the delegated
  # context, and the COM dispatch plumbing; Markdown holds the diagnostic-code type; OpenXml holds the
  # drawing model, the shared exception, and the in-memory package synthesizer used by the self-test and
  # fixtures. VisioAutomation (the real COM adapter, proven by release-time self-tests) has no dedicated
  # test class; its source is covered in its unit set. The new Visio test project carries no golden
  # directory and no non-.cs data beyond .csproj, so — unlike Word — no golden entries are required.

  # DocDownVisio-Architecture Review (one per system)
  - id: DocDownVisio-Architecture
    title: Review that DocDown.Visio Architecture Satisfies Requirements
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/docdown-office/visio.yaml"                                       # system requirements
      - "docs/design/introduction.md"                                            # design introduction
      - "docs/design/docdown-office/visio.md"                                           # system design
      - "docs/verification/introduction.md"                                      # verification introduction
      - "docs/verification/docdown-office/visio.md"                                     # system verification
      - "test/DemaConsulting.DocDown.Office.Tests/Visio/DocDownVisioTests.cs"           # integration tests
      - "test/DemaConsulting.DocDown.Office.Tests/Visio/TestData/CapturingContext.cs"   # test support
      - "test/DemaConsulting.DocDown.Office.Tests/Visio/TestData/VsdxFixtures.cs"       # generated test fixtures
      - "test/DemaConsulting.DocDown.Office.Tests/Visio/TestData/StubVisioAutomation.cs"  # rendering stub
      - "src/DemaConsulting.DocDown.Office/Visio/NamespaceDoc.cs"                       # namespace documentation

