      - "docs/design/docdown-core/detection.md"                                       # subsystem design
      - "docs/verification/docdown-core/detection.md"                                 # subsystem verification
      - "test/DemaConsulting.DocDown.Core.Tests/Detection/DetectionTests.cs"          # subsystem tests
      - "src/DemaConsulting.DocDown.Core/Detection/DocumentFormat.cs"                 # supporting type (D8)
      - "src/DemaConsulting.DocDown.Core/Detection/DetectionBasis.cs"                 # supporting type (D8)
