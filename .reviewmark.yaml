  # === DocDownExcel review-sets ===
  # DocDownExcel is the Excel extraction system. Like DocDownWord it has more than one subsystem
  # (Markdown, OpenXml) and one direct unit (ExcelDocDownBuilderExtensions). System sets follow the
  # DocDownWord shape; subsystem and unit-under-subsystem sets follow the DocDownCore shape, with the
  # unit-under-subsystem sets carrying the four context entries the Context Files table requires.
