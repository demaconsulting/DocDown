      - "docs/design/docdown-core/output.md"                                          # subsystem design
      - "docs/verification/docdown-core/output.md"                                    # subsystem verification
      - "test/DemaConsulting.DocDown.Core.Tests/Output/OutputTests.cs"                # subsystem tests
      - "src/DemaConsulting.DocDown.Core/Output/ExtractionManifest.cs"                # supporting type (D8)
      - "src/DemaConsulting.DocDown.Core/Output/ArtifactInventory.cs"                 # supporting type (D8)
      - "src/DemaConsulting.DocDown.Core/Output/MetadataWriter.cs"                    # supporting type (D8)
