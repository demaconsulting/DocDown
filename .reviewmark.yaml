---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"  # Verification documentation files
  - "docs/user_guide/**/*.md"    # User guide documentation
  - "docs/sysml2/**/*.sysml"     # SysML2 architecture model
  - "test/DemaConsulting.DocDown.Core.Tests/golden/**/*.txt"  # Golden summary.txt outputs (reviewed artifact)
  - "test/DemaConsulting.DocDown.Word.Tests/golden/**/*.txt"  # Golden summary.txt outputs (reviewed artifact)
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!node_modules/**"           # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/DocDown/reviews/index.json

# Global context shown to every reviewer for orientation (not fingerprinted).
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"                              # exclude design intro from user-facing review
    paths:
      - "README.md"                                                 # project readme
      - "docs/user_guide/**/*.md"                                   # user guide

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that DocDown Decomposition Addresses the Stated Purpose
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "requirements.yaml"                                         # root requirements file
      - "docs/reqstream/quality.yaml"                               # repository-level quality requirements
      - "docs/design/introduction.md"                               # design introduction
      - "docs/sysml2/**/*.sysml"                                    # SysML2 model (authoritative structure)

  # DocDownCore-Architecture Review (one per system)
  - id: DocDownCore-Architecture
    title: Review that DocDown.Core Architecture Satisfies Requirements
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/docdown-core.yaml"                      # system requirements
      - "docs/design/introduction.md"                                           # design introduction
      - "docs/design/docdown-core.md"                               # system design
      - "docs/verification/introduction.md"                                    # verification introduction
      - "docs/verification/docdown-core.md"                        # system verification
      - "test/DemaConsulting.DocDown.Core.Tests/DocDownCoreTests.cs"  # integration tests
      - "src/DemaConsulting.DocDown.Core/NamespaceDoc.cs"             # namespace documentation

  # DocDownCore-Design Review (one per system)
  - id: DocDownCore-Design
    title: Review that DocDown.Core Design is Consistent and Complete
    context:
      - "docs/reqstream/docdown-core.yaml"
    paths:
      - "docs/reqstream/docdown-core/platform-requirements.yaml"  # platform requirements
      - "docs/design/introduction.md"                                       # design introduction
      - "docs/design/docdown-core.md"                           # system design
      - "docs/design/docdown-core/**/*.md"                      # all system design documents
      - "docs/design/ots.md"                                                # OTS overview

  # DocDownCore-Verification Review (one per system)
  - id: DocDownCore-Verification
    title: Review that DocDown.Core Verification is Consistent and Complete
    context:
      - "docs/reqstream/docdown-core.yaml"
    paths:
      - "docs/verification/introduction.md"                                 # verification introduction
      - "docs/verification/docdown-core.md"                     # system verification
      - "docs/verification/docdown-core/**/*.md"               # all verification documents
      - "docs/verification/ots.md"                                          # OTS overview

  # DocDownCore-AllRequirements Review (one per system)
  - id: DocDownCore-AllRequirements
    title: Review that All DocDown.Core Requirements are Complete
    context:
      - "docs/design/docdown-core.md"
      - "docs/reqstream/docdown-core.yaml"
    paths:
      - "docs/reqstream/docdown-core/**/*.yaml"                             # subsystem/unit requirements files

  # DocDownCore-Detection Subsystem Review (one per subsystem)
  # D8: the subsystem's inline supporting-type source files are reviewed here because they
  # are documented in the subsystem design doc (not in unit docs), so the subsystem review is
  # the matching compliance question for their source. Unit source files are deliberately
  # excluded (Hierarchical Scope: only unit reviews include unit implementation). The list is
  # explicit so a future unit .cs file cannot be silently absorbed by a glob.
  - id: DocDownCore-Detection
    title: Review that DocDown.Core Detection Satisfies Subsystem Requirements
    context:
      - "docs/design/docdown-core.md"
      - "docs/reqstream/docdown-core.yaml"
