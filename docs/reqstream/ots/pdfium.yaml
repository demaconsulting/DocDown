---
# PDFium OTS Software Requirements
#
# Requirements for the PDFium native rasterizer, delivered transitively through PDFtoImage
# via the bblanchon.PDFium.* native-asset packages. PDFium is the only native binary DocDown
# depends on; its evidence comes from the rendering tests that load and exercise it, named
# exactly here rather than claimed broadly.

sections:
  - title: OTS Software Requirements
    sections:
      - title: PDFium Requirements
        requirements:
          - id: DocDown-OTS-PDFium
            title: >-
              PDFium shall load for the current runtime identifier and rasterize a PDF page to a
              non-blank buffer of plausible dimensions.
            justification: |
              PDFium is the native engine that actually turns page geometry into pixels. The rendered
              page's dimensions and content come from PDFium, and its ability to load for the current
              runtime identifier is the precondition on which the entire rendered-pages capability
              depends.
            tags: [ots]
            tests:
              - PageRenderer_Render_SinglePage_ReturnsValidPng
              - PageRenderer_ProbeAvailability_AnyEnvironment_ReflectsUsabilityWithoutThrowing
              - DocDownPdfRendering_Render_GeneratedPdf_ProducesValidPngPages
