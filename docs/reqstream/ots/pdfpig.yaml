---
# PdfPig OTS Software Requirements
#
# Requirements for the PdfPig managed PDF parser, which DocDown.Pdf is built on.
# Unlike this repository's other OTS items, PdfPig is a runtime library shipped to
# consumers rather than a build-time tool, so its evidence comes from the DocDown.Pdf
# extraction tests that exercise it transitively.

sections:
  - title: OTS Software Requirements
    sections:
      - title: PdfPig Requirements
        requirements:
          - id: DocDown-OTS-PdfPig
            title: PdfPig shall parse PDF documents.
            justification: |
              This is the use DocDown.Pdf makes of PdfPig: it is the parser the package is built on,
              and every capability below is a facet of it. The package's managed-only deployment
              promise is stated where it belongs, as DocDownPdf-ManagedOnly, which is a requirement
              on this repository rather than a demand on a third party; that requirement names this
              one as its child because staying managed depends on the parser being managed.
            tags: [ots]
            tests:
              - DocDownPdf_Extract_SimpleTextPdf_ProducesContractLayout

          - id: DocDown-OTS-PdfPig-TextExtraction
            title: >-
              PdfPig shall expose a document's glyphs with the position information needed to recover
              reading order.
            justification: |
              A PDF stores glyphs in paint order. Recovering the order a human reads them requires the
              position of each glyph, not just its character, so the parser must surface geometry and
              not merely text.
            tags: [ots]
            tests:
              - PdfTextExtractor_Extract_SingleTextPage_RendersParagraphsInReadingOrder
              - PdfTextExtractor_Extract_AnyPage_ProducesStructureRawPageTextDoesNot

          - id: DocDown-OTS-PdfPig-ImageExtraction
            title: >-
              PdfPig shall enumerate a page's embedded images, expose their stored bytes and encoding,
              and convert decodable images to a usable format.
            justification: |
              Honest image extraction needs three things from the parser: the list of images, the
              encoding of each so the right decision can be taken, and a conversion for the encodings
              that are not themselves image files. Any one missing would force this package either to
              drop images or to write bytes a consumer cannot open.
            tags: [ots]
            tests:
              - PdfImageExtractor_AddImage_DctImage_SetsPassthroughTransformHint
              - PdfImageExtractor_AddImage_FlateImage_SetsDecodedToPngTransformHint
              - PdfImageExtractor_AddImage_JpxImage_WritesJp2PassthroughWithoutExtraNote
              - PdfImageExtractor_Extract_UndecodableEncoding_ReportsPlainNoteAndWritesNothingForIt

          - id: DocDown-OTS-PdfPig-DocumentMetadata
            title: PdfPig shall expose a document's information dictionary and its page count.
            justification: |
              The document-metadata capability this package declares is satisfied entirely from what
              the parser reads out of the document, so the capability is only as truthful as the
              parser's access to it.
            tags: [ots]
            tests:
              - PdfDocumentExtractor_ExtractAsync_DocumentWithMetadata_ReportsTitleAuthorAndPageCount
              - DocDownPdf_Extract_MultiPagePdf_ReportsPageCountAndAllText

          - id: DocDown-OTS-PdfPig-ProtectedDocuments
            title: >-
              PdfPig shall signal an encrypted or structurally invalid document rather than returning
              partial or corrupt content.
            justification: |
              A parser that returned whatever it could scrape from an unreadable document would make
              honest reporting impossible: this package would report a successful extraction of
              content that is not what the document says. A clear signal is what lets the failure be
              structured and attributed.
            tags: [ots]
            tests:
              - PdfDocumentExtractor_ExtractAsync_EncryptedDocument_PropagatesParserFaultForCore
              - PdfDocumentExtractor_ExtractAsync_MalformedDocument_PropagatesParserFaultForCore

          - id: DocDown-OTS-PdfPig-DocumentCreation
            title: PdfPig shall build PDF documents suitable for use as test fixtures.
            justification: |
              Generating the suite's fixtures at test time is what keeps the repository free
              of any question about the provenance or licensing of a checked-in sample document. That
              approach depends on the parser's writer, so the writer is a required feature rather than
              a convenience.
            tags: [ots]
            tests:
              - DocDownPdf_Extract_SimpleTextPdf_ProducesContractLayout
              - DocDownPdf_Extract_DctImage_RoundTripsByteIdenticalAsPassthrough
              - PdfDocumentExtractor_GetSelfTestCases_DeployedBackend_ReturnsParseAndRenderingCases
