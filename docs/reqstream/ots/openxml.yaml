---
# Open XML SDK OTS Software Requirements
#
# Requirements for the DocumentFormat.OpenXml SDK, the managed Open XML reader/writer
# DocDown.Word is built on. Like PdfPig, it is a runtime library shipped to consumers rather
# than a build-time tool, so its evidence comes from the DocDown.Word extraction tests that
# exercise it transitively. It is treated as one OTS item — the SDK and its Framework
# companion are a single independently-sourced component under one MIT license from one
# maintainer — where pdfium and SkiaSharp were separate items because each is independently
# sourced with its own license and native asset.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Open XML SDK Requirements
        requirements:
          - id: DocDown-OTS-OpenXml
            title: >-
              The Open XML SDK shall read a WordprocessingML document's structure without requiring
              native binaries.
            justification: |
              DocDown.Word's central design promise is that it is deployable anywhere the .NET runtime
              is, with no per-platform build and no native asset to locate at run time. That promise
              rests entirely on the SDK being fully managed, and its ability to expose styled
              paragraphs, real tables, fields, headers, and footers is what the whole structured
              extraction is built on. Its evidence is named tests that read a generated document, not a
              broad claim of coverage.
            tags: [ots]
            tests:
              - DocDownWord_Extract_GeneratedDocx_ProducesContractLayout
              - WordOpenXmlReader_Read_HeadingsListsAndTables_ProducesStructuredBlocks

          - id: DocDown-OTS-OpenXml-Images
            title: >-
              The Open XML SDK shall enumerate a document's embedded image parts and expose their
              stored bytes and content type.
            justification: |
              Honest image extraction needs the list of image parts, each part's stored bytes, and its
              declared content type so the passthrough transform and the media-type caveat can both be
              recorded truthfully. The two named tests exercise exactly that enumeration; no image
              coverage beyond them is claimed.
            tags: [ots]
            tests:
              - DocDownWord_Extract_DocxWithImages_WritesImagesAndLinksThem
              - WordOpenXmlImageReader_Read_Png_YieldsPassthroughWithNullDimensions

          - id: DocDown-OTS-OpenXml-DocumentCreation
            title: The Open XML SDK shall build WordprocessingML documents suitable for use as test fixtures.
            justification: |
              Generating every fixture at test time is what keeps this repository text-only and free of
              any question about the provenance or licensing of a checked-in sample document. That
              approach depends on the SDK's writer, so the writer is a required feature rather than a
              convenience, exercised by the tests that build and then read a document.
            tags: [ots]
            tests:
              - WordOpenXmlReader_Read_HeaderWithRevisionAndClassification_ProducesDocumentControlSection
              - WordOpenXmlExtractor_SelfValidation_ReportsCases
