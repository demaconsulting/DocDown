---
# Software System Requirements for DocDown.Core
#
# SUPERSEDED REQUIREMENT: DocDownCore-BackendOverride
# required a caller-named extractor override. It is superseded (not satisfied) with no replacement
# because the governing principle removed caller-directed selection machinery; Core now applies only
# the fixed deterministic selection policy.
#
# SUPERSEDED REQUIREMENT: DocDownCore-SelectionReported
# required a per-candidate selection explanation. It is superseded (not satisfied) with no
# replacement because verdict-style candidate traces were removed from the Core reporting model.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Degradation
# required a distinct degraded outcome and explained gaps. It is superseded (not satisfied) by
# DocDownCore-NotesReported because Core now records attempted-but-incomplete work as plain notes
# while still returning the two-state outcome model.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Diagnostics
# required coded extraction diagnostics. It is superseded (not satisfied) with no replacement
# because the governing principle limits reporting to content inventory and plain notes.
#
# SUPERSEDED REQUIREMENT: DocDownCore-GapReporting
# required numbered gaps for missing output. It is superseded (not satisfied) by
# DocDownCore-NotesReported and DocDownCore-Output-ContentOutline because Core now reports only
# attempted-but-incomplete work as notes and states document absences through the content inventory.
#
# SUPERSEDED REQUIREMENT: DocDownCore-GapAccuracy
# required gap and ledger reconciliation. It is superseded (not satisfied) with no replacement
# because the gap, ledger, and contract-verifier machinery was removed from Core.
#
# SUPERSEDED REQUIREMENT: DocDownCore-NoSilentAbsence
# required every absence to be explained by a gap. It is superseded (not satisfied) by
# DocDownCore-NotesReported and DocDownCore-Output-ContentOutline because the governing principle
# now separates attempted extraction shortfalls from facts about the document's own content.

sections:
  - title: DocDownCore Requirements
    requirements:
      - id: DocDownCore-OutputContract
        title: >-
          The library shall produce a self-describing output contract recording what it extracted,
          where it wrote the results, and any unreadable outcome.
        tags: [system]
        justification: |
          Downstream automation must act on the extraction without reopening the source document.
          A stable record of produced artifacts, their location, and any unreadable failure is the
          core value of the library.
        children:
          - DocDownCore-LayoutInvariance
          - DocDownCore-SummaryFile
          - DocDownCore-ManifestFile
          - DocDownCore-Output-DocumentMetadata
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout
          - DocDownCore_Extract_Failure_StillWritesSummaryAndManifest

      - id: DocDownCore-LayoutInvariance
        title: >-
          The library shall write the standard root artifacts for every extraction whose scratch
          folder it accepts, including unreadable outcomes.
        tags: [system]
        justification: |
          Operators must be able to distinguish an unreadable extraction from a missing run. A
          stable set of root artifacts gives every accepted extraction one recognizable record.
        children:
          - DocDownCore-Output-ArtifactLayout
          - DocDownCore-Extraction-Orchestration
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout
          - DocDownCore_Extract_Failure_StillWritesSummaryAndManifest

      - id: DocDownCore-SummaryFile
        title: >-
          The library shall write a human-readable summary describing the extraction, its runtime
          context, and any recorded notes.
        tags: [system]
        justification: |
          Humans triage extractions from the summary first. It must state the scratch location,
          the selected backend, what was extracted, and any attempted steps that could not be
          completed.
        children:
          - DocDownCore-Output-SummaryContent
          - DocDownCore-Output-ContentOutline
          - DocDownCore-Output-ExtractionNotes
        tests:
          - DocDownCore_Extract_BackendUnavailable_ReasonAppearsInSummary
          - DocDownCore_Extract_PagesRequestedButUnsupported_ProducesWithNote

      - id: DocDownCore-ManifestFile
        title: The library shall write a machine-readable manifest describing the extraction run.
        tags: [system]
        justification: |
          Automated consumers need a stable machine-readable record of the extraction. The manifest
          carries the format, source, selected backend, output inventories, and any unreadable
          failure. It does not echo the options it was run with: a consumer reading the manifest
          wants to know what was produced, not what was asked for.
        children:
          - DocDownCore-Output-ManifestContent
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout
          - DocDownCore_Extract_ImageProvenance_ManifestRecordsTransformPerImage

      - id: DocDownCore-ContentFile
        title: The library shall write extracted document content as Markdown when text was produced.
        tags: [system]
        justification: |
          Downstream readers and agents consume one predictable text artifact. Writing Markdown
          gives them a stable format regardless of source document type.
        children:
          - DocDownCore-Output-ContentDocument
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout

      - id: DocDownCore-ImageFolder
        title: >-
          The library shall write embedded images as deduplicated resources and record their
          provenance in the manifest.
        tags: [system]
        justification: |
          Images often contain document content that text alone cannot capture. Deduplicated image
          output keeps the scratch folder compact while still preserving provenance for every image.
        children:
          - DocDownCore-Output-ImageResources
          - DocDownCore-Output-ImageProvenance
        tests:
          - DocDownCore_Extract_ImageProvenance_ManifestRecordsTransformPerImage

      - id: DocDownCore-PageFolder
        title: >-
          The library shall write rendered pages when page rendering succeeds and shall otherwise
          record a note when a requested paginated render could not be completed.
        tags: [system]
        justification: |
          Some consumers need rendered page images, but that ability depends on the selected
          backend and environment. The library must therefore distinguish produced pages from a
          requested render that could not be completed.
        children:
          - DocDownCore-NotesReported
          - DocDownCore-Output-PageResources
        tests:
          - DocDownCore_Extract_PagesRequestedButUnsupported_ProducesWithNote

      - id: DocDownCore-FormatDetection
        title: The library shall determine the document format before selecting an extractor.
        tags: [system]
        justification: |
          Routing a document to a compatible extractor depends on naming its format first.
          Detection is therefore the entry point to the entire extraction pipeline.
        children:
          - DocDownCore-Detection-FormatIdentification
          - DocDownCore-Detection-DetectionBasisReported
          - DocDownCore-Detection-UnknownFormatReported
          - DocDownCore-Detection-NonDestructiveInspection
        tests:
          - DocDownCore_ExtractAsync_DocxWithoutWordBackend_FailsHonestlyNamingThePackage
          - DocDownCore_Extract_UnknownFormat_ReturnsUnreadableResult

      - id: DocDownCore-ExplicitRegistration
        title: The library shall use only the extraction backends explicitly registered by the host.
        tags: [system]
        justification: |
          Hosts control which extractors participate. Core must not discover or activate other
          backends implicitly.
        children:
          - DocDownCore-Extraction-ExplicitRegistration
        tests:
          - DocDownCore_ExtractAsync_DocxWithoutWordBackend_FailsHonestlyNamingThePackage

      - id: DocDownCore-BackendSelection
        title: >-
          The library shall select one extractor deterministically from the detected format,
          current availability, and requested page-rendering preference.
        tags: [system]
        justification: |
          When more than one backend can read a format, callers need a stable policy that yields
          the same winner for the same inputs without hidden negotiation.
        children:
          - DocDownCore-Extraction-DeterministicSelection
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout

      - id: DocDownCore-BackendAvailability
        title: >-
          The library shall treat a backend that cannot run in the current environment as
          unavailable and report the reason.
        tags: [system]
        justification: |
          Backends depend on environment-specific tools and native components. Recording
          unavailability lets operators diagnose the environment instead of receiving an opaque
          crash.
        children:
          - DocDownCore-Extraction-AvailabilityProbing
        tests:
          - DocDownCore_Extract_BackendUnavailable_ReasonAppearsInSummary

      - id: DocDownCore-StructuredFailure
        title: >-
          The library shall return unreadable outcomes as structured failure data rather than
          throwing ordinary extraction errors.
        tags: [system]
        justification: |
          Batch workflows must be able to inspect failure details without catching routine
          exceptions. Returning a structured failure keeps automation in control.
        children:
          - DocDownCore-Extraction-StructuredFailure
          - DocDownCore-Extraction-ExtractorIsolation
          - DocDownCore-Extraction-TwoStateOutcome
        tests:
          - DocDownCore_Extract_UnknownFormat_ReturnsUnreadableResult
          - DocDownCore_Extract_Failure_StillWritesSummaryAndManifest

      - id: DocDownCore-Options
        title: >-
          The library shall isolate the caller's options so later mutation cannot affect an
          in-flight or completed extraction.
        tags: [system]
        justification: |
          Callers often reuse one options object across several extractions. Cloning the options at
          call time prevents later edits from corrupting another run.
        children:
          - DocDownCore-Extraction-OptionIsolation
        tests:
          - DocDownCore_Extract_OptionsMutatedAfterCall_DoNotAffectResult

      - id: DocDownCore-NotesReported
        title: >-
          The library shall record a plain-language note when it attempted an extraction step and
          could not complete it.
        tags: [system]
        justification: |
          A caller needs to know when DocDown tried to do something and could not finish, such as
          page rendering with no renderer or an undecodable image. Plain notes provide that fact
          without introducing a judgment about the document itself.
        children:
          - DocDownCore-Output-ExtractionNotes
        tests:
          - DocDownCore_Extract_PagesRequestedButUnsupported_ProducesWithNote

      - id: DocDownCore-ScratchFolderSafety
        title: >-
          The library shall confine all written artifacts to the caller-provided scratch folder and
          refuse unsafe paths or unsafe destructive reuse.
        tags: [system]
        justification: |
          Extractors process untrusted document content that can influence output names. A single
          contained write path is necessary to prevent traversal, reserved-name hazards, and
          unintended deletion of caller files.
        children:
          - DocDownCore-Output-PathSafety
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout

      - id: DocDownCore-Determinism
        title: >-
          The library shall produce byte-identical summary and manifest output for identical input
          when the timestamp is fixed.
        tags: [system]
        justification: |
          Reproducible re-runs and clean diffs depend on deterministic serializer output within one
          environment.
        children:
          - DocDownCore-Output-Determinism
        tests:
          - DocDownCore_Extract_RepeatedRun_IsByteIdentical

      - id: DocDownCore-ProvenanceReported
        title: The library shall record which tool and backend produced the extraction.
        tags: [system]
        justification: |
          Regulated workflows must be able to attribute output to the software that produced it.
          Tool and backend provenance are therefore first-class output facts.
        children:
          - DocDownCore-Output-ManifestContent
          - DocDownCore-Output-SummaryContent
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout

      - id: DocDownCore-EnvironmentReported
        title: The library shall record the runtime environment in which the extraction ran.
        tags: [system]
        justification: |
          Extraction behavior depends on the operating system, runtime, and available backends.
          Recording that environment keeps output reproducible and diagnosable.
        children:
          - DocDownCore-Output-SummaryContent
        tests:
          - DocDownCore_Extract_TextDocument_ProducesContractLayout

      - id: DocDownCore-SelfValidationSeam
        title: >-
          The library shall expose self-test cases that verify its own contract and any
          backend-contributed cases.
        tags: [system]
        justification: |
          Operators need a way to validate the deployed environment without depending only on the
          build machine's evidence.
        children:
          - DocDownCore-Extraction-SelfValidationSeam
        tests:
          - DocDownCore_GetSelfTestCases_IncludesCurrentCoreCases

      - id: DocDownCore-ImageProvenanceReported
        title: The library shall record, for every extracted image, how that image was produced.
        tags: [system]
        justification: |
          Image provenance matters whenever a consumer needs to distinguish the document's own bytes
          from a decoded and re-encoded image representation.
        children:
          - DocDownCore-Output-ImageProvenance
        tests:
          - DocDownCore_Extract_ImageProvenance_ManifestRecordsTransformPerImage

      - id: DocDownCore-ImageReferrersReported
        title: >-
          The library shall record, for every extracted image, every page of the document that
          references it, the first such page as a scalar alias, and whether the image is reached
          only through a template container.
        tags: [system]
        justification: |
          Consumers parse the extraction record to connect an extracted image back to the part of
          the document that showed it. Publishing the full referrer set, a scalar alias for readers
          that want a single page, and an explicit template-only flag gives an honest three-way
          distinction — referenced by a page, referenced only through a template, or referenced by
          nothing — without ever inventing a page for an image that has none.
        children:
          - DocDownCore-Output-ImageReferrers
        tests:
          - DocDownCore_Extract_ImageReferrers_ManifestRecordsPagesAliasAndTemplateFlag
