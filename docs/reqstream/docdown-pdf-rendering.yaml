---
# Software System Requirements for DocDown.Pdf.Rendering
#
# These requirements describe the externally visible behavior of the optional PDF
# page-rendering package from the perspective of a host that registers it, without
# specifying implementation details. Each decomposes into unit requirements linked
# below via children, and is proven by system-level tests. The OTS requirements for
# the native rasterization stack (PDFtoImage, PDFium, SkiaSharp) are linked as
# children so the package's dependence on them is traced rather than assumed.
#
# SUPERSEDED REQUIREMENT: DocDownPdfRendering-RenderedPagesCapability
# required the system to declare a superset of capabilities. It is superseded (not
# satisfied) by DocDownPdfRendering-ReportsRenderedPagesAvailability because DocDown
# now reports only whether this backend is available here and whether it provides
# rendered pages here; it no longer negotiates a capability superset. This follows
# the governing principle that DocDown reports what it extracted and where, using
# inventory counts and short factual notes rather than capability negotiation.
#
# SUPERSEDED REQUIREMENT: DocDownPdfRendering-DegradesWhenUnavailable
# required the system's absence or native unavailability to preserve a degradation
# path owned by this package. It is superseded (not satisfied) by
# DocDownPdfRendering-ReportsRenderedPagesAvailability because renderer absence is
# now reported through selection-time availability, not by a degraded extraction,
# note, gap, or diagnostic emitted by this system.
#
# SUPERSEDED REQUIREMENT: DocDownPdfRendering-PerPageFailureBecomesCountedGap
# required a per-page rasterization fault to become a counted gap with a reason. It
# is superseded (not satisfied) by DocDownPdfRendering-PerPageFailureReportedAsNote
# because DocDown now records only the factual note that the attempted page could
# not be rasterized and continues with normal completion.

sections:
  - title: DocDownPdfRendering Requirements
    requirements:
      - id: DocDownPdfRendering-Registration
        title: >-
          The system shall register its page-rendering extractor through a single extension method
          without reflection or assembly scanning.
        tags: [system]
        justification: |
          A host must be able to read its own dependency graph off its own code, and this is the one
          package whose registration also pulls a native stack into the process. One explicit call
          keeps that edge visible and reviewable, and keeps single-file publishing viable because no
          backend is discovered by scanning.
        children:
          - DocDownPdfRendering-PdfRenderingDocDownBuilderExtensions-RegistersExtractor
          - DocDownPdfRendering-PdfRenderingDocDownBuilderExtensions-ReflectionFree
          - DocDownPdfRendering-PdfRenderingDocDownBuilderExtensions-ReturnsBuilderForChaining
          - DocDownPdfRendering-PdfRenderingDocDownBuilderExtensions-RejectsNullBuilder
          - DocDownPdfRendering-PdfRenderingDocDownBuilderExtensions-NoNativeTypeOnSurface
        tests:
          - AddPdfRendering_OnBuilder_RegistersRenderingExtractor

      - id: DocDownPdfRendering-ReportsRenderedPagesAvailability
        title: >-
          The system shall report itself available with rendered-page support when the native
          renderer can run, and unavailable with a reason when it cannot.
        tags: [system]
        justification: |
          Page rendering is the one environment-dependent fact selection needs from this package.
          Reporting rendered-page support only when the native stack is actually usable lets Core
          choose this backend before any document is opened, and reporting a reason when it is not
          usable keeps the outcome explainable without this system emitting its own extraction note.
        children:
          - DocDownPdfRendering-PdfPageRenderingExtractor-ReportsRenderedPagesAvailability
        tests:
          - PdfPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReflectsNativeStackWithoutThrowing

      - id: DocDownPdfRendering-RendersPagesToPng
        title: The system shall render requested document pages to PNG images in the pages folder.
        tags: [system]
        justification: |
          Rendered page images are the reason this package exists: a scanned or heavily graphical PDF
          carries information no text extractor can recover, and a faithful page raster is what a
          multimodal consumer needs. The output must be a real, decodable image, not merely a file.
        children:
          - DocDownPdfRendering-PdfPageRenderingExtractor-WritesRenderedPages
          - DocDownPdfRendering-PageRenderer-RendersPageToPng
          - DocDownPdfRendering-PageRenderer-RejectsNullDocument
          - DocDown-OTS-PDFtoImage
        tests:
          - DocDownPdfRendering_Render_GeneratedPdf_ProducesValidPngPages
          - PdfPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs

      - id: DocDownPdfRendering-SelectedWhenPagesRequested
        title: The system shall be selected over the managed PDF backend when page rendering is requested.
        tags: [system]
        justification: |
          A caller who asks for rendered pages must get them when an available backend reports that it
          can provide them in this environment. Because both backends serve the PDF format, selection
          must prefer the backend that can actually produce page images here rather than the lighter
          managed backend that cannot.
        tests:
          - DocDownPdfRendering_Select_PagesRequested_RenderingBackendWins

      - id: DocDownPdfRendering-BaseSelectedWhenNotRequested
        title: >-
          The system shall not be selected over the managed PDF backend when page rendering is not
          requested.
        tags: [system]
        justification: |
          A plain extraction should pay nothing for rendered-page work it did not ask for, including the
          cost of loading a native stack. When rendering is not requested the lighter managed backend
          must win, so no native code is touched.
        tests:
          - DocDownPdfRendering_Select_PagesNotRequested_BaseBackendWins

      - id: DocDownPdfRendering-ProbeCheapAndSafe
        title: >-
          The system shall report its availability cheaply and without throwing, never rasterizing in
          the probe.
        tags: [system]
        justification: |
          Availability is probed on every engine build, including for plain extractions that never
          render. A probe that rasterized, opened the document, or threw would tax every extraction
          and could abort selection, so it must be a cheap, non-throwing check.
        children:
          - DocDownPdfRendering-PdfPageRenderingExtractor-ProbeIsCheapAndSafe
          - DocDownPdfRendering-PageRenderer-ProbeCheapAndNonThrowing
        tests:
          - PdfPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReflectsNativeStackWithoutThrowing
          - PageRenderer_ProbeAvailability_AnyEnvironment_ReflectsUsabilityWithoutThrowing

      - id: DocDownPdfRendering-ProbeReportsUnavailableWithReason
        title: >-
          The system shall report itself unavailable, with a reason, when the native rasterization
          stack cannot load for the current runtime identifier.
        tags: [system]
        justification: |
          A missing or incompatible native binary is a real deployment condition, and an unavailable
          backend reported without a cause turns a fixable environment problem into a mystery. The
          reason is what lets selection report the situation honestly and lets an operator act.
        children:
          - DocDownPdfRendering-PageRenderer-ReportsUnavailableWithReason
        tests:
          - NativeProbeResult_Unavailable_CarriesReason

      - id: DocDownPdfRendering-PerPageFailureReportedAsNote
        title: >-
          The system shall report any per-page rasterization failure as a plain one-sentence note
          naming the page, continue with the remaining pages, and still complete normally.
        tags: [system]
        justification: |
          Rendering can fail on one page — an unsupported page, an out-of-memory at a high DPI, or a
          native fault — while the rest succeed. Recording only the factual note that the attempted
          page could not be rasterized keeps the run alive and keeps the report aligned with DocDown's
          reduced output model: report what was attempted and what was produced, without adding an
          acceptability judgement.
        children:
          - DocDownPdfRendering-PdfPageRenderingExtractor-ReportsPageFailuresAsNotes
        tests:
          - PdfPageRenderingExtractor_ExtractAsync_PageRenderFaults_ReportsNoteWithoutThrowing

      - id: DocDownPdfRendering-HonorsDpi
        title: The system shall render pages at the requested dots-per-inch.
        tags: [system]
        justification: |
          The DPI trades output fidelity against file size, and a caller that sets it expects the
          raster to change accordingly. Ignoring it would make the option meaningless and the output
          unpredictable.
        tests:
          - DocDownPdfRendering_Render_HigherDpi_ProducesLargerPage

      - id: DocDownPdfRendering-HonorsPageRange
        title: The system shall rasterize only the pages within a requested page range.
        tags: [system]
        justification: |
          A caller working with a large document needs a bounded slice, and rasterization is the most
          expensive step. Rendering pages outside the requested range would waste the most time and
          contradict the request.
        tests:
          - DocDownPdfRendering_Render_PageRange_RestrictsRenderedPages

      - id: DocDownPdfRendering-ManagedInputsDelegated
        title: >-
          The system shall produce the text, embedded images, and document metadata by delegating to
          the managed PDF backend rather than re-implementing them.
        tags: [system]
        justification: |
          The managed backend already extracts text, images, and metadata faithfully. Delegating to it
          — with rendering suppressed on the delegate — keeps a single source of truth for those
          aspects and confines this package to the one thing it adds, rasterization.
        children:
          - DocDownPdfRendering-PdfPageRenderingExtractor-DelegatesManagedAspects
        tests:
          - PdfPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs

      - id: DocDownPdfRendering-NativeCallsSerialized
        title: The system shall serialize its native rasterization calls process-wide.
        tags: [system]
        justification: |
          PDFium is not thread-safe. Two concurrent extractions that both render would corrupt the
          shared native renderer's state. Serializing every native call is the price of a native
          library that was never designed for concurrency, and it must be paid rather than left latent.
        children:
          - DocDownPdfRendering-PageRenderer-SerializesNativeCalls
        tests:
          - PageRenderer_Render_ConcurrentCalls_AllProduceValidPng

      - id: DocDownPdfRendering-Determinism
        title: >-
          The system shall produce byte-identical rendered pages across repeated renders of the same
          document in the same environment.
        tags: [system]
        justification: |
          Reproducible output is what lets a consumer diff two extractions and conclude the document
          changed. Without it every re-render looks like a change and the diff becomes useless as a
          signal.
        tests:
          - DocDownPdfRendering_Render_Deterministic_ProducesByteIdenticalPages

      - id: DocDownPdfRendering-SelfValidation
        title: >-
          The system shall contribute a self-validation case that proves the native stack genuinely
          rasterizes in the deployed environment.
        tags: [system]
        justification: |
          Declared availability is not proof for a native stack; only a real render is. A contributed
          case that rasterizes the embedded document lets an operator confirm rendering
          works where it is installed, and reports a reasoned skip where the native stack is absent.
        children:
          - DocDownPdfRendering-PdfPageRenderingExtractor-ContributesSelfTests
        tests:
          - PdfPageRenderingExtractor_GetSelfTestCases_AnyEnvironment_ReportsHonestRenderCaseStatus
