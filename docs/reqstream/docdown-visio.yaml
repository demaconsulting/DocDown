---
# Software System Requirements for DocDown.Visio
#
# These requirements describe the externally visible behavior of the Visio extraction package
# from the perspective of a host that registers it, without specifying implementation details.
# Each decomposes into subsystem and unit requirements linked below via children, and is proven
# by the Visio test suite. DocDown.Visio has three subsystems (Com, Markdown, OpenXml) and one
# direct unit (VisioDocDownBuilderExtensions).
#
# A Visio drawing is an engineering schematic, so these requirements are traced forward from the
# package intent: recover each page name, the text of the shapes that carry text, and the
# directed connections between shapes from the file itself, with no Visio installation present,
# and add a rendered image of each page when Microsoft Visio is available. DocDown reports what
# it extracted and where. The reporting surface here is therefore limited to looked-for content
# inventory and short plain notes describing a step DocDown attempted but could not complete.
# Legacy binary `.vsd` drawings remain unsupported and are refused plainly.
#
# SUPERSEDED REQUIREMENT: DocDownVisio-RenderingUnavailableGap required a counted pages gap when
# rendering was requested but no renderer was available. That requirement treated an
# environment-specific shortfall as a degradation model concern. The current reporting model uses
# a short plain note for attempted-but-unfinished steps, so the behavior is superseded by
# DocDownVisio-RenderingRequestNote.
#
# SUPERSEDED REQUIREMENT: DocDownVisio-PageRenderFidelity required a counted gap and diagnostic
# when an individual page could not be rendered. The COM backend now records a one-sentence note
# for the page and continues, so the requirement is superseded by
# DocDownVisio-Com-VisioComExtractor-ReportsPageRenderFailureNotes.
#
# SUPERSEDED REQUIREMENT: DocDownVisio-VectorImages required extra commentary for EMF and WMF
# images. Vector images are now written as embedded images without extra commentary unless a
# caller-requested PNG conversion step could not be completed. No direct replacement is needed.
#
# SUPERSEDED REQUIREMENT: DocDownVisio-EmptyDrawing required a counted gap when a drawing had no
# pages. A drawing with no pages is now reported through looked-for content inventory with zero
# counts and an empty content file, so the requirement is superseded by
# DocDownVisio-Markdown-VisioContentEmitter-ReportsEmptyDrawingInInventory.
#
# SUPERSEDED REQUIREMENT: DocDownVisio-DeclaredCapabilities described the retired capability-set
# selection model. Selection now relies on supported formats, page-rendering applicability, and
# availability, so the observable behavior is superseded by
# DocDownVisio-OpenXml-VisioOpenXmlExtractor-ParticipatesInSelection,
# DocDownVisio-OpenXml-VisioOpenXmlExtractor-ProbesUnconditionally,
# DocDownVisio-Com-VisioComExtractor-ParticipatesInSelection, and
# DocDownVisio-RenderingAvailability.

sections:
  - title: DocDownVisio Requirements
    requirements:
      - id: DocDownVisio-Registration
        title: >-
          The system shall register its Visio backends through an explicit extension method without
          reflection or assembly scanning.
        tags: [system]
        justification: |
          A host must be able to read its own dependency graph off its own code. Registration that
          happens because a package is present on disk makes the set of active backends a deployment
          accident rather than a decision, which cannot be audited; one explicit call keeps the edge
          from host to backend visible and reviewable. Visio registers two backends — a guaranteed
          managed content backend and an environment-dependent rendering backend — so the single call
          must add both without hiding either.
        children:
          - DocDownVisio-VisioDocDownBuilderExtensions-RegistersBothBackends
          - DocDownVisio-VisioDocDownBuilderExtensions-OrdersManagedAboveCom
          - DocDownVisio-VisioDocDownBuilderExtensions-ReturnsBuilderForChaining
          - DocDownVisio-VisioDocDownBuilderExtensions-RejectsNullBuilder
        tests:
          - AddVisio_RegistersOpenXmlAndComBackends

      - id: DocDownVisio-Extraction
        title: >-
          The system shall extract each page of a drawing as content — its name, its shape text,
          and the directed connections between its shapes — along with its images and metadata,
          into the DocDown output contract.
        tags: [system]
        justification: |
          The package exists to turn a drawing into the invariant DocDown output layout so a
          downstream agent sees the same artifacts it sees for every other format. A schematic's
          meaning is carried by which shapes exist, what they are labeled, which page they belong to,
          and how they are connected, so extracting that from the file itself is what makes the
          schematic's logical content recoverable on any machine and in CI.
        children:
          - DocDownVisio-OpenXml-Extraction
          - DocDownVisio-OpenXml-Reading
          - DocDownVisio-Markdown-ModelEmission
        tests:
          - DocDownVisio_Extract_Vsdx_SelectsOpenXml

      - id: DocDownVisio-PageNames
        title: The system shall extract the name of every page.
        tags: [system]
        justification: |
          Engineers navigate and cite a drawing by page name, so a page's name is the first thing
          that makes its content findable. A backend that dropped the page names would leave a
          reader unable to say which page a shape or a connection belongs to, so the name of every
          page is surfaced as the heading of that page's content.
        children:
          - DocDownVisio-OpenXml-VisioPackageReader-SurfacesPageNames
          - DocDownVisio-Markdown-VisioContentEmitter-WritesPageName
        tests:
          - DocDownVisio_Extract_TwoPages_SurfacesEveryPageName

      - id: DocDownVisio-ShapeText
        title: The system shall extract the text of every shape that carries text.
        tags: [system]
        justification: |
          Labels carry the identity of the modeled things: a shape's text is the part number, the
          designation, or the name whoever drew the schematic gave it. That text is recoverable from
          the file with no rendering, so it is extracted from the drawing itself as the guaranteed
          outcome no environment can take away, preserved intact including the multi-line fittings
          lists and valve-positioning tables shapes carry.
        children:
          - DocDownVisio-OpenXml-VisioPackageReader-ExtractsShapeText
          - DocDownVisio-Markdown-VisioContentEmitter-WritesShapeText
        tests:
          - VisioPackageReader_Read_WashSystem_ExtractsShapeText

      - id: DocDownVisio-Topology
        title: >-
          The system shall resolve the drawing's connectors into directed connections between shapes
          and render them as a readable source-to-target topology.
        tags: [system]
        justification: |
          A list of disconnected strings is not a schematic: the topology is the engineering content.
          The direction is carried by which connector record names each endpoint, so a connector that
          reads "Inlet Tank" at its begin and "Transfer Pump" at its end becomes the directed edge
          "Inlet Tank -> Transfer Pump". Resolving each connector into a real directed edge between
          named shapes, page by page, is what turns the drawing's own wiring into content a reader
          and an agent can follow.
        children:
          - DocDownVisio-OpenXml-VisioPackageReader-ResolvesDirectedTopology
          - DocDownVisio-Markdown-VisioContentEmitter-RendersDirectedTopology
        tests:
          - DocDownVisio_Extract_WashSystem_RecoversDirectedTopology

      - id: DocDownVisio-TopologyProvenance
        title: >-
          The system shall record whether each rendered topology endpoint came from the shape's own
          text, its master type, or only a shape id, and shall state the labeling convention in the
          content whenever a rendered label is not authored text.
        tags: [system]
        justification: |
          The Visio intent asks for the directed source-to-target edges and no more; recording how an
          endpoint label was obtained is an additional honesty measure this backend provides, covered
          because it is genuinely tested rather than to retro-justify code. Its value is real: a
          label derived from a shape's master type is useful, but it must not be mistaken for a name
          someone authored, and a bare shape id must remain plainly unresolved rather than guessed.
        children:
          - DocDownVisio-Markdown-TopologyLabeling
        tests:
          - VisioShapeLabeler_Convention_DescribesEveryRenderedForm

      - id: DocDownVisio-NoInstallationRequired
        title: >-
          The system shall recover a drawing's page names, shape text, and directed topology with no
          Visio installation present.
        tags: [system]
        justification: |
          The schematic's logical content must be recoverable on any machine and in CI, where no
          Office application is installed. The managed backend reads the Open Packaging container
          directly and probes available everywhere the package can load, so the guaranteed content
          path never depends on Microsoft Visio.
        children:
          - DocDownVisio-OpenXml-VisioOpenXmlExtractor-ProbesUnconditionally
        tests:
          - DocDownVisio_Extract_Vsdx_SelectsOpenXml

      - id: DocDownVisio-PageRendering
        title: The system shall render each page to an image when Microsoft Visio is available.
        tags: [system]
        justification: |
          Spatial arrangement — layout, grouping, and relative position — is itself engineering
          meaning and cannot be fully recovered from the file's XML, so the rendered appearance of
          each page is captured when an environment can supply it. Rendering is therefore added by
          the COM backend while the managed backend continues to supply the guaranteed content path.
        children:
          - DocDownVisio-Com-Rendering
          - DocDownVisio-Com-Automation
        tests:
          - VisioComExtractor_Extract_ViaStub_WritesTopologyAndRendersEveryPage

      - id: DocDownVisio-RenderingRequestNote
        title: >-
          The system shall keep the extracted content and record a plain note when page rendering was
          requested but no renderer is available in the current environment.
        tags: [system]
        justification: |
          Rendering is an attempted step that a better environment may be able to complete, so its
          absence must be reported plainly and briefly rather than inferred from a missing `pages/`
          folder. The note lets a caller distinguish "rendering was requested but unavailable here"
          from "rendering was never attempted", while the guaranteed content still reaches the
          output.
        tests:
          - DocDownVisio_Extract_RenderRequestedWithoutVisio_RecordsNoteButKeepsTopology

      - id: DocDownVisio-RenderingAvailability
        title: >-
          The system shall report the rendering backend as unavailable, with a declarative reason
          that instructs no installation, where Microsoft Visio cannot be reached.
        tags: [system]
        justification: |
          Rendering is environment-dependent, so honesty must be enforced at selection: off Windows
          or without Microsoft Visio registered, the COM backend must report unavailable rather than
          be selected and fail. The reason states a fact about the environment the reader cannot act
          on — it never instructs an installation — matching the library-wide convention.
        children:
          - DocDownVisio-Com-Availability
          - DocDownVisio-Com-VisioComExtractor-ProbesHonestly
        tests:
          - VisioComAvailability_Probe_NeverInstructsInstallation

      - id: DocDownVisio-EmbeddedImages
        title: >-
          The system shall write a drawing's embedded images into the images folder, link them from
          the page that shows them, and record which page each belongs to, excluding the package
          thumbnail.
        tags: [system]
        justification: |
          A drawing can embed a photograph or a raster diagram through a foreign-data shape, and a
          text-only extraction discards it silently. Writing the images out, linking them inline
          under the page section, and recording the page association — distinguishing a page
          reference from template furniture on a master, and excluding the package thumbnail which is
          document furniture rather than embedded content — keeps a consumer's view of the drawing
          complete and keeps an image citable back to the page it appears on.
        children:
          - DocDownVisio-OpenXml-Images
          - DocDownVisio-Markdown-VisioContentEmitter-LinksImages
        tests:
          - DocDownVisio_Extract_PageWithVectorImage_ProducesLayoutAndEmfImage
          - VisioContentEmitter_Emit_WithRasterImages_WritesThroughSink

      - id: DocDownVisio-LegacyFormatRefusal
        title: >-
          The system shall refuse a legacy binary Visio drawing with an unreadable result whose
          explanation states plainly that the format is unsupported, and without an exception
          reaching the caller.
        tags: [system]
        justification: |
          This package reads Open Packaging drawings and nothing else, and DocDown does not support
          the legacy binary formats at all — no future version and no different installation will
          ever extract a `.vsd`. A caller who hands the engine one therefore deserves a plain
          statement of that fact with the full output layout still written, not an exception and not
          a suggestion that some missing component could make the format readable.
        tests:
          - DocDownVisio_Extract_LegacyVsd_ReturnsUnreadableFailure

      - id: DocDownVisio-SelfValidation
        title: The system shall contribute self-validation cases describing its own extraction behavior.
        tags: [system]
        justification: |
          An operator needs to confirm the backends actually work where they are deployed, not merely
          that they are present. The managed backend contributes a round-trip case that builds a
          drawing with a directed edge, reads it back, and confirms the connection resolved — proving
          the topology path is genuinely functional — plus an honest skip for the page-rendering case
          that belongs to the COM backend.
        children:
          - DocDownVisio-OpenXml-VisioOpenXmlExtractor-ContributesSelfTests
        tests:
          - VisioOpenXmlExtractor_SelfTestCases_RoundTripPassesAndRenderingSkipped
