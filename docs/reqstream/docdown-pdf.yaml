---
# Software System Requirements for DocDown.Pdf
#
# These requirements describe the externally visible behavior of the managed PDF extraction package
# from the perspective of a host that registers it.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-DeclaredCapabilities
# required capability-negotiation behavior that no longer exists. It is superseded, not satisfied,
# because DocDown now reports only what it extracted and where and makes no acceptability judgment;
# the managed PDF backend no longer publishes a `Capabilities` surface. The supported extractor
# surface is now covered by DocDownPdf-PdfDocumentExtractor-DescribesSupportedContract and
# DocDownPdf-PdfDocumentExtractor-ProbeIsCheapAndSafe.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-NoPageRendering
# required rendered-page capability language and a backend-local explanation gap. It is superseded,
# not satisfied, because DocDown now reports what it extracted and where and makes no acceptability
# judgment; the managed PDF backend records no capability negotiation or gap. The replacement is
# DocDownPdf-PageRenderingRequestUsesNote.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-NoTextLayerDegradation
# required a degradation state and explicit no-text-layer gap. It is superseded, not satisfied,
# because DocDown now reports what it extracted and where and makes no acceptability judgment.
# Text-free PDFs are replaced by produced output plus factual counts, covered by
# DocDownPdf-ScannedPdfProducesImageBackedOutput and
# DocDownPdf-PdfDocumentExtractor-ReportsContentInventory.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-EmptyDocument
# required an explicit empty-document gap. It is superseded, not satisfied, because DocDown now
# reports what it extracted and where and makes no acceptability judgment; a zero-page PDF is
# reported through the content inventory instead. The replacement is
# DocDownPdf-EmptyDocumentReportsZeroCountInventory.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-ImageOutput
# required counted gaps for suppressed images, size-limited skips, and unhonored PNG requests. It is
# superseded, not satisfied, because DocDown now reports what it extracted and where and makes no
# acceptability judgment. Attempted-but-incomplete image work is now described with plain notes by
# DocDownPdf-ImageSizeLimitsUseNotes; deliberate suppression is covered by
# DocDownPdf-ImageSuppressionUsesNote.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-ForcePngUsesNote
# required a plain note whenever a requested PNG output could not be honored. It is superseded (not
# satisfied) with no replacement because the caller-facing PNG request was removed under the
# simplicity principle: the option never converted anything, it only counted what it could not
# convert, so with the request gone there is nothing left to report. Images are written in whatever
# format the document stored them in, and DocDownPdf-PdfImageExtractor-RecordsTransformProvenance
# still records how each written image was produced.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-GapReporting
# required counted gaps as the general absence-reporting mechanism. It is superseded, not satisfied,
# because DocDown now reports what it extracted and where and makes no acceptability judgment.
# Missing attempted work is now covered by plain notes and zero counts through
# DocDownPdf-UndecodableImagesUseNotes and DocDownPdf-PdfDocumentExtractor-ReportsContentInventory.

sections:
  - title: DocDownPdf Requirements
    requirements:
      - id: DocDownPdf-Registration
        title: >-
          The system shall register its PDF extractor through a single extension method without
          reflection or assembly scanning.
        tags: [system]
        justification: |
          A host must be able to read its own dependency graph off its own code. Registration that
          happens because a package is present on disk makes the set of active backends a deployment
          accident rather than a decision, which cannot be audited; one explicit call keeps the edge
          from host to backend visible and reviewable.
        children:
          - DocDownPdf-PdfDocDownBuilderExtensions-RegistersSupportedPdfExtractor
          - DocDownPdf-PdfDocDownBuilderExtensions-ReflectionFree
          - DocDownPdf-PdfDocDownBuilderExtensions-ReturnsBuilderForChaining
          - DocDownPdf-PdfDocDownBuilderExtensions-RejectsNullBuilder
          - DocDownPdf-PdfDocumentExtractor-DescribesSupportedContract
          - DocDownPdf-PdfDocumentExtractor-ProbeIsCheapAndSafe
          - DocDownPdf-PdfDocumentExtractor-ReportsEnvironmentFacts
        tests:
          - DocDownPdf_Extract_SimpleTextPdf_ProducesContractLayout

      - id: DocDownPdf-TextContent
        title: The system shall extract the textual content of a PDF into the content document in reading order.
        tags: [system]
        justification: |
          A PDF stores positioned glyphs in the order a producer chose to paint them, which for a
          multi-column page is not the order a human reads them. Consumers feeding the output to a
          language model need the reading order, because text delivered in paint order is misleading
          in a way that is hard to detect downstream.
        children:
          - DocDownPdf-PdfTextExtractor-ReadingOrder
          - DocDownPdf-PdfTextExtractor-AvoidsRawPageText
          - DocDownPdf-PdfTextExtractor-MarksPageBoundaries
          - DocDown-OTS-PdfPig-TextExtraction
        tests:
          - DocDownPdf_Extract_SimpleTextPdf_ProducesContractLayout
          - DocDownPdf_Extract_MultiPagePdf_ReportsPageCountAndAllText

      - id: DocDownPdf-EmbeddedImages
        title: The system shall extract embedded images into the images folder and link them from the content document.
        tags: [system]
        justification: |
          Much of a document's information is carried in its figures, and a text-only extraction
          silently discards it. Writing the images out and linking them from the content keeps a
          consumer's view of the document complete rather than textually complete.
        children:
          - DocDownPdf-PdfImageExtractor-JpegPassthrough
          - DocDownPdf-PdfImageExtractor-DecodesToPng
          - DocDownPdf-PdfImageExtractor-WritesJpeg2000Passthrough
          - DocDownPdf-PdfTextExtractor-LinksImages
          - DocDownPdf-PdfImageExtractor-ReportsImageHints
          - DocDownPdf-PdfImageExtractor-HonorsSuppression
          - DocDown-OTS-PdfPig-ImageExtraction
        tests:
          - DocDownPdf_Extract_DctImage_RoundTripsByteIdenticalAsPassthrough
          - DocDownPdf_Extract_FlateImage_IsLabeledDecodedToPng
          - DocDownPdf_Extract_Jpeg2000Image_WritesJp2Passthrough

      - id: DocDownPdf-ImageProvenance
        title: >-
          The system shall state, for every image it extracts, whether the bytes were passed through
          unchanged or decoded and re-encoded.
        tags: [system]
        justification: |
          A consumer deciding whether an extracted image is usable as evidence of the original needs
          to know whether it is the original. Describing a re-encoding as an unchanged copy would be
          false in the machine-readable record, and a record that is false anywhere is hard to rely
          on anywhere.
        children:
          - DocDownPdf-PdfImageExtractor-RecordsTransformProvenance
        tests:
          - DocDownPdf_Extract_DctImage_RoundTripsByteIdenticalAsPassthrough
          - DocDownPdf_Extract_FlateImage_IsLabeledDecodedToPng
          - DocDownPdf_Extract_Jpeg2000Image_WritesJp2Passthrough

      - id: DocDownPdf-DocumentMetadata
        title: The system shall report the document title, author, and page count.
        tags: [system]
        justification: |
          Downstream indexing and routing decisions are made on document metadata before any content
          is read. Reporting what the document itself declares, and reporting nothing where it
          declares nothing, lets those decisions be made on facts rather than guesses.
        children:
          - DocDownPdf-PdfDocumentExtractor-ReportsDocumentInfo
          - DocDown-OTS-PdfPig-DocumentMetadata
        tests:
          - DocDownPdf_Extract_MultiPagePdf_ReportsPageCountAndAllText

      - id: DocDownPdf-PageRenderingRequestUsesNote
        title: >-
          The system shall report a plain note and write no rendered-page files when page rendering is
          requested from the managed PDF extractor.
        tags: [system]
        justification: |
          This package does not rasterize pages. A caller who requested rendered pages needs that fact
          stated plainly in the extraction record, but DocDown's governing principle is to report what
          was extracted and where rather than to emit selection-time or acceptability judgments.
        tests:
          - DocDownPdf_Extract_PagesRequested_ProducesPlainNoteAndNoRenderedPages

      - id: DocDownPdf-ScannedPdfProducesImageBackedOutput
        title: >-
          The system shall produce page markers and extracted images for a scanned PDF without adding
          an extraction note merely because the page carried no glyphs.
        tags: [system]
        justification: |
          A scanned page may have no text layer and still contain useful content in its embedded
          image. Reporting that outcome through the extracted content and inventory, rather than as a
          defect judgment, keeps the record factual.
        children:
          - DocDownPdf-PdfDocumentExtractor-ReportsContentInventory
          - DocDownPdf-PdfTextExtractor-ReportsZeroTextCounts
          - DocDownPdf-PdfTextExtractor-LinksImages
        tests:
          - DocDownPdf_Extract_ScannedPdfWithNoTextLayer_ProducesImageBackedOutput

      - id: DocDownPdf-EmptyDocumentReportsZeroCountInventory
        title: >-
          The system shall report zero counts for pages, headings, paragraphs, and inline images when
          a PDF contains no pages.
        tags: [system]
        justification: |
          A valid zero-page PDF did not fail extraction; it simply yielded no content. Reporting zero
          counts keeps that distinction visible without turning ordinary document absence into a
          judgment about the document.
        children:
          - DocDownPdf-PdfDocumentExtractor-ReportsContentInventory
        tests:
          - DocDownPdf_Extract_ZeroPagePdf_ProducesZeroCountInventory

      - id: DocDownPdf-UndecodableImagesUseNotes
        title: >-
          The system shall report undecodable embedded images as a plain note naming their encodings
          and counts.
        tags: [system]
        justification: |
          An image the extractor attempted and could not decode is exactly the case where silence
          would mislead a consumer into thinking the output is complete. A short factual note states
          what happened without characterizing the document.
        children:
          - DocDownPdf-PdfImageExtractor-NotesUndecodableEncodings
        tests:
          - DocDownPdf_Extract_UndecodableImage_ReportsPlainNoteNamingEncoding

      - id: DocDownPdf-ImagesKeepSourceEncoding
        title: >-
          The system shall write each embedded image in the encoding the document stored it in and
          keep written images truthfully typed.
        tags: [system]
        justification: |
          DocDown exposes document content rather than re-encoding it, so a reader receives the
          document's own bytes; the file name and media type therefore always describe the bytes
          actually written.
        children:
          - DocDownPdf-PdfImageExtractor-RecordsTransformProvenance
        tests:
          - DocDownPdf_Extract_JpegImage_WritesDocumentsOwnEncoding

      - id: DocDownPdf-ImageSizeLimitsUseNotes
        title: >-
          The system shall report a plain note when a caller-supplied image size or dimension limit
          prevents an image from being written.
        tags: [system]
        justification: |
          A size limit reflects caller policy rather than document unreadability. Reporting the skip as
          a factual note keeps the reason visible and distinct from a decode failure.
        children:
          - DocDownPdf-PdfImageExtractor-HonorsSizeLimits
        tests:
          - DocDownPdf_Extract_ImageOverSizeLimit_ReportsSeparateSkipNote

      - id: DocDownPdf-ImageSuppressionUsesNote
        title: >-
          The system shall record caller-disabled embedded-image extraction and emit no dangling image
          links.
        tags: [system]
        justification: |
          When a caller disables embedded images, the absence is deliberate and should be recorded as
          such. The content document must also remain truthful by omitting links to files that were
          never written.
        children:
          - DocDownPdf-PdfTextExtractor-LinksImages
        tests:
          - DocDownPdf_Extract_ImagesDisabled_SuppressesImagesWithNote

      - id: DocDownPdf-ManagedOnly
        title: The system shall ship no native assets and no runtime-identifier-specific dependencies.
        tags: [system]
        justification: |
          A package carrying native assets must be built, tested, and shipped per platform, and fails
          at run time on any platform it was not built for. Staying fully managed makes the package
          deployable anywhere the runtime is, which is the property that lets extraction run
          identically in a container, on a developer machine, and in CI.
        children:
          - DocDown-OTS-PdfPig
        tests:
          - DocDownPdf_Package_BuildOutput_ContainsNoNativeAssets
          - DocDownPdf_Package_ContainsNoNativeAssets

      - id: DocDownPdf-ContainedDependency
        title: The system shall expose no third-party PDF-library type on its public API surface.
        tags: [system]
        justification: |
          The underlying parser is pre-1.0 and changes its public API on minor versions. If its types
          reached this package's surface, every such change would become a breaking change for every
          consumer; confining them keeps the parser replaceable without a consumer ever noticing.
        tests:
          - DocDownPdf_PublicApi_AllPublicMembers_ExposeNoPdfPigTypes

      - id: DocDownPdf-ProtectedDocument
        title: >-
          The system shall return an unreadable result, without an exception reaching the caller, when
          a PDF is encrypted or otherwise protected.
        tags: [system]
        justification: |
          Batch pipelines process documents they did not choose, and a protected document must not be
          able to abort the run. A structured unreadable result that still writes the full output
          layout lets the pipeline record the outcome and continue.
        children:
          - DocDownPdf-PdfDocumentExtractor-MapsParserFailures
          - DocDown-OTS-PdfPig-ProtectedDocuments
        tests:
          - DocDownPdf_Extract_EncryptedPdf_ReturnsUnreadableResultAndWritesFullLayout

      - id: DocDownPdf-MalformedDocument
        title: >-
          The system shall return an unreadable result, without an exception reaching the caller, when
          a PDF is malformed.
        tags: [system]
        justification: |
          Corrupted and truncated documents are routine in real corpora. Treating them as data rather
          than as faults keeps a batch run's results complete and its failures attributable to the
          specific document that caused them.
        children:
          - DocDownPdf-PdfDocumentExtractor-MapsParserFailures
        tests:
          - DocDownPdf_Extract_MalformedPdf_ReturnsUnreadableResultAndWritesFullLayout

      - id: DocDownPdf-PageRange
        title: The system shall restrict extraction to a requested page range.
        tags: [system]
        justification: |
          Callers working with large documents need a bounded slice, and extracting the whole document
          and discarding the remainder wastes time and produces output that contradicts the request.
          Honoring the range makes the cost proportional to what was asked for.
        children:
          - DocDownPdf-PdfDocumentExtractor-HonorsPageRange
        tests:
          - DocDownPdf_Extract_PageRangeRequested_RestrictsToRange

      - id: DocDownPdf-Determinism
        title: >-
          The system shall produce byte-identical artifacts across repeated extractions of the same
          document in the same environment.
        tags: [system]
        justification: |
          Reproducible output is what lets a consumer diff two extractions and conclude that the
          document changed. Without it every re-extraction looks like a change, and the diff becomes
          useless as a signal.
        tests:
          - DocDownPdf_Extract_SameDocumentTwice_ProducesByteIdenticalArtifacts

      - id: DocDownPdf-SelfValidation
        title: The system shall contribute self-validation cases describing its own extraction behavior.
        tags: [system]
        justification: |
          An operator needs to confirm a backend actually works where it is installed, not merely that
          it is present. Cases the backend contributes about itself, including a truthful skipped
          page-rendering case, make that confirmation available on demand.
        children:
          - DocDownPdf-PdfDocumentExtractor-ContributesSelfTests
          - DocDown-OTS-PdfPig-DocumentCreation
        tests:
          - DocDownPdf_SelfValidation_RegisteredEngine_ReportsPdfCases
