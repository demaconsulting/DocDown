---
# Software System Requirements for DocDown.Tool
#
# These requirements describe the externally visible behavior of the docdown command-line
# tool from the perspective of someone invoking it, without specifying implementation
# details. Each decomposes into subsystem and unit requirements linked below via children,
# and is proven by system-level tests. DocDown.Tool has two subsystems (Cli, SelfTest) and
# one direct unit (Program).
#
# SUPERSEDED REQUIREMENT: DocDownTool-ListBackends required the backend inventory to include
# capabilities. The CLI surface was reduced so the tool now reports only each backend's
# identifier and display name, supported formats, and availability status, including the
# unavailable reason when present. The requirement is superseded (not satisfied) by
# DocDownTool-BackendInventory.
#
# SUPERSEDED REQUIREMENT: DocDownTool-VerifyFolder required a separate contract-verification
# command. The ContractVerifier and the --verify surface were removed when DocDown.Tool was
# reduced to extraction reporting and self-validation only. This requirement is retired with
# no replacement.

sections:
  - title: DocDownTool Requirements
    requirements:
      - id: DocDownTool-Extraction
        title: >-
          The tool shall extract a document into a scratch folder and, when output is produced,
          report that the output layout was written and print the absolute path to summary.txt.
        tags: [system]
        justification: |
          The tool exists to turn a document into the DocDown output layout from a shell or a
          pipeline. Reporting that output was produced and printing the absolute path to the
          summary gives the caller a single, unambiguous handle to the result that a later step
          can consume without re-deriving where the output went.
        children:
          - DocDownTool-Program-Extraction
        tests:
          - DocDownTool_Extract_GeneratedPdf_PrintsAbsoluteSummaryPathAndExitsZero

      - id: DocDownTool-ExtractionNotes
        title: >-
          The tool shall report recorded extraction notes in short plain prose and direct the
          caller to summary.txt for detail.
        tags: [system]
        justification: |
          DocDown reports what it extracted and where. When an extraction records notes, the caller
          needs a concise signal at the console and a stable place to read the detail later.
          Reporting only the note count in plain prose keeps the command-line surface brief while
          the summary remains the detailed record.
        tests:
          - DocDownTool_Extract_NoImages_ReportsRecordedNoteInSummaryAndManifest

      - id: DocDownTool-StructuredFailure
        title: >-
          The tool shall write the extraction failure explanation to standard error and exit
          non-zero when an input is unreadable.
        tags: [system]
        justification: |
          A batch caller processes documents it did not choose, and a stack trace is neither
          actionable nor safe to surface. Writing the engine's failure explanation to standard
          error turns the unreadable outcome into information the caller can act on, while a
          non-zero exit lets automation branch on it.
        children:
          - DocDownTool-Program-StructuredFailure
        tests:
          - DocDownTool_Extract_UnreadableInput_RendersStructuredFailureAndExitsNonZero

      - id: DocDownTool-ExplicitRegistration
        title: The tool shall register its extraction backends explicitly, without reflection or assembly scanning.
        tags: [system]
        justification: |
          The tool is meant to be publishable as a single-file executable, and reflection-based
          discovery defeats that by making the active backend set a property of what happens to be
          on disk. Building the engine from one explicit registration chain keeps the backend set a
          decision the code states rather than a deployment accident, and keeps those publish modes
          viable.
        children:
          - DocDownTool-Program-ExplicitRegistration
        tests:
          - DocDownTool_Build_DefaultEngine_RegistersBackendsExplicitly

      - id: DocDownTool-OptionMapping
        title: The tool shall map its command-line options onto the extraction options the engine supports.
        tags: [system]
        justification: |
          A caller controls an extraction through flags, and a flag that does not reach the engine is
          a silent lie. Mapping each option the tool accepts onto a real engine option — and
          accepting no option the engine cannot honor — keeps the command line an honest surface over
          the library.
        children:
          - DocDownTool-Cli-OptionMapping
        tests:
          - DocDownTool_Extract_NoImages_ReportsRecordedNoteInSummaryAndManifest

      - id: DocDownTool-StandardFlags
        title: >-
          The tool shall provide the standard DEMA command-line vocabulary for version, help,
          silence, logging, and heading depth.
        tags: [system]
        justification: |
          Every DEMA tool shares one command-line idiom so that scripts, agents, and operators can
          drive any of them the same way. Providing the same version, help, silence, log, and depth
          flags keeps the tool consistent with the rest of the family rather than a bespoke
          exception.
        children:
          - DocDownTool-Program-Version
          - DocDownTool-Program-Help
          - DocDownTool-Program-PriorityDispatch
          - DocDownTool-Cli-Output
        tests:
          - DocDownTool_Version_PrintsInformationalVersion
          - DocDownTool_Help_PrintsUsageAndOptions

      - id: DocDownTool-SelfValidation
        title: >-
          The tool shall run a self-validation that exercises its own functionality and the current
          Core plus registered-backend self-test cases, and shall write the results as TRX or JUnit.
        tags: [system]
        justification: |
          An operator needs to confirm the tool works where it is installed, not merely that it is
          present. Running the tool's own commands together with the current Core self-tests and each
          registered backend's self-test cases, and emitting the outcome in a machine-readable
          results format, makes that confirmation available on demand and consumable as compliance
          evidence.
        children:
          - DocDownTool-SelfTest-Validation
          - DocDownTool-SelfTest-Adaptation
          - DocDown-OTS-TestResults
        tests:
          - DocDownTool_Validate_ResultsTrx_ProducesWellFormedTrx
          - DocDownTool_Validate_ResultsXml_ProducesWellFormedJUnit
          - DocDownTool_Validate_RenderingSelfTestCase_IsRecordedAndNotFailed

      - id: DocDownTool-SelfValidationSkipDistinct
        title: >-
          The tool shall record a self-test that could not run in the current environment as a
          not-executed result, distinct from a failure.
        tags: [system]
        justification: |
          An environment-dependent self-test that could not run here must not be reported as a pass,
          which would hide missing evidence, nor as a failure, which would be a false alarm.
          Recording it as not-executed is honest: it produces no false failure and correctly
          satisfies nothing.
        children:
          - DocDownTool-SelfTestAdapter-SkippedIsNotExecuted
          - DocDown-OTS-TestResults-Outcomes
        tests:
          - DocDownTool_Validate_SkippedPdfRenderCase_RecordedAsNotExecuted

      - id: DocDownTool-ExpectedErrors
        title: >-
          The tool shall report an argument or operation fault as a message on standard error with a
          non-zero exit code and no stack trace.
        tags: [system]
        justification: |
          A person who mistypes a flag needs to be told what was wrong, not shown an implementation
          stack trace. Treating an argument or operation fault as an expected error — a plain message
          and a non-zero exit — keeps the tool usable and its failures easy to script.
        children:
          - DocDownTool-Program-ExpectedErrors
          - DocDownTool-Cli-ArgumentValidation
        tests:
          - DocDownTool_BadArgument_WritesErrorAndExitsNonZero

      - id: DocDownTool-BackendInventory
        title: >-
          The tool shall list each registered backend as its identifier and display name, the
          formats it supports, and its availability status, including an unavailable reason when
          present.
        tags: [system]
        justification: |
          Before running an extraction, an operator diagnosing a deployment needs to see which
          backends are present and usable and why. Reporting each backend's identity, formats, and
          availability status makes that visible without triggering an extraction.
        children:
          - DocDownTool-Program-BackendInventory
        tests:
          - DocDownTool_ListBackends_DefaultEngine_ListsPdfAvailable

      - id: DocDownTool-Packaging
        title: >-
          The tool shall be packaged as a RID-agnostic .NET tool invoked by the command name
          docdown.
        tags: [system]
        justification: |
          The intended distribution is a global or local .NET tool a user installs and runs as
          docdown. The produced package must stay runtime-identifier-agnostic: every tool asset is
          placed under the literal any platform folder so a single package installs on any RID and
          resolves the correct native asset at run time. Proving this against the packed .nupkg,
          rather than against project metadata, is what makes the documented installation and
          invocation dependable on every platform.
        tests:
          - DocDownTool_Package_Nupkg_IsRidAgnosticDotNetTool

      - id: DocDownTool-PackagedFootprint
        title: >-
          The tool package shall carry no native debug symbols and no native binaries for runtime
          identifiers the tool does not support.
        tags: [system]
        justification: |
          The tool carries a PDF rasterizer's native binaries, so its package is unavoidably large
          and anything avoidable in it matters. Two categories are avoidable. Native debug symbols
          describe third-party code a DocDown stack trace never enters, and libSkiaSharp.pdb alone
          is 82-88 MB per Windows runtime identifier. Natives for runtime identifiers outside the
          supported set support no DocDown scenario and are exercised by no CI matrix leg, so they
          could never be loaded by any user the tool claims to serve. Neither category has a
          functional signal, so no other test would notice if a dependency update reintroduced it;
          without a check against the packed .nupkg the package silently inflates. Asserting the
          shipped set is exactly the supported set, rather than probing for known-bad names, is what
          keeps a newly published platform from being admitted silently, and keeps the check from
          being satisfied by stripping the tool of natives it genuinely needs.
        tests:
          - DocDownTool_Package_Nupkg_ExcludesNativeSymbolsAndUnsupportedRuntimes
