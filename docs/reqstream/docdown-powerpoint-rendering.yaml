---
# Software System Requirements for DocDown.PowerPoint.Rendering
#
# These requirements describe the externally visible behavior of the optional PowerPoint
# slide-rendering package from the perspective of a host that registers it, without
# specifying implementation details. Each decomposes into unit requirements linked
# below via children, and is proven by system-level tests. The OTS requirements for
# the rasterization stack (CanvasNet.Pptx, CanvasNet.Charts, CanvasNet) are linked as
# children so the package's dependence on them is traced rather than assumed.

sections:
  - title: DocDownPowerPointRendering Requirements
    requirements:
      - id: DocDownPowerPointRendering-Registration
        title: >-
          The system shall register its slide-rendering extractor through a single extension method
          without reflection or assembly scanning.
        tags: [system]
        justification: |
          A host must be able to read its own dependency graph off its own code. One explicit call
          keeps that edge visible and reviewable, and keeps single-file publishing viable because no
          backend is discovered by scanning.
        children:
          - DocDownPowerPointRendering-PowerPointRenderingDocDownBuilderExtensions-RegistersExtractor
          - DocDownPowerPointRendering-PowerPointRenderingDocDownBuilderExtensions-ReflectionFree
          - DocDownPowerPointRendering-PowerPointRenderingDocDownBuilderExtensions-ReturnsBuilderForChaining
          - DocDownPowerPointRendering-PowerPointRenderingDocDownBuilderExtensions-RejectsNullBuilder
          - DocDownPowerPointRendering-PowerPointRenderingDocDownBuilderExtensions-NoCanvasNetTypeOnSurface
        tests:
          - AddPowerPointRendering_OnBuilder_RegistersRenderingExtractor

      - id: DocDownPowerPointRendering-ReportsRenderedPagesAvailability
        title: >-
          The system shall unconditionally report itself available with rendered-page support.
        tags: [system]
        justification: |
          Slide rendering is backed by CanvasNet.Pptx, a fully managed library that carries no
          runtime-identifier-specific asset, so there is no environment in which this backend cannot
          rasterize. Reporting rendered-page support unconditionally lets Core choose this backend
          before any document is opened, with nothing to probe.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-ReportsUnconditionalAvailability
        tests:
          - PowerPointPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReportsUnconditionallyAvailable

      - id: DocDownPowerPointRendering-RendersSlidesToPng
        title: The system shall render requested slides to PNG images in the pages folder.
        tags: [system]
        justification: |
          Rendered slide images are the reason this package exists: a visually dense slide carries
          information no text extractor can recover, and a faithful slide raster is what a
          multimodal consumer needs. The output must be a real, decodable image, not merely a file.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-WritesRenderedPages
          - DocDownPowerPointRendering-SlideRenderer-RendersSlideToPng
          - DocDownPowerPointRendering-SlideRenderer-RejectsNullDocument
          - DocDown-OTS-CanvasNetPptx
          - DocDown-OTS-CanvasNetCharts
          - DocDown-OTS-CanvasNet
        tests:
          - DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages
          - PowerPointPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs

      - id: DocDownPowerPointRendering-SelectedWhenPagesRequested
        title: >-
          The system shall be selected over the managed PowerPoint backend when page rendering is
          requested.
        tags: [system]
        justification: |
          A caller who asks for rendered pages must get them, since this backend is always available
          to provide them. Because both backends serve the PowerPoint format, selection must prefer
          the backend that produces slide images over the lighter managed backend that does not.
        tests:
          - DocDownPowerPointRendering_Select_PagesRequested_RenderingBackendWins

      - id: DocDownPowerPointRendering-BaseSelectedWhenNotRequested
        title: >-
          The system shall not be selected over the managed PowerPoint backend when page rendering is
          not requested.
        tags: [system]
        justification: |
          A plain extraction should pay nothing for rendered-page work it did not ask for. When
          rendering is not requested the lighter managed backend must win, so rasterization is never
          touched.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-SkipsRasterizationWhenNotRequested
        tests:
          - DocDownPowerPointRendering_Select_PagesNotRequested_BaseBackendWins

      - id: DocDownPowerPointRendering-ProbeCheapAndSafe
        title: >-
          The system shall report its availability cheaply and without throwing, never rasterizing in
          the probe.
        tags: [system]
        justification: |
          Availability is consulted on every engine build, including for plain extractions that never
          render. A probe that rasterized, opened a document, or threw would tax every extraction and
          could abort selection, so it must be a cheap, non-throwing check — trivially so, since it
          now returns a constant.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-ReportsUnconditionalAvailability
        tests:
          - PowerPointPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReportsUnconditionallyAvailable

      - id: DocDownPowerPointRendering-PerSlideFailureReportedAsNote
        title: >-
          The system shall report any per-slide rasterization failure as a plain one-sentence note
          naming the slide, continue with the remaining slides, and still complete normally.
        tags: [system]
        justification: |
          Rendering can fail on one slide — an unsupported slide feature or an out-of-memory at a
          high DPI — while the rest succeed. Recording only the factual note that the attempted slide
          could not be rasterized keeps the run alive and keeps the report aligned with DocDown's
          reduced output model: report what was attempted and what was produced, without adding an
          acceptability judgement.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-ReportsSlideFailuresAsNotes
        tests:
          - PowerPointPageRenderingExtractor_ExtractAsync_SlideRenderFaults_ReportsNoteWithoutThrowing

      - id: DocDownPowerPointRendering-SlideCountFailureReportedAsNote
        title: >-
          The system shall report a slide-count failure as a single plain note, keep the delegated
          managed content, and skip slide rendering entirely.
        tags: [system]
        justification: |
          A slide-count fault happens before any slide-specific rasterization is attempted, so it is
          reported once rather than once per slide, and the managed text/image/metadata content the
          delegate already wrote is not discarded.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-ReportsSlideCountFailureAsNote
        tests:
          - PowerPointPageRenderingExtractor_ExtractAsync_SlideCountFaults_ReportsNoteAndKeepsDelegatedContent

      - id: DocDownPowerPointRendering-EmptySelectionReportedAsNote
        title: >-
          The system shall report, as a single plain note, when page rendering was requested and a
          renderer was available but no slide was selected to render.
        tags: [system]
        justification: |
          Core cannot reliably distinguish this package's own empty-outcome explanation from an
          unrelated note already recorded elsewhere in the same extraction (for example, during the
          delegated managed backend's earlier content phase), so this package records the note itself
          from its own selected-slide count rather than relying on Core to infer it.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-ReportsEmptySelectionAsNote
        tests:
          - PowerPointPageRenderingExtractor_ExtractAsync_PageRangeSelectsNoSlide_ReportsEmptyPagesNote

      - id: DocDownPowerPointRendering-HonorsDpi
        title: The system shall render slides at the requested dots-per-inch.
        tags: [system]
        justification: |
          The DPI trades output fidelity against file size, and a caller that sets it expects the
          raster to change accordingly. Ignoring it would make the option meaningless and the output
          unpredictable.
        tests:
          - DocDownPowerPointRendering_Render_HigherDpi_ProducesLargerPage

      - id: DocDownPowerPointRendering-HonorsPageRange
        title: The system shall rasterize only the slides within a requested page range.
        tags: [system]
        justification: |
          A caller working with a large deck needs a bounded slice, and rasterization is the most
          expensive step. Rendering slides outside the requested range would waste the most time and
          contradict the request.
        children:
          - DocDownPowerPointRendering-SlideRenderer-GetsSlideCount
        tests:
          - DocDownPowerPointRendering_Render_PageRange_RestrictsRenderedPages

      - id: DocDownPowerPointRendering-ManagedInputsDelegated
        title: >-
          The system shall produce the text, embedded images, and document metadata by delegating to
          the managed PowerPoint backend rather than re-implementing them.
        tags: [system]
        justification: |
          The managed backend already extracts text, images, and metadata faithfully. Delegating to it
          — with rendering suppressed on the delegate — keeps a single source of truth for those
          aspects and confines this package to the one thing it adds, rasterization.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-DelegatesManagedAspects
        tests:
          - PowerPointPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs

      - id: DocDownPowerPointRendering-ConcurrentRendersDoNotInterfere
        title: The system shall produce correct output when rendering concurrently from multiple threads.
        tags: [system]
        justification: |
          Several slides, possibly from different presentations, can be rendered in the same run.
          Each render opens its own document and surface with no shared mutable state in this
          package, so concurrent renders must all succeed without corrupting one another's output.
        children:
          - DocDownPowerPointRendering-SlideRenderer-ConcurrentCallsDoNotInterfere
        tests:
          - SlideRenderer_Render_ConcurrentCalls_AllProduceValidPng

      - id: DocDownPowerPointRendering-Determinism
        title: >-
          The system shall produce byte-identical rendered slides across repeated renders of the
          same presentation in the same environment.
        tags: [system]
        justification: |
          Reproducible output is what lets a consumer diff two extractions and conclude the
          presentation changed. Without it every re-render looks like a change and the diff becomes
          useless as a signal.
        tests:
          - DocDownPowerPointRendering_Render_Deterministic_ProducesByteIdenticalPages

      - id: DocDownPowerPointRendering-SelfValidation
        title: >-
          The system shall contribute a self-validation case that proves rendering genuinely
          rasterizes in the deployed environment.
        tags: [system]
        justification: |
          Declared availability is not proof of behavior; only a real render is. A contributed case
          that rasterizes the embedded presentation lets an operator confirm rendering works, and
          passes unconditionally since CanvasNet.Pptx carries no environment-dependent failure mode.
        children:
          - DocDownPowerPointRendering-PowerPointPageRenderingExtractor-ContributesSelfTests
        tests:
          - PowerPointPageRenderingExtractor_GetSelfTestCases_AnyEnvironment_PassesRenderCase
