---
# Software Unit Requirements for DocDownEngine
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-DocDownEngine-BackendStatus
# required the removed BackendStatus projection. It is superseded (not satisfied) by
# DocDownCore-Extraction-DocDownEngine-BackendCandidates because the engine now reports candidates
# directly.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Extraction Requirements
        sections:
          - title: DocDownEngine Requirements
            requirements:
              - id: DocDownCore-Extraction-DocDownEngine-RenderRequestApplicability
                title: >-
                  DocDownEngine shall treat page rendering as a request, recording a note only when
                  a requested paginated render could not be completed.
                justification: |
                  Page rendering depends on both format and environment. A paginated format with no
                  renderer needs an explicit note, while a non-paginated format should not report a
                  false shortfall.
                tests:
                  - DocDownEngine_ExtractAsync_NonPaginatedFormat_RenderRequest_SucceedsSilently
                  - DocDownEngine_ExtractAsync_PaginatedFormat_RenderRequestUnavailable_RecordsNote

              - id: DocDownCore-Extraction-DocDownEngine-PipelineOrder
                title: >-
                  DocDownEngine shall run the extraction stages in a fixed order and not invoke a
                  backend for unknown input.
                justification: |
                  Each stage depends on the previous stage's result. A backend must never run on an
                  input whose format was not recognized.
                tests:
                  - DocDownEngine_ExtractAsync_UnknownFormat_DoesNotInvokeBackend
                  - DocDownEngine_ExtractAsync_Backend_ReceivesSinkContextWithoutScratchPath

              - id: DocDownCore-Extraction-DocDownEngine-OptionsSnapshot
                title: DocDownEngine shall clone the caller's options before any other work.
                justification: |
                  Callers may mutate an options object after starting an extraction. Cloning it on
                  entry isolates the run from later mutation.
                tests:
                  - DocDownEngine_ExtractAsync_CallerOptions_AreClonedBeforeReachingBackend

              - id: DocDownCore-Extraction-DocDownEngine-ExtractorIsolation
                title: DocDownEngine shall catch a backend exception and convert it into an unreadable result.
                justification: |
                  Third-party extractors can fail unexpectedly. The engine must contain those faults
                  and preserve a usable result object.
                tests:
                  - DocDownEngine_ExtractAsync_BackendThrows_ReturnsUnreadableLayout

              - id: DocDownCore-Extraction-DocDownEngine-FailureReturned
                title: >-
                  DocDownEngine shall return structured failure data instead of throwing
                  ordinary extraction errors.
                justification: |
                  Routine extraction failures must be open to inspection by callers without exception-based
                  control flow.
                tests:
                  - DocDownEngine_ExtractAsync_ScratchRefused_ReturnsFailureWithoutWritingLayout

              - id: DocDownCore-Extraction-DocDownEngine-FailureArtifacts
                title: >-
                  DocDownEngine shall still write the root artifacts when extraction fails after the
                  scratch folder was prepared.
                justification: |
                  A backend failure must still leave an auditable record in the accepted scratch
                  folder.
                tests:
                  - DocDownEngine_ExtractAsync_BackendThrows_ReturnsUnreadableLayout

              - id: DocDownCore-Extraction-DocDownEngine-BackendCandidates
                title: >-
                  DocDownEngine shall report the registered backend candidates with
                  availability and render support.
                justification: |
                  Operators need to see which extractors are registered and usable before running an
                  extraction.
                tests:
                  - DocDownEngine_GetBackends_MixedBackends_ReportsAvailabilityAndRenderedPageSupport

              - id: DocDownCore-Extraction-DocDownEngine-SelfTestCases
                title: DocDownEngine shall expose the current Core self-tests and skip unavailable backend cases.
                justification: |
                  A host should be able to validate the deployed environment through one self-test
                  surface.
                tests:
                  - DocDownEngine_GetSelfTestCases_NoBackends_IncludesTwoCoreCases
                  - DocDownEngine_GetSelfTestCases_UnavailableBackend_WrapsCasesAsSkipped

              - id: DocDownCore-Extraction-DocDownEngine-Cancellation
                title: DocDownEngine shall propagate cancellation when the caller cancels an extraction.
                justification: |
                  Long-running extractions must be able to be interrupted so callers can reclaim resources.
                tests:
                  - DocDownEngine_ExtractAsync_CanceledToken_PropagatesOperationCanceled

              - id: DocDownCore-Extraction-DocDownEngine-RejectNullArguments
                title: DocDownEngine shall reject null or empty source, document path, and scratch folder arguments.
                justification: |
                  Required inputs that are null or empty are programming errors and should fail
                  immediately.
                tests:
                  - DocDownEngine_ExtractAsync_NullSource_ThrowsArgumentNullException
                  - DocDownEngine_ExtractAsync_EmptyScratchFolder_ThrowsArgumentException
                  - DocDownEngine_ExtractAsync_EmptyDocumentPath_ThrowsArgumentException

              - id: DocDownCore-Extraction-DocDownEngine-TwoStateOutcome
                title: DocDownEngine shall return only Produced or Unreadable extraction outcomes.
                justification: |
                  The engine's public outcome model states only whether the standard layout was
                  written or the extraction was unreadable.
                tests:
                  - DocDownEngine_ExtractAsync_ImagesAndPages_ProducesBothArtifacts
                  - DocDownEngine_ExtractAsync_BackendThrows_ReturnsUnreadableLayout
