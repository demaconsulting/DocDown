---
# Software Unit Requirements for ExtractorRegistry
#
# ExtractorRegistry holds the materialized backends, exposes their descriptors,
# resolves them by identifier, and caches availability probe results.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Extraction Requirements
        sections:
          - title: ExtractorRegistry Requirements
            requirements:
              - id: DocDownCore-Extraction-ExtractorRegistry-DescriptorExposure
                title: ExtractorRegistry shall expose a descriptor for each backend in registration order.
                justification: |
                  Selection and reporting need a stable view of the registered extractor set.
                tests:
                  - ExtractorRegistry_Descriptors_TwoExtractors_AppearInRegistrationOrder

              - id: DocDownCore-Extraction-ExtractorRegistry-LookupById
                title: >-
                  ExtractorRegistry shall resolve a backend by identifier and reject
                  unknown, null, or empty identifiers.
                justification: |
                  Selection and backend execution both rely on identifier-based resolution.
                tests:
                  - ExtractorRegistry_Resolve_KnownId_ReturnsRegisteredInstance
                  - ExtractorRegistry_Resolve_UnknownId_ThrowsKeyNotFoundException
                  - ExtractorRegistry_Resolve_EmptyId_ThrowsArgumentException
                  - ExtractorRegistry_Resolve_NullId_ThrowsArgumentNullException

              - id: DocDownCore-Extraction-ExtractorRegistry-ProbeCaching
                title: ExtractorRegistry shall probe each backend's availability once and cache the result.
                justification: |
                  Repeated probe calls add cost and can disturb environment-sensitive backends.
                tests:
                  - ExtractorRegistry_GetCandidates_RepeatedCalls_ProbesOnce

              - id: DocDownCore-Extraction-ExtractorRegistry-ProbeFailureContainment
                title: ExtractorRegistry shall treat a probe that throws or returns null as an unavailable backend.
                justification: |
                  Availability probing must not crash the engine just because one backend misbehaves.
                tests:
                  - ExtractorRegistry_GetCandidates_ThrowingProbe_ContainedAsUnavailable
                  - ExtractorRegistry_GetCandidates_NullProbeResult_ContainedAsUnavailable
                  - ExtractorRegistry_GetCandidates_UnavailableBackend_PreservesReason

              - id: DocDownCore-Extraction-ExtractorRegistry-RefreshAvailability
                title: ExtractorRegistry shall re-probe availability on demand after the cache is refreshed.
                justification: |
                  Long-lived processes need a way to observe an environment change without building a
                  new engine.
                tests:
                  - ExtractorRegistry_RefreshAvailability_AfterCaching_ReprobesOnNextEnumeration

              - id: DocDownCore-Extraction-ExtractorRegistry-CandidateEnumeration
                title: ExtractorRegistry shall yield exactly one candidate per backend regardless of availability.
                justification: |
                  The engine should be able to reason about every registered backend, including the
                  unavailable ones.
                tests:
                  - ExtractorRegistry_GetCandidates_MixedAvailability_YieldsOneCandidatePerExtractor

          - title: ExtractorRegistry Construction Requirements
            requirements:
              - id: DocDownCore-Extraction-ExtractorRegistry-ConstructionValidation
                title: >-
                  ExtractorRegistry shall reject a null factory list, a null factory, a factory that returns
                  null, a null or empty identifier, and duplicate identifiers, and shall invoke each factory once.
                justification: |
                  Registration errors are programming errors that should fail at construction rather than
                  surface later as selection failures.
                tests:
                  - ExtractorRegistry_Construct_NullFactoryList_ThrowsArgumentNullException
                  - ExtractorRegistry_Construct_EmptyFactoryList_YieldsEmptyRegistry
                  - ExtractorRegistry_Construct_NullFactoryElement_ThrowsArgumentNullException
                  - ExtractorRegistry_Construct_FactoryReturnsNull_ThrowsArgumentException
                  - ExtractorRegistry_Construct_EmptyIdentifier_ThrowsArgumentException
                  - ExtractorRegistry_Construct_NullIdentifier_ThrowsArgumentException
                  - ExtractorRegistry_Construct_Factory_IsMaterializedExactlyOnce
                  - ExtractorRegistry_Construct_DuplicateIds_ThrowsArgumentException
