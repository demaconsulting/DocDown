---
# Software Unit Requirements for ExtractorSelector
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-ExtractorSelector-OverrideHonored
# required a caller-directed override. It is superseded (not satisfied) with no replacement because
# caller override selection was removed from Core.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-ExtractorSelector-OverrideNeverFallsBack
# required failure semantics for the removed caller override feature. It is superseded (not
# satisfied) with no replacement because that feature no longer exists.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-ExtractorSelector-RequiredCapabilities
# required matching against caller-required capabilities. It is superseded (not satisfied) by
# DocDownCore-Extraction-ExtractorSelector-RenderPreference because page-render preference is now the
# only selection refinement beyond format and availability.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-ExtractorSelector-HardCapabilityFailure
# required failure for unsatisfied required capabilities. It is superseded (not satisfied) with no
# replacement because required-capability negotiation was removed from Core.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-ExtractorSelector-CandidateTrace
# required a trace of candidate verdicts. It is superseded (not satisfied) with no replacement
# because verdict-style traces were removed from the selection result.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Extraction Requirements
        sections:
          - title: ExtractorSelector Requirements
            requirements:
              - id: DocDownCore-Extraction-ExtractorSelector-FormatFilter
                title: ExtractorSelector shall consider only candidates that support the detected format.
                justification: |
                  A backend that does not support the detected format cannot produce a correct
                  extraction result.
                tests:
                  - ExtractorSelector_Select_FormatMatchedCandidate_SelectsMatchingDescriptor

              - id: DocDownCore-Extraction-ExtractorSelector-PackageHint
                title: >-
                  ExtractorSelector shall return honest failure prose naming the owning package for a
                  well-known format and stating when a legacy binary format is unsupported.
                justification: |
                  Detection deliberately recognizes formats that Core alone cannot extract. The
                  selection failure should therefore name the owning package for supported modern
                  formats and state plainly when no DocDown package supports a legacy binary format.
                tests:
                  - ExtractorSelector_Select_DocxWithoutMatchingCandidate_ReturnsPackageHint
                  - ExtractorSelector_Select_LegacyFormatWithoutMatchingCandidate_ReturnsLegacyBinaryWording
                  - ExtractorSelector_Select_CustomFormatWithoutMatchingCandidate_ReturnsGenericWording

              - id: DocDownCore-Extraction-ExtractorSelector-AvailabilityFilter
                title: ExtractorSelector shall exclude unavailable candidates.
                justification: |
                  An extractor that cannot run in the current environment must not be selected.
                tests:
                  - ExtractorSelector_Select_AllMatchingCandidatesUnavailable_ReturnsAvailabilityFailure

              - id: DocDownCore-Extraction-ExtractorSelector-RenderPreference
                title: >-
                  ExtractorSelector shall prefer an available candidate that can render pages when
                  page rendering was requested.
                justification: |
                  Page rendering is the one selection preference that still varies by environment.
                  When the caller requested rendered pages, a renderer should win if one is
                  available.
                tests:
                  - ExtractorSelector_Select_RenderPagesRequested_PrefersCandidateProvidingRenderedPages
                  - ExtractorSelector_Select_RenderPagesRequestedWithoutRenderer_FallsBackToPriority

              - id: DocDownCore-Extraction-ExtractorSelector-RankOrdering
                title: ExtractorSelector shall choose the highest-priority remaining candidate.
                justification: |
                  After filtering by format, availability, and optional render preference, priority
                  provides the stable business tie-break among otherwise valid candidates.
                tests:
                  - ExtractorSelector_Select_EqualCandidates_HigherPriorityWins

              - id: DocDownCore-Extraction-ExtractorSelector-DeterministicTieBreak
                title: ExtractorSelector shall break equal-priority ties by backend identifier.
                justification: |
                  Equal-priority candidates still need one deterministic winner so repeated runs stay
                  reproducible.
                tests:
                  - ExtractorSelector_Select_EqualPriorityCandidates_LowerIdentifierWins

              - id: DocDownCore-Extraction-ExtractorSelector-Repeatability
                title: ExtractorSelector shall return the same winner for equal logical inputs.
                justification: |
                  Selection is a pure function. Candidate ordering alone must not change the result.
                tests:
                  - ExtractorSelector_Select_ShuffledCandidates_ProducesSameWinner
