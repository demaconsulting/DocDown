---
# System-Level Platform Requirements
#
# These requirements specify the platforms and frameworks the library must support.
# They ensure the library works across the required execution environments.
#
# Test links can include a source filter prefix (e.g. "windows@", "ubuntu@", "net8.0@") to restrict
# which test results count as evidence for a requirement. This is critical for platform and framework
# requirements - removing these filters invalidates the evidence-based proof.
#
# Source filter prefixes:
#   windows@TestName  - proves the test passed on a Windows platform
#   ubuntu@TestName   - proves the test passed on a Linux (Ubuntu) platform
#   macos@TestName    - proves the test passed on a macOS platform
#   net8.0@TestName   - proves the test passed under the .NET 8 runtime
#   net9.0@TestName   - proves the test passed under the .NET 9 runtime
#   net10.0@TestName  - proves the test passed under the .NET 10 runtime
#   net11.0@TestName  - proves the test passed under the .NET 11 runtime

sections:
  - title: DocDownCore Requirements
    requirements:
      - id: DocDownCore-Platform-Windows
        title: The library shall build and run on Windows platforms.
        tags: [system]
        justification: |
          DEMA Consulting libraries must support Windows as a major development platform.
        tests:
          # Tests link to "windows" to ensure results come from Windows platform
          - "windows@DocDownCore_Extract_TextDocument_ProducesContractLayout"

      - id: DocDownCore-Platform-Linux
        title: The library shall build and run on Linux platforms.
        tags: [system]
        justification: |
          DEMA Consulting libraries must support Linux for CI/CD and containerized environments.
        tests:
          # Tests link to "ubuntu" to ensure results come from Linux platform
          - "ubuntu@DocDownCore_Extract_TextDocument_ProducesContractLayout"

      - id: DocDownCore-Platform-MacOS
        title: The library shall build and run on macOS platforms.
        tags: [system]
        justification: |
          DEMA Consulting libraries must support macOS for developers using Apple platforms.
        tests:
          # Tests link to "macos" to ensure results come from macOS platform
          - "macos@DocDownCore_Extract_TextDocument_ProducesContractLayout"

      - id: DocDownCore-Platform-Net8
        title: The library shall support .NET 8 runtime.
        tags: [system]
        justification: |
          .NET 8 is a Long-Term Support (LTS) release that reached end of support in November 2026.
          The library continues to support this runtime so that library consumers who have not yet
          migrated to a newer release, such as enterprise environments with slow upgrade cycles, can
          keep using it.
        tests:
          - "net8.0@DocDownCore_Extract_TextDocument_ProducesContractLayout"

      - id: DocDownCore-Platform-Net9
        title: The library shall support .NET 9 runtime.
        tags: [system]
        justification: |
          .NET 9 is a Standard-Term Support (STS) release that has reached end of support. The
          library continues to support this runtime so that library consumers who have not yet
          migrated to a newer release can keep using it.
        tests:
          - "net9.0@DocDownCore_Extract_TextDocument_ProducesContractLayout"

      - id: DocDownCore-Platform-Net10
        title: The library shall support .NET 10 runtime.
        tags: [system]
        justification: |
          .NET 10 is the current Long-Term Support (LTS) release. Supporting this runtime provides a
          stable, long-term supported target for library consumers who prefer LTS releases.
        tests:
          - "net10.0@DocDownCore_Extract_TextDocument_ProducesContractLayout"

      - id: DocDownCore-Platform-Net11
        title: The library shall support .NET 11 runtime.
        tags: [system]
        justification: |
          .NET 11 is the latest release in the .NET platform roadmap. Supporting this runtime
          ensures the library works for consumers as they adopt the newest .NET version.
        tests:
          - "net11.0@DocDownCore_Extract_TextDocument_ProducesContractLayout"
