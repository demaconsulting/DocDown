---
# Software Subsystem Requirements for DocDownCore Output
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-CompletenessLedger
# required the completeness ledger. It is superseded (not satisfied) with no replacement because the
# ledger-based completeness model was removed from Core.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-GapExplanation
# required numbered gaps for missing output. It is superseded (not satisfied) by
# DocDownCore-Output-ExtractionNotes and DocDownCore-Output-ContentOutline because Core now reports
# attempted-but-incomplete work as plain notes and document absence as inventory.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerification
# required the ContractVerifier unit. It is superseded (not satisfied) with no replacement because
# the contract-verifier machinery was removed from Core.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-HonestExtractionPasses
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-DetectsMissingArtifact
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-DetectsUnlistedFile
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-ReportsIncompleteVerification
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-DetectsHashMismatch
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-DetectsLedgerMismatch
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-DetectsUnexplainedAbsence
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-DetectsBackendMismatch
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContractVerifier-ReportsRatherThanThrows
# were all owned by the deleted ContractVerifier unit. They are superseded (not satisfied) with no
# replacement because the governing principle removed the verifier, ledger, and gap machinery from
# Core and retained only content inventory and plain extraction notes.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        requirements:
          - id: DocDownCore-Output-ArtifactLayout
            title: The subsystem shall prepare the scratch folder and establish the fixed root artifact layout.
            justification: |
              Consumers automate on stable root artifact names. Preparing the scratch folder and
              establishing the standard root artifacts keeps the output predictable.
            children:
              - DocDownCore-Output-ScratchFolder-ModeCleanIfDocDownFolder
              - DocDownCore-Output-ScratchFolder-ReuseBoundToFolder
              - DocDownCore-Output-ScratchFolder-InventoryScopedDeletion
              - DocDownCore-Output-ScratchFolder-RevalidatedBeforeDeletion
              - DocDownCore-Output-ScratchFolder-ModeOverwrite
              - DocDownCore-Output-ScratchFolder-RefusalReported
            tests:
              - Output_ArtifactLayout_SuccessfulWrite_CreatesRootArtifacts

          - id: DocDownCore-Output-SummaryContent
            title: The subsystem shall write a summary containing the mandatory human-readable sections.
            justification: |
              The summary is the first artifact a human reads. It must therefore present the same
              sections, in the same order, for every extraction.
            children:
              - DocDownCore-Output-SummaryWriter-MandatorySections
              - DocDownCore-Output-SummaryWriter-AbsoluteScratchPath
              - DocDownCore-Output-SummaryWriter-BackendNamed
              - DocDownCore-Output-SummaryWriter-EnvironmentReported
              - DocDownCore-Output-SummaryWriter-EnvironmentAttributed
              - DocDownCore-Output-SummaryWriter-FailureExplained
              - DocDownCore-Output-SummaryWriter-GoldenOutput
            tests:
              - Output_SummaryContent_Written_ContainsMandatorySections

          - id: DocDownCore-Output-ManifestContent
            title: The subsystem shall write the reduced manifest schema describing the extraction run.
            justification: |
              Machine consumers need a stable schema that matches the current reporting model.
              The manifest must therefore carry the reduced top-level shape and omit removed blocks.
            children:
              - DocDownCore-Output-ManifestWriter-SchemaVersion
              - DocDownCore-Output-ManifestWriter-MachineTwin
              - DocDownCore-Output-ManifestWriter-ReducedSchema
              - DocDownCore-Output-ManifestWriter-NotesSerialized
            tests:
              - Output_ManifestContent_Written_ParsesWithSchemaVersionTwoPointZero

          - id: DocDownCore-Output-DocumentMetadata
            title: >-
              The subsystem shall write metadata.json recording what the document asserts about
              itself, with per-field provenance and blank values omitted.
            justification: |
              Document-authored metadata is distinct from the extraction summary and manifest.
              Writing it separately preserves authored claims, their provenance, and any
              interesting absences.
            children:
              - DocDownCore-Output-SummaryWriter-MetadataInlining
            tests:
              - MetadataWriter_WriteAsync_ReportedMetadata_WritesFile
              - MetadataWriter_WriteAsync_NoReportedMetadata_WritesSparseFile
              - MetadataWriter_Render_PopulatedFields_EmitsValueAndSourceObjects
              - MetadataWriter_Render_AbsentInteresting_EmitsAbsentArrayAndNote
              - OpcMetadataMapper_From_PopulatedProperties_MapsFieldsWithProvenanceAndIsoDates
              - OpcMetadataMapper_From_BlankValues_OmittedAsFieldsAndRecordedAbsent
              - SummaryWriter_WriteAsync_PdfShapedMetadata_InlinesHumanAuthorNotApplication
              - SummaryWriter_WriteAsync_OpcShapedMetadata_FallsBackToCreatorAsAuthor

          - id: DocDownCore-Output-ContentOutline
            title: >-
              The subsystem shall record the counted structural features of extracted content,
              including a count of zero for a feature the backend reports it looked for.
            justification: |
              A character count alone does not tell a reader what kinds of content were extracted.
              Counted features make the extracted structure discoverable without reading the full
              markdown.
            children:
              - DocDownCore-Output-ExtractionSink-RecordsReports
              - DocDownCore-Output-SummaryWriter-GistAndInventory
            tests:
              - ExtractionSink_ReportContentFeature_RepeatedLabels_AccumulateAndDropZeroCounts
              - ExtractionSink_ReportContentFeature_LookedForZero_IsReported
              - SummaryWriter_WriteAsync_WithContentFeatures_OpensWithGistAndOutlinesContent
              - SummaryWriter_WriteAsync_LookedForZeroFeature_OutlinesTheZero

          - id: DocDownCore-Output-ContentDocument
            title: The subsystem shall write extracted text as Markdown and split it when requested.
            justification: |
              Consumers need one predictable content artifact. The subsystem must therefore write
              Markdown and honor the split mode for part-based content.
            children:
              - DocDownCore-Output-ContentWriter-SingleFlowDocument
              - DocDownCore-Output-ContentWriter-PartIndex
              - DocDownCore-Output-ContentWriter-SplitModeHonored
              - DocDownCore-Output-ContentWriter-PageMarkers
              - DocDownCore-Output-ContentWriter-AbsenceExplained
              - DocDownCore-Output-ExtractionSink-AllocatesPartPaths
            tests:
              - Output_ContentDocument_TextWritten_ProducesContentMd

          - id: DocDownCore-Output-ImageResources
            title: The subsystem shall write embedded images as deduplicated resource files.
            justification: |
              Embedded images are part of the extracted content and may repeat within a document.
              Resource output must therefore be stable and deduplicated.
            children:
              - DocDownCore-Output-ExtractionSink-AllocatesImagePaths
              - DocDownCore-Output-ExtractionSink-ImageDeduplication
              - DocDownCore-Output-ExtractionSink-ImageSuppression
              - DocDownCore-Output-SummaryWriter-ImageSummary
              - DocDownCore-Output-ImageTextSelector-RanksBySource
              - DocDownCore-Output-ImageTextSelector-GatesByConfidence
              - DocDownCore-Output-ImageTextSelector-FiltersAutoGeneratedNames
              - DocDownCore-Output-ImageTextSelector-IgnoresEmptyText
              - DocDownCore-Output-ImageTextSelector-NamesProvenance
            tests:
              - Output_ImageResources_DuplicateBytes_AreDeduplicated

          - id: DocDownCore-Output-PageResources
            title: The subsystem shall write each rendered page under a path named by its source page number.
            justification: |
              Consumers must be able to map a rendered page image back to the source page without
              guesswork.
            children:
              - DocDownCore-Output-ExtractionSink-AllocatesPagePaths
            tests:
              - Output_PageResources_PageWritten_IsNamedByPageNumber

          - id: DocDownCore-Output-ExtractionNotes
            title: >-
              The subsystem shall carry recorded extraction notes into the human-readable and
              machine-readable output artifacts.
            justification: |
              When DocDown attempted a step and could not complete it, both people and automation
              need to see the same plain-language note.
            children:
              - DocDownCore-Output-ExtractionSink-RecordsReports
              - DocDownCore-Output-ManifestWriter-NotesSerialized
              - DocDownCore-Output-SummaryWriter-NotesListed
            tests:
              - Output_Notes_Reported_AppearInSummaryAndManifest

          - id: DocDownCore-Output-PathSafety
            title: The subsystem shall confine every allocated path to the scratch folder and reject unsafe input.
            justification: |
              Output names can originate in hostile document content. Rejecting traversal,
              reserved-device names, and overlong paths keeps every write inside the scratch
              folder and keeps destructive reuse safe.
            children:
              - DocDownCore-Output-ScratchFolder-PathContainment
              - DocDownCore-Output-ScratchFolder-RejectsReservedNames
              - DocDownCore-Output-ScratchFolder-RejectsOverlongPaths
            tests:
              - Output_PathSafety_MaliciousImageName_IsContained

          - id: DocDownCore-Output-Determinism
            title: The subsystem shall produce byte-identical output for identical content at a fixed timestamp.
            justification: |
              Reproducible serializer output lets consumers diff two runs and trust that any change
              reflects real extraction data.
            children:
              - DocDownCore-Output-ScratchFolder-DeterministicNaming
              - DocDownCore-Output-SummaryWriter-DeterministicText
              - DocDownCore-Output-ManifestWriter-DeterministicJson
            tests:
              - Output_Determinism_FixedTimestamp_ProducesByteIdenticalOutput

          - id: DocDownCore-Output-ImageProvenance
            title: The subsystem shall record how each extracted image was produced.
            justification: |
              A consumer may need to distinguish the document's own stored image bytes from a
              decoded and re-encoded image representation.
            children:
              - DocDownCore-Output-ExtractionSink-ImageTransformRecorded
              - DocDownCore-Output-ExtractionSink-ImageDescriptionRecorded
              - DocDownCore-Output-ManifestWriter-ImageTransformProjected
              - DocDownCore-Output-ManifestWriter-ImageDescriptionSerialized
            tests:
              - Output_ImageProvenance_MixedTransforms_ManifestRecordsEachHonestly
