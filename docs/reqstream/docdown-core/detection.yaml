---
# Software Subsystem Requirements for DocDownCore Detection
#
# The Detection subsystem determines a document's format from its file name and,
# where the name yields nothing, its leading content bytes.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Detection Requirements
        requirements:
          - id: DocDownCore-Detection-FormatIdentification
            title: >-
              The subsystem shall identify the document format from the file extension,
              falling back to content signatures.
            justification: |
              Routing a document to a compatible extractor depends on naming its format. The
              caller already possesses the document and named it, so the extension is the
              primary signal; a bounded leading-byte check recovers inputs that arrive unnamed or
              with an unrecognized extension.
            children:
              - DocDownCore-Detection-FormatSniffer-ExtensionPrimary
              - DocDownCore-Detection-FormatSniffer-ContentSignature
            tests:
              - Detection_FormatIdentification_PdfSignature_IdentifiesPdf
              - Detection_FormatIdentification_HtmlSignature_IdentifiesHtml
              - Detection_FormatIdentification_TextExtension_IdentifiesText
              - Detection_FormatIdentification_DocxExtension_IdentifiesDocxByExtension

          - id: DocDownCore-Detection-DetectionBasisReported
            title: The subsystem shall report the basis on which it identified the format.
            justification: |
              The manifest must record how the format was identified, not merely what it was.
              Reporting whether the result came from the extension or from a content signature
              preserves that evidence for later readers.
            children:
              - DocDownCore-Detection-FormatSniffer-BasisAndConfidence
            tests:
              - Detection_DetectionBasisReported_PdfExtension_ReportsExtensionBasis
              - Detection_DetectionBasisReported_PdfSignature_ReportsContentSignatureBasis

          - id: DocDownCore-Detection-UnknownFormatReported
            title: The subsystem shall report an unknown format when it cannot identify the content.
            justification: |
              Guessing a format for unrecognized input would send it to the wrong extractor.
              Reporting unknown lets the pipeline return an unreadable result instead.
            children:
              - DocDownCore-Detection-FormatSniffer-UnknownFormat
            tests:
              - Detection_UnknownFormatReported_UnrecognizedContent_ReportsUnknown

          - id: DocDownCore-Detection-NonDestructiveInspection
            title: The subsystem shall restore the source stream to its original position after inspection.
            justification: |
              Detection runs before extraction on the same stream. Leaving the position moved
              would corrupt the later extraction, so inspection must be transparent to downstream
              readers.
            children:
              - DocDownCore-Detection-FormatSniffer-StreamPositionRestored
            tests:
              - Detection_NonDestructiveInspection_SeekableStream_RestoresStreamPosition
