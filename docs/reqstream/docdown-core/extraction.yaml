---
# Software Subsystem Requirements for DocDownCore Extraction
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-SelectionExplained
# required a per-candidate trace of verdicts. It is superseded (not satisfied) with no replacement
# because verdict-style selection traces were removed from the Core reporting model.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Extraction-CapabilityNegotiation
# required capability negotiation, partial satisfiers, and hard capability failures. It is
# superseded (not satisfied) by DocDownCore-Extraction-DeterministicSelection because selection now
# considers only format, availability, requested page rendering, priority, and identifier.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Extraction Requirements
        requirements:
          - id: DocDownCore-Extraction-ExplicitRegistration
            title: The subsystem shall expose exactly the backends the host registered.
            justification: |
              Hosts control which third-party extractors participate. Exposing only the registered
              set keeps the engine's behavior explicit and predictable.
            children:
              - DocDownCore-Extraction-DocDownBuilder-RegisterInstance
              - DocDownCore-Extraction-DocDownBuilder-RegisterFactory
              - DocDownCore-Extraction-DocDownBuilder-RejectDuplicateIds
              - DocDownCore-Extraction-DocDownBuilder-RejectNullArguments
              - DocDownCore-Extraction-ExtractorRegistry-DescriptorExposure
              - DocDownCore-Extraction-ExtractorRegistry-LookupById
            tests:
              - Extraction_ExplicitRegistration_RegisteredBackends_AppearInEngine

          - id: DocDownCore-Extraction-AvailabilityProbing
            title: >-
              The subsystem shall probe each backend's availability, treat a failing probe as
              unavailable, and preserve the reason.
            justification: |
              Backends may depend on environment-specific components that are missing. Probing
              availability up front lets the engine skip unusable backends without crashing.
            children:
              - DocDownCore-Extraction-ExtractorRegistry-ProbeCaching
              - DocDownCore-Extraction-ExtractorRegistry-ProbeFailureContainment
              - DocDownCore-Extraction-ExtractorRegistry-RefreshAvailability
              - DocDownCore-Extraction-ExtractorRegistry-CandidateEnumeration
              - DocDownCore-Extraction-DocDownEngine-BackendCandidates
              - DocDownCore-Extraction-ExtractorSelector-AvailabilityFilter
            tests:
              - Extraction_AvailabilityProbing_ThrowingProbe_TreatedAsUnavailable

          - id: DocDownCore-Extraction-DeterministicSelection
            title: >-
              The subsystem shall select a backend as a deterministic function of the detected
              format, availability, page-rendering preference, priority, and identifier.
            justification: |
              Reproducible extraction depends on a stable selection policy with no hidden
              negotiation. Equal inputs must therefore choose the same backend every time.
            children:
              - DocDownCore-Extraction-ExtractorSelector-FormatFilter
              - DocDownCore-Extraction-ExtractorSelector-AvailabilityFilter
              - DocDownCore-Extraction-ExtractorSelector-RenderPreference
              - DocDownCore-Extraction-ExtractorSelector-RankOrdering
              - DocDownCore-Extraction-ExtractorSelector-DeterministicTieBreak
              - DocDownCore-Extraction-ExtractorSelector-Repeatability
            tests:
              - Extraction_DeterministicSelection_EqualInputs_ProduceEqualSelection
              - Extraction_RenderPreference_RenderRequested_PrefersRenderer

          - id: DocDownCore-Extraction-Orchestration
            title: The subsystem shall run the detection, selection, extraction, and output pipeline end to end.
            justification: |
              The system's value lies in the whole pipeline rather than any one stage. Running the
              stages in one fixed sequence keeps each stage's preconditions explicit.
            children:
              - DocDownCore-Extraction-DocDownEngine-PipelineOrder
              - DocDownCore-Extraction-DocDownEngine-RenderRequestApplicability
              - DocDownCore-Extraction-DocDownEngine-FailureArtifacts
              - DocDownCore-Extraction-DocDownEngine-Cancellation
              - DocDownCore-Extraction-DocDownEngine-RejectNullArguments
            tests:
              - Extraction_Orchestration_TextDocument_RunsPipelineEndToEnd

          - id: DocDownCore-Extraction-StructuredFailure
            title: The subsystem shall return unreadable failures as structured data instead of throwing.
            justification: |
              Hosts need to inspect routine extraction failures without catching ordinary
              exceptions. Structured failure data keeps the calling workflow in control.
            children:
              - DocDownCore-Extraction-DocDownEngine-FailureReturned
              - DocDownCore-Extraction-DocDownEngine-ExtractorIsolation
              - DocDownCore-Extraction-ExtractorSelector-PackageHint
            tests:
              - Extraction_StructuredFailure_NoAvailableBackend_ReturnsUnreadableFailure

          - id: DocDownCore-Extraction-OptionIsolation
            title: The subsystem shall snapshot the caller's options before using them.
            justification: |
              Callers often reuse one options object across extractions. Snapshotting the options
              prevents later mutation from changing the behavior of another run.
            children:
              - DocDownCore-Extraction-DocDownBuilder-ConfigureDefaults
              - DocDownCore-Extraction-DocDownBuilder-ImmutableSnapshot
              - DocDownCore-Extraction-DocDownEngine-OptionsSnapshot
            tests:
              - Extraction_OptionIsolation_BuilderMutatedAfterBuild_DoesNotAffectEngine

          - id: DocDownCore-Extraction-ExtractorIsolation
            title: The subsystem shall contain backend faults and convert them into unreadable results.
            justification: |
              Third-party extractors process untrusted documents and can fail unexpectedly.
              Containing those faults protects the host process and preserves the output contract.
            children:
              - DocDownCore-Extraction-DocDownEngine-ExtractorIsolation
            tests:
              - Extraction_ExtractorIsolation_BackendThrows_BecomesUnreadableFailure

          - id: DocDownCore-Extraction-SelfValidationSeam
            title: The subsystem shall expose Core self-tests together with backend-contributed cases.
            justification: |
              Operators need one place to validate the deployed extraction environment. A single
              self-test seam lets them run both Core and backend checks together.
            children:
              - DocDownCore-Extraction-DocDownEngine-SelfTestCases
            tests:
              - Extraction_SelfValidationSeam_Engine_ExposesCoreAndBackendCases

          - id: DocDownCore-Extraction-TwoStateOutcome
            title: The subsystem shall return only Produced or Unreadable extraction outcomes.
            justification: |
              The governing principle reduces outcome reporting to whether the standard layout was
              written or the extraction was unreadable. Any partial step completion is described by
              notes and content inventory, not a third outcome value.
            children:
              - DocDownCore-Extraction-DocDownEngine-TwoStateOutcome
            tests:
              - Extraction_Orchestration_TextDocument_RunsPipelineEndToEnd
              - Extraction_StructuredFailure_NoAvailableBackend_ReturnsUnreadableFailure
