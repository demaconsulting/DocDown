---
# Software Unit Requirements for ContractVerifier
#
# ContractVerifier independently checks a finished extraction against its contract,
# reporting every mismatch between the recorded result and the artifacts on disk rather
# than throwing.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ContractVerifier Requirements
            requirements:
              - id: DocDownCore-Output-ContractVerifier-HonestExtractionPasses
                title: ContractVerifier shall report no violations for an honest, complete extraction.
                justification: |
                  The verifier is only credible if a correct extraction passes cleanly. Reporting no
                  violations for an honest run establishes the baseline against which every detected
                  violation is meaningful.
                tests:
                  - ContractVerifier_Verify_HonestExtraction_ReportsNoViolations

              - id: DocDownCore-Output-ContractVerifier-DetectsMissingArtifact
                title: >-
                  ContractVerifier shall detect any artifact the manifest claims which is missing
                  from disk, including the fixed root artifacts.
                justification: |
                  A record that references files no longer present misleads consumers. This is the
                  forward half of the two-way reconciliation: every artifact the manifest claims —
                  a listed image, page, or part, and also summary.txt, manifest.json, or content.md
                  claimed present or partial by the completeness ledger — must be backed by a file
                  on disk. Without the root-artifact half, a manifest could promise a summary that
                  was never written and still pass.
                tests:
                  - ContractVerifier_Verify_ListedImageDeleted_DetectsMissingArtifact
                  - ContractVerifier_Verify_SummaryDeleted_DetectsMissingSummary
                  - ContractVerifier_Verify_ManifestClaimsSummaryPresentButAbsent_ReportsListedResourceMissing

              - id: DocDownCore-Output-ContractVerifier-DetectsUnlistedFile
                title: >-
                  ContractVerifier shall detect any file anywhere beneath the scratch root that the
                  manifest does not account for.
                justification: |
                  An unlisted file may be leftover or injected content that consumers would wrongly
                  trust. This is the reverse half of the two-way reconciliation, and it must be
                  exhaustive to be worth anything: a walk limited to the direct children of the
                  resource folders would miss a stray file dropped at the scratch root and one
                  hidden a level below images/, which is exactly where content would be smuggled.
                  Only the three fixed root artifacts and the manifest's own image, page, and part
                  paths account for a file; everything else is reported. A folder the verifier
                  cannot read is never treated as an empty directory: the walk reports that it
                  could not be performed rather than concluding that nothing unlisted exists.
                tests:
                  - ContractVerifier_Verify_UnlistedFileAdded_DetectsUnlistedFile
                  - ContractVerifier_Verify_RootLevelUnlistedFile_ReportsUnlistedFile
                  - ContractVerifier_Verify_NestedUnlistedFileUnderImages_ReportsUnlistedFile

              - id: DocDownCore-Output-ContractVerifier-ReportsIncompleteVerification
                title: >-
                  ContractVerifier shall report a verification it could not perform as incomplete,
                  naming the folder and the reason, rather than as a passing check.
                justification: |
                  The product's central promise is that whatever could not be done is stated
                  explicitly with a reason rather than silently omitted, and the verifier is the
                  one component whose job is to guarantee it. Collapsing a failed directory read to
                  an empty listing breaks that promise in the worst possible place: an unreadable
                  subtree would suppress the unlisted-file finding entirely, so a blocked read
                  would be indistinguishable from a clean pass. An explicit finding carrying the
                  path and the reason makes the result distinguishable from success, and the
                  folder-ledger count comparison is skipped rather than run against a substituted
                  zero, because an unknown count must not be allowed to manufacture — or to
                  conceal — a contradiction.
                tests:
                  - ContractVerifier_Verify_UnreadableSubtree_ReportsVerificationIncomplete
                  - ContractVerifier_Verify_UnreadableSubtree_IsNotACleanPass
                  - ContractVerifier_Verify_UnreadableResourceFolder_ReportsIncompleteWithoutFalseLedgerMismatch

              - id: DocDownCore-Output-ContractVerifier-DetectsHashMismatch
                title: ContractVerifier shall detect an artifact whose bytes no longer match the recorded hash.
                justification: |
                  Post-extraction tampering or corruption changes an artifact's bytes. Comparing content
                  against the recorded hash proves each artifact is exactly what was written, giving
                  consumers integrity assurance.
                tests:
                  - ContractVerifier_Verify_TamperedImageBytes_DetectsHashMismatch

              - id: DocDownCore-Output-ContractVerifier-DetectsLedgerMismatch
                title: ContractVerifier shall detect a ledger status or count that contradicts the filesystem.
                justification: |
                  The completeness ledger drives downstream decisions. Detecting a ledger status or count
                  that disagrees with disk stops consumers from trusting a completeness claim the
                  artifacts do not support.
                tests:
                  - ContractVerifier_Verify_LedgerCountContradictsDisk_DetectsLedgerMismatch

              - id: DocDownCore-Output-ContractVerifier-DetectsUnexplainedAbsence
                title: ContractVerifier shall detect a partial or absent artifact that no gap explains.
                justification: |
                  The core honesty guarantee is that every absence is explained. Detecting a partial or
                  absent artifact with no matching gap enforces that guarantee independently of the
                  writer that should have upheld it.
                tests:
                  - ContractVerifier_Verify_PartialArtifactWithoutGap_DetectsUnexplainedAbsence

              - id: DocDownCore-Output-ContractVerifier-DetectsBackendMismatch
                title: >-
                  ContractVerifier shall detect when the summary's backend declaration does not
                  exactly match the backend the manifest records.
                justification: |
                  The human and machine records must agree on provenance. A substring search over
                  the whole summary is open to spoofing: the backend identifier appears incidentally in the
                  candidate trace and in narrative text, so a summary whose authoritative Selected
                  line names a different backend could still pass. Anchoring on the exact
                  "  Selected  : {id} - {displayName}" line makes the check mean what it claims.
                tests:
                  - ContractVerifier_Verify_SummaryOmitsBackend_DetectsBackendMismatch
                  - ContractVerifier_Verify_SummaryMentionsBackendOutsideTheBackendBlock_ReportsBackendMismatch

              - id: DocDownCore-Output-ContractVerifier-ReportsRatherThanThrows
                title: >-
                  ContractVerifier shall report violations instead of throwing, even for absent or unparsable
                  input.
                justification: |
                  Verification runs over possibly damaged output and must never itself crash. Reporting
                  violations, even when the manifest is absent or unparsable, lets a caller always obtain
                  a complete verdict.
                tests:
                  - ContractVerifier_Verify_AbsentAndUnparsable_ReportsRatherThanThrows
