---
# Software Unit Requirements for SummaryWriter
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-SummaryWriter-GapsEnumerated
# required numbered gap rendering in the summary. It is superseded (not satisfied) by
# DocDownCore-Output-SummaryWriter-NotesListed because the summary now lists only plain extraction
# notes for attempted-but-incomplete work.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: SummaryWriter Requirements
            requirements:
              - id: DocDownCore-Output-SummaryWriter-MandatorySections
                title: SummaryWriter shall write every mandatory section of the reduced summary format.
                justification: |
                  Operators rely on finding the same sections in the same order for every
                  extraction summary.
                tests:
                  - SummaryWriter_WriteAsync_CleanRun_ContainsEveryMandatorySection

              - id: DocDownCore-Output-SummaryWriter-AbsoluteScratchPath
                title: SummaryWriter shall state the absolute scratch-folder path in the summary header.
                justification: |
                  A reader needs the exact scratch location before inspecting any other output.
                tests:
                  - SummaryWriter_WriteAsync_HeaderBlock_ContainsAbsoluteScratchPath

              - id: DocDownCore-Output-SummaryWriter-BackendNamed
                title: SummaryWriter shall name the selected backend for a successful run.
                justification: |
                  Backend attribution lets an operator relate output to the extractor that
                  produced it.
                tests:
                  - SummaryWriter_WriteAsync_SuccessfulRun_NamesSelectedBackend

              - id: DocDownCore-Output-SummaryWriter-EnvironmentReported
                title: SummaryWriter shall report the runtime environment and contributed environment facts.
                justification: |
                  The extraction environment helps explain why one run differs from another.
                tests:
                  - SummaryWriter_WriteAsync_WithEnvironmentFacts_ReportsRuntimeAndFacts

              - id: DocDownCore-Output-SummaryWriter-NotesListed
                title: SummaryWriter shall list extraction notes under the Could not read section.
                justification: |
                  Attempted-but-incomplete extraction work should be visible to a human reader in a
                  predictable location.
                tests:
                  - SummaryWriter_WriteAsync_ProducedRun_ListsNotesUnderCouldNotRead

              - id: DocDownCore-Output-SummaryWriter-FailureExplained
                title: SummaryWriter shall reproduce the unreadable failure explanation verbatim.
                justification: |
                  Failure prose is composed for direct display and should not be paraphrased by the
                  summary renderer.
                tests:
                  - SummaryWriter_WriteAsync_UnreadableRun_ReproducesFailureExplanationVerbatim

              - id: DocDownCore-Output-SummaryWriter-DeterministicText
                title: SummaryWriter shall produce byte-identical summary text for identical content.
                justification: |
                  Stable summary bytes are required for reproducible output and clean diffs.
                tests:
                  - SummaryWriter_WriteAsync_SameContentTwice_ProducesByteIdenticalSummary

              - id: DocDownCore-Output-SummaryWriter-EnvironmentAttributed
                title: >-
                  SummaryWriter shall group contributed environment facts by source and collapse
                  unused available candidates into a counted line.
                justification: |
                  Grouping keeps each component's facts readable, while collapsing unused available
                  candidates prevents the summary from spending most of its space on backends that
                  did not run.
                tests:
                  - SummaryWriter_WriteAsync_UnusedAvailableCandidates_CollapsesThemIntoOneCountedLine

              - id: DocDownCore-Output-SummaryWriter-MetadataInlining
                title: SummaryWriter shall inline authored metadata using the documented author fallback rules.
                justification: |
                  A reader needs a compact orientation view of the document's authored metadata
                  without opening metadata.json first.
                tests:
                  - SummaryWriter_WriteAsync_PdfShapedMetadata_InlinesHumanAuthorNotApplication
                  - SummaryWriter_WriteAsync_OpcShapedMetadata_FallsBackToCreatorAsAuthor

              - id: DocDownCore-Output-SummaryWriter-GistAndInventory
                title: >-
                  SummaryWriter shall open with a justified gist and outline counted content
                  features, including looked-for zero counts.
                justification: |
                  Readers need a compact description of both what the document is and what kinds of
                  content the extracted markdown contains.
                tests:
                  - SummaryWriter_WriteAsync_WithContentFeatures_OpensWithGistAndOutlinesContent
                  - SummaryWriter_WriteAsync_LookedForZeroFeature_OutlinesTheZero
                  - SummaryWriter_WriteAsync_UnknownFormat_OmitsGistRatherThanGuessing

              - id: DocDownCore-Output-SummaryWriter-ImageSummary
                title: >-
                  SummaryWriter shall summarize extracted images in aggregate and point to
                  manifest.json for detail.
                justification: |
                  Per-image detail belongs in the manifest, while the summary should communicate the
                  overall shape of the extracted image set.
                tests:
                  - SummaryWriter_WriteAsync_WithImages_SummarizesInAggregateAndExplainsTemplateImages

              - id: DocDownCore-Output-SummaryWriter-GoldenOutput
                title: SummaryWriter shall render representative summary output matching the committed golden files.
                justification: |
                  Golden files keep the human-readable wording itself under review, not only the
                  implementation that produced it.
                tests:
                  - SummaryWriter_Golden_RenderedPagesNoImages_MatchesCommittedGolden
                  - SummaryWriter_Golden_EmbeddedImages_MatchesCommittedGolden
                  - SummaryWriter_Golden_RenderingNotAvailableNote_MatchesCommittedGolden
                  - SummaryWriter_Golden_UnreadableDocxNoBackend_MatchesCommittedGolden
