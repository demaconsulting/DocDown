---
# Software Unit Requirements for ExtractionSink
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ExtractionSink-AllocatesGapIdentifiers
# required numbered gap identifiers and substitute reasons. It is superseded (not satisfied) with no
# replacement because the gap-reporting machinery was removed from Core.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ExtractionSink Requirements
            requirements:
              - id: DocDownCore-Output-ExtractionSink-AllocatesImagePaths
                title: >-
                  ExtractionSink shall allocate dense, ordinal-prefixed relative paths for images with
                  an extension matching the written media type.
                justification: |
                  Backends embed image links using the path the sink returns. Core-side allocation
                  keeps image names stable and safe regardless of backend naming hints.
                tests:
                  - ExtractionSink_AddImageAsync_ThreeDistinctImages_AllocatesDenseOrdinalPaths
                  - ExtractionSink_AddImageAsync_JpegMediaType_UsesJpgExtension
                  - ExtractionSink_AddImageAsync_VectorMediaType_UsesTrueExtension

              - id: DocDownCore-Output-ExtractionSink-ImageDeduplication
                title: ExtractionSink shall write identical image bytes once and return the same path for repeats.
                justification: |
                  Documents often reuse the same image bytes many times. Deduplication keeps output
                  compact while preserving every reference.
                tests:
                  - ExtractionSink_AddImageAsync_IdenticalBytesTwice_DeduplicatesToOneFile
                  - ExtractionSink_AddImageAsync_DuplicateBytes_MergesReferrerSets

              - id: DocDownCore-Output-ExtractionSink-AllocatesPagePaths
                title: ExtractionSink shall name each rendered page file by its document page number.
                justification: |
                  A rendered page file should map back to the source page without guesswork.
                tests:
                  - ExtractionSink_AddPageAsync_PageNumber_NamesFileByDocumentPage
                  - ExtractionSink_AddPageAsync_ZeroPageNumber_ThrowsArgumentOutOfRange

              - id: DocDownCore-Output-ExtractionSink-AllocatesPartPaths
                title: ExtractionSink shall allocate dense ordinal-kind-slug paths for content parts.
                justification: |
                  Advisory part ordinals from a backend should not create sparse numbering or
                  collisions in the output layout.
                tests:
                  - ExtractionSink_AddContentPartAsync_ConflictingAdvisoryOrdinals_AllocatesDenseOrdinals

              - id: DocDownCore-Output-ExtractionSink-ImageSuppression
                title: ExtractionSink shall suppress image writes when images are disabled and return an empty path.
                justification: |
                  A caller that disables images expects no image files and no image links to be
                  emitted from the sink.
                tests:
                  - ExtractionSink_AddImageAsync_ImagesDisabled_SuppressesWritesAndReturnsEmptyPath

              - id: DocDownCore-Output-ExtractionSink-RecordsReports
                title: >-
                  ExtractionSink shall record document metadata, environment facts, and notes for
                  later serialization and reject a blank note.
                justification: |
                  The later writers consume the sink's recorded state rather than re-reading the
                  document or reconstructing extractor decisions.
                tests:
                  - ExtractionSink_Reports_RecordedForLaterSerialization
                  - ExtractionSink_ReportNote_BlankMessage_ThrowsArgumentException

              - id: DocDownCore-Output-ExtractionSink-RecordsContentFeatures
                title: >-
                  ExtractionSink shall accumulate counted content features by label, keep a
                  looked-for-but-absent feature, and reject an invalid feature.
                justification: |
                  Content features state what the document does or does not contain. Accumulation by
                  label keeps repeated reports honest, a looked-for zero keeps an absence the backend
                  checked for visible, and an invalid feature cannot be rendered truthfully.
                tests:
                  - ExtractionSink_ReportContentFeature_RepeatedLabels_AccumulateAndDropZeroCounts
                  - ExtractionSink_ReportContentFeature_LookedForZero_IsReported
                  - ExtractionSink_ReportContentFeature_InvalidFeature_Throws

              - id: DocDownCore-Output-ExtractionSink-RecordsReviewComments
                title: >-
                  ExtractionSink shall record reported reviewer comments in report order and reject
                  a comment that carries no body or no location.
                justification: |
                  The review-comments writer consumes the sink's recorded comments rather than
                  re-reading the document, so the sink must preserve the backend's ordering. A
                  comment with nothing to say, or with nowhere to point, cannot be rendered into an
                  honest entry, so it is refused at the boundary where the defective caller can
                  still be identified.
                tests:
                  - ExtractionSink_ReportReviewComment_Reported_RetainedInReportOrder
                  - ExtractionSink_ReportReviewComment_BlankBody_ThrowsArgumentException
                  - ExtractionSink_ReportReviewComment_BlankLocation_ThrowsArgumentException
                  - ExtractionSink_ReportReviewComment_NullComment_ThrowsArgumentNullException

              - id: DocDownCore-Output-ExtractionSink-ImageTransformRecorded
                title: >-
                  ExtractionSink shall preserve the transform recorded for each image so later
                  output can report per-image provenance honestly.
                justification: |
                  Only the extractor knows whether image bytes were passed through unchanged or
                  were decoded and re-encoded before reaching the sink.
                tests:
                  - ExtractionSink_AddImageAsync_NoTransformReported_RecordsPassthrough
                  - ExtractionSink_AddImageAsync_DecodedToPngReported_RecordsTransform
                  - Output_ImageProvenance_MixedTransforms_ManifestRecordsEachHonestly

              - id: DocDownCore-Output-ExtractionSink-ImageDescriptionRecorded
                title: >-
                  ExtractionSink shall preserve each image's descriptive text, description
                  provenance, and referrer metadata for later serialization.
                justification: |
                  Per-image descriptive text and referrer metadata originate with the extractor and
                  must remain attached to the stored image record.
                tests:
                  - ExtractionSink_AddImageAsync_DescriptionAndReferrers_AreRecorded
                  - ManifestWriter_WriteAsync_ImageMetadata_SerializesReferrersTemplateAndDescription

          - title: EmbeddedImageWriter Requirements
            requirements:
              - id: DocDownCore-Output-EmbeddedImageWriter-WritesDeduplicated
                title: >-
                  EmbeddedImageWriter shall write each distinct embedded image once, count a vector
                  image as vector, and merge the referrers of identical content.
                justification: |
                  Backends hand every occurrence of an image to the writer. Writing identical bytes once
                  while keeping every referrer keeps output compact without losing where an image appeared.
                tests:
                  - EmbeddedImageWriter_Write_DuplicateContent_CountsOnce
                  - EmbeddedImageWriter_Write_DuplicateContent_MergesReferrerSets
                  - EmbeddedImageWriter_Write_VectorMetafile_CountedAsVector

              - id: DocDownCore-Output-EmbeddedImageWriter-SkipsOversized
                title: >-
                  EmbeddedImageWriter shall skip an image that exceeds the configured byte or dimension
                  limit and report the skip.
                justification: |
                  Limits protect the caller from decompression-style abuse. A skipped image must be
                  reported so the reader knows it was not extracted.
                tests:
                  - EmbeddedImageWriter_Write_ExceedsByteLimit_SkipsForSize
                  - EmbeddedImageWriter_Write_ExceedsDimensionLimit_SkipsForSize

              - id: DocDownCore-Output-ImageDimensions-ReadsHeaders
                title: >-
                  ImageDimensions shall read the pixel width and height from PNG, JPEG, GIF, and BMP
                  headers and report failure, rather than throw, for non-raster or malformed data.
                justification: |
                  Dimension limits are enforced on untrusted bytes, so header parsing must be safe for
                  truncated input and for hostile header values such as a minimum-integer BMP height.
                tests:
                  - ImageDimensions_TryRead_Png_ReadsWidthAndHeight
                  - ImageDimensions_TryRead_Jpeg_ReadsWidthAndHeight
                  - ImageDimensions_TryRead_Gif_ReadsWidthAndHeight
                  - ImageDimensions_TryRead_Bmp_ReadsWidthAndAbsoluteHeight
                  - ImageDimensions_TryRead_BmpMinValueHeight_ReturnsFalseWithoutThrowing
                  - ImageDimensions_TryRead_NonRaster_ReturnsFalse
                  - ImageDimensions_TryRead_Truncated_ReturnsFalse

              - id: DocDownCore-Output-ImageLinkText-SafeAltText
                title: >-
                  ImageLinkText shall produce single-line alt text with link-structural characters
                  escaped and a neutral placeholder when no description exists.
                justification: |
                  Alt text originates in document content. Escaping and line folding keep it from
                  breaking the Markdown image link that carries it.
                tests:
                  - Alt_NoDescription_UsesNeutralPlaceholder
                  - Alt_PlainDescription_IsPreserved
                  - Alt_LinkStructuralCharacters_AreEscaped
                  - Alt_MultiLineDescription_StaysOnOneLine
