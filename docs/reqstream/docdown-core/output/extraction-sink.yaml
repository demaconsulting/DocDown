---
# Software Unit Requirements for ExtractionSink
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ExtractionSink-AllocatesGapIdentifiers
# required numbered gap identifiers and substitute reasons. It is superseded (not satisfied) with no
# replacement because the gap-reporting machinery was removed from Core.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ExtractionSink Requirements
            requirements:
              - id: DocDownCore-Output-ExtractionSink-AllocatesImagePaths
                title: >-
                  ExtractionSink shall allocate dense, ordinal-prefixed relative paths for images with
                  an extension matching the written media type.
                justification: |
                  Backends embed image links using the path the sink returns. Core-side allocation
                  keeps image names stable and safe regardless of backend naming hints.
                tests:
                  - ExtractionSink_AddImageAsync_ThreeDistinctImages_AllocatesDenseOrdinalPaths
                  - ExtractionSink_AddImageAsync_JpegMediaType_UsesJpgExtension
                  - ExtractionSink_AddImageAsync_VectorMediaType_UsesTrueExtension

              - id: DocDownCore-Output-ExtractionSink-ImageDeduplication
                title: ExtractionSink shall write identical image bytes once and return the same path for repeats.
                justification: |
                  Documents often reuse the same image bytes many times. Deduplication keeps output
                  compact while preserving every reference.
                tests:
                  - ExtractionSink_AddImageAsync_IdenticalBytesTwice_DeduplicatesToOneFile
                  - ExtractionSink_AddImageAsync_DuplicateBytes_MergesReferrerSets

              - id: DocDownCore-Output-ExtractionSink-AllocatesPagePaths
                title: ExtractionSink shall name each rendered page file by its document page number.
                justification: |
                  A rendered page file should map back to the source page without guesswork.
                tests:
                  - ExtractionSink_AddPageAsync_PageNumber_NamesFileByDocumentPage

              - id: DocDownCore-Output-ExtractionSink-AllocatesPartPaths
                title: ExtractionSink shall allocate dense ordinal-kind-slug paths for content parts.
                justification: |
                  Advisory part ordinals from a backend should not create sparse numbering or
                  collisions in the output layout.
                tests:
                  - ExtractionSink_AddContentPartAsync_ConflictingAdvisoryOrdinals_AllocatesDenseOrdinals

              - id: DocDownCore-Output-ExtractionSink-ImageSuppression
                title: ExtractionSink shall suppress image writes when images are disabled and return an empty path.
                justification: |
                  A caller that disables images expects no image files and no image links to be
                  emitted from the sink.
                tests:
                  - ExtractionSink_AddImageAsync_ImagesDisabled_SuppressesWritesAndReturnsEmptyPath

              - id: DocDownCore-Output-ExtractionSink-RecordsReports
                title: >-
                  ExtractionSink shall record document metadata, environment facts, notes, and
                  counted content features for later serialization.
                justification: |
                  The later writers consume the sink's recorded state rather than re-reading the
                  document or reconstructing extractor decisions.
                tests:
                  - ExtractionSink_Reports_RecordedForLaterSerialization
                  - ExtractionSink_ReportContentFeature_RepeatedLabels_AccumulateAndDropZeroCounts
                  - ExtractionSink_ReportContentFeature_LookedForZero_IsReported

              - id: DocDownCore-Output-ExtractionSink-ImageTransformRecorded
                title: >-
                  ExtractionSink shall preserve the transform recorded for each image so later
                  output can report per-image provenance honestly.
                justification: |
                  Only the extractor knows whether image bytes were passed through unchanged or
                  were decoded and re-encoded before reaching the sink.
                tests:
                  - Output_ImageProvenance_MixedTransforms_ManifestRecordsEachHonestly

              - id: DocDownCore-Output-ExtractionSink-ImageDescriptionRecorded
                title: >-
                  ExtractionSink shall preserve each image's descriptive text, description
                  provenance, and referrer metadata for later serialization.
                justification: |
                  Per-image descriptive text and referrer metadata originate with the extractor and
                  must remain attached to the stored image record.
                tests:
                  - ManifestWriter_WriteAsync_ImageMetadata_SerializesReferrersTemplateAndDescription
