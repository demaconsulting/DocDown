---
# Software Unit Requirements for ManifestWriter
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ManifestWriter-CompletenessLedger
# required the removed completeness ledger. It is superseded (not satisfied) with no replacement.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ManifestWriter-GapSynthesis
# required synthesized gaps for unexplained absences. It is superseded (not satisfied) with no
# replacement because gaps were removed from Core.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ManifestWriter-CompleteFlag
# required the removed complete flag. It is superseded (not satisfied) with no replacement because
# manifest schema 2.0 no longer carries a completeness verdict.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ManifestWriter Requirements
            requirements:
              - id: DocDownCore-Output-ManifestWriter-SchemaVersion
                title: ManifestWriter shall declare manifest schema version 2.0.
                justification: |
                  Machine consumers need an explicit schema version before they act on the file.
                tests:
                  - ManifestWriter_WriteAsync_AnyRun_DeclaresSchemaVersionTwoPointZero

              - id: DocDownCore-Output-ManifestWriter-MachineTwin
                title: >-
                  ManifestWriter shall record the producing tool, selected backend, scratch folder,
                  status, and unreadable failure details in the manifest.
                justification: |
                  The manifest is the machine-readable extraction record and must attribute the run
                  to its actual producer and outcome.
                tests:
                  - ManifestWriter_WriteAsync_ProducedRun_RecordsToolBackendScratchAndStatus
                  - ManifestWriter_WriteAsync_UnreadableRun_RecordsFailureAndUnreadableStatus

              - id: DocDownCore-Output-ManifestWriter-ReducedSchema
                title: >-
                  ManifestWriter shall emit the reduced top-level schema, including the reduced
                  requested-options block and reduced extractor shape, and omit removed keys.
                justification: |
                  Schema 2.0 removes prior reporting structures, so the serialized manifest must
                  expose only the surviving fields.
                tests:
                  - ManifestWriter_WriteAsync_RequestedOptions_ContainsReducedFieldSet
                  - ManifestWriter_WriteAsync_ProducedRun_OmitsRemovedTopLevelKeys
                  - ManifestWriter_WriteAsync_SelectedExtractor_SerializesReducedExtractorShape

              - id: DocDownCore-Output-ManifestWriter-NotesSerialized
                title: ManifestWriter shall serialize extraction notes as plain strings in emission order.
                justification: |
                  Machine-readable note output should match the order and wording recorded during
                  extraction.
                tests:
                  - ManifestWriter_WriteAsync_NotesReported_SerializesMessagesInOrder

              - id: DocDownCore-Output-ManifestWriter-DeterministicJson
                title: >-
                  ManifestWriter shall serialize byte-identical JSON without a byte-order
                  mark for identical content.
                justification: |
                  Stable bytes are required for reproducible output and clean diffs.
                tests:
                  - ManifestWriter_WriteAsync_SameContentTwice_ProducesByteIdenticalNoBomJson

              - id: DocDownCore-Output-ManifestWriter-ImageTransformProjected
                title: ManifestWriter shall project every image transform to its manifest string form.
                justification: |
                  Per-image provenance is only useful if the manifest writes it in a stable
                  machine-comparable vocabulary.
                tests:
                  - ManifestWriter_WriteAsync_DecodedToPngImage_SerializesCamelCaseTransform

              - id: DocDownCore-Output-ManifestWriter-ImageReferrerFields
                title: >-
                  ManifestWriter shall name each image's referrers as sourcePages, expose the first
                  referrer as the scalar alias sourcePage, and flag a template-only image as
                  referencedByTemplate.
                justification: |
                  Consumers parse manifest.json directly, so the field names and the alias rule are
                  part of the published contract rather than an implementation detail: a consumer
                  that reads only the scalar must still see the first referrer, and a consumer that
                  reads the array must be able to tell a template-only image from a page reference.
                tests:
                  - ManifestWriter_WriteAsync_ImageMetadata_SerializesReferrersTemplateAndDescription

              - id: DocDownCore-Output-ManifestWriter-ImageDescriptionSerialized
                title: >-
                  ManifestWriter shall serialize each image's referrers, template flag,
                  description, description provenance, and related image metadata.
                justification: |
                  Per-image metadata lets consumers understand where an image came from and whether
                  the document supplied meaningful descriptive text for it.
                tests:
                  - ManifestWriter_WriteAsync_ImageMetadata_SerializesReferrersTemplateAndDescription
