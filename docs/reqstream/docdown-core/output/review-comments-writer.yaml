---
# Software Unit Requirements for ReviewCommentsWriter
#
# ReviewCommentsWriter finalizes review-comments.md, the reviewer commentary a document
# carries. It is the one output artifact whose presence varies with the document: the file
# is written only when the document actually carries reviewer comments, so its absence is a
# truthful statement that no review was found rather than an empty file asserting an empty
# review.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ReviewCommentsWriter Requirements
            requirements:
              - id: DocDownCore-Output-ReviewCommentsWriter-ConditionalArtifact
                title: >-
                  ReviewCommentsWriter shall write review-comments.md only when the document
                  carries reviewer comments, and shall report that no file was written otherwise.
                justification: |
                  An empty review-comments.md would assert that a review took place and produced
                  nothing, which is a different claim from the document never having been
                  commented on. Reporting absence as absence keeps the output honest and lets a
                  consumer test for the file rather than parse it to learn the same thing.
                tests:
                  - ReviewCommentsWriter_WriteAsync_NoComments_WritesNoFileAndReportsNone
                  - ReviewCommentsWriter_WriteAsync_SingleComment_WritesDocumentWithEntry

              - id: DocDownCore-Output-ReviewCommentsWriter-EntryFormat
                title: >-
                  ReviewCommentsWriter shall render each comment as a single Markdown entry
                  carrying its author, location, and body.
                justification: |
                  A reviewer comment is only actionable when a reader can see who raised it and
                  where in the document it sits. Keeping each comment to one entry — including
                  one whose body spans several lines in the source document — means the file can
                  be scanned, diffed, and machine-split by line without the body being mistaken
                  for document text.
                tests:
                  - ReviewCommentsWriter_WriteAsync_SingleComment_WritesDocumentWithEntry
                  - ReviewCommentsWriter_WriteAsync_MultiLineBody_KeepsEntryOnOneLine

              - id: DocDownCore-Output-ReviewCommentsWriter-ReportOrder
                title: >-
                  ReviewCommentsWriter shall write comments in the order the extractor reported
                  them.
                justification: |
                  The backend knows the document order a reader expects; re-sorting in Core would
                  discard that knowledge and make two runs over the same document harder to
                  compare.
                tests:
                  - ReviewCommentsWriter_WriteAsync_ManyComments_WritesEntriesInReportOrder

              - id: DocDownCore-Output-ReviewCommentsWriter-UnattributedReported
                title: >-
                  ReviewCommentsWriter shall report a comment the document leaves unattributed as
                  unattributed.
                justification: |
                  Documents routinely carry anonymous annotations. Naming the absence of an author
                  is honest, where guessing one from other metadata or silently dropping the entry
                  would not be.
                tests:
                  - ReviewCommentsWriter_WriteAsync_CommentWithoutAuthor_ReportsUnattributed
