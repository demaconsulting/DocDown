---
# Software Unit Requirements for ContentWriter
#
# ContentWriter finalizes the Markdown content: a single flow with preserved page
# markers, or an index over split parts.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ContentWriter-SplitModeHonored
# required the writer to honor a caller-chosen split mode. It is superseded (not satisfied) with no
# replacement because the caller-facing choice was removed under the simplicity principle: the
# layout now follows the document — a single flow when the backend offered no parts, an index over
# parts/ when it did — and DocDownCore-Output-ContentWriter-SingleFlowDocument and
# DocDownCore-Output-ContentWriter-PartIndex together cover both layouts.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ContentWriter Requirements
            requirements:
              - id: DocDownCore-Output-ContentWriter-SingleFlowDocument
                title: ContentWriter shall write a single-flow document with the extracted content verbatim.
                justification: |
                  Consumers that want one document file should receive the buffered markdown without
                  reshaping it.
                tests:
                  - ContentWriter_WriteAsync_SingleBufferedFlow_WritesContentVerbatim

              - id: DocDownCore-Output-ContentWriter-PartIndex
                title: ContentWriter shall write an index linking to each part file when content is split.
                justification: |
                  Part-based content still needs a single predictable entry point for readers.
                tests:
                  - ContentWriter_WriteAsync_MultipleParts_ProducesIndexAndPartFiles
                  - ContentWriter_WriteAsync_SinglePart_ProducesIndexWithPartFile

              - id: DocDownCore-Output-ContentWriter-PageMarkers
                title: ContentWriter shall preserve backend-supplied page markers in single-flow output.
                justification: |
                  Page markers provide source correlation that downstream readers rely on.
                tests:
                  - ContentWriter_WriteAsync_SingleFlowWithPageMarkers_PreservesMarkers

              - id: DocDownCore-Output-ContentWriter-AbsenceExplained
                title: ContentWriter shall write content.md and report whether any textual content was present.
                justification: |
                  The output layout stays stable even when a flow contains no meaningful text, but a
                  reader still needs the result to state that absence honestly.
                tests:
                  - ContentWriter_WriteAsync_EmptyFlow_WritesFileButReportsAbsent
