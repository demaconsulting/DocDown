---
# Software Unit Requirements for ScratchFolder
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ScratchFolder-ModeRequireEmpty
# required the removed RequireEmpty mode. It is superseded (not satisfied) with no replacement
# because Core now supports only CleanIfDocDownFolder and Overwrite.
#
# SUPERSEDED REQUIREMENT: DocDownCore-Output-ScratchFolder-ModeCreateUnique
# required the removed CreateUnique mode. It is superseded (not satisfied) with no replacement
# because Core now supports only CleanIfDocDownFolder and Overwrite.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ScratchFolder Requirements
            requirements:
              - id: DocDownCore-Output-ScratchFolder-ModeCleanIfDocDownFolder
                title: >-
                  ScratchFolder shall delete, under CleanIfDocDownFolder, only the files a manifest
                  written for that same folder accounts for and shall refuse otherwise.
                justification: |
                  The default reuse mode must not destroy caller data. It therefore deletes only
                  proven prior DocDown output and refuses when the proof is incomplete.
                tests:
                  - ScratchFolder_Prepare_CleanIfDocDownOnUserFolder_RefusesAndPreservesContents
                  - ScratchFolder_Prepare_CleanIfDocDownOnDocDownFolder_CleansInventoriedFiles

              - id: DocDownCore-Output-ScratchFolder-ReuseBoundToFolder
                title: >-
                  ScratchFolder shall refuse destructive reuse unless the manifest records that very
                  folder as its scratch folder.
                justification: |
                  A genuine DocDown manifest copied into another folder must not authorize deletion
                  of that folder's contents.
                tests:
                  - ScratchFolder_Prepare_CopiedGenuineManifestAmongUserFiles_RefusesAndPreservesContents

              - id: DocDownCore-Output-ScratchFolder-InventoryScopedDeletion
                title: >-
                  ScratchFolder shall delete only manifest-accounted files and refuse when any file
                  is unaccounted for or any manifest path escapes the folder.
                justification: |
                  Safe destructive reuse requires both a complete inventory and containment of every
                  inventoried path.
                tests:
                  - ScratchFolder_Prepare_UnaccountedFileBesideManifest_RefusesAndPreservesContents
                  - ScratchFolder_Prepare_EscapingManifestPath_Refuses
                  - ScratchFolder_Prepare_CleanIfDocDownOnDocDownFolder_CleansInventoriedFiles

              - id: DocDownCore-Output-ScratchFolder-RevalidatedBeforeDeletion
                title: >-
                  ScratchFolder shall re-read each inventoried target before deleting it and refuse
                  when the folder changed after the inventory scan.
                justification: |
                  The default reuse guard must not act on a stale view of the folder contents.
                tests:
                  - ScratchFolder_Prepare_FolderChangesDuringPreparation_Refuses

              - id: DocDownCore-Output-ScratchFolder-ModeOverwrite
                title: ScratchFolder shall clear an existing folder's contents under Overwrite.
                justification: |
                  Overwrite is the caller's explicit opt-in to unconditional replacement.
                tests:
                  - ScratchFolder_Prepare_OverwriteOnPopulatedFolder_ClearsContents

              - id: DocDownCore-Output-ScratchFolder-PathContainment
                title: ScratchFolder shall confine every allocated path within the scratch folder and refuse escapes.
                justification: |
                  Output names can originate in hostile document content and must never escape the
                  scratch folder.
                tests:
                  - ScratchFolder_Combine_TraversalOrRootedPath_IsRefused
                  - ScratchFolder_Combine_LegitimateRelativePath_StaysContained
                  - ScratchFolder_Combine_InjectionCharacterInComponent_IsRefused

              - id: DocDownCore-Output-ScratchFolder-RejectsReservedNames
                title: ScratchFolder shall reject reserved device-name components on every platform.
                justification: |
                  Output should remain portable to Windows and should never resolve to device names.
                tests:
                  - ScratchFolder_IsReservedDeviceName_ReservedComponent_ReturnsTrue
                  - ScratchFolder_IsReservedDeviceName_OrdinaryComponent_ReturnsFalse
                  - ScratchFolder_IsReservedDeviceName_OrdinalPrefixedName_IsNotReserved
                  - ScratchFolder_Combine_ReservedDeviceNameComponent_IsRefused

              - id: DocDownCore-Output-ScratchFolder-RejectsOverlongPaths
                title: ScratchFolder shall refuse an allocated path longer than the supported total-path limit.
                justification: |
                  Explicit path-length rejection keeps overlong paths from failing later as opaque
                  filesystem errors.
                tests:
                  - ScratchFolder_ValidateTotalPathLength_OverLimit_ThrowsScratchFolderException
                  - ScratchFolder_Combine_OverLongTotalPath_ThrowsScratchFolderException

              - id: DocDownCore-Output-ScratchFolder-DeterministicNaming
                title: ScratchFolder shall derive deterministic, filesystem-safe slugs from arbitrary input text.
                justification: |
                  Stable slugging keeps output names predictable across runs and platforms.
                tests:
                  - ScratchFolder_Slugify_TrailingDotsAndSpaces_AreRemoved
                  - ScratchFolder_Slugify_AccentedAndPunctuated_ProducesCleanAsciiSlug

              - id: DocDownCore-Output-ScratchFolder-RefusalReported
                title: ScratchFolder shall refuse unsafe reuse or unsafe paths with a stable structured reason.
                justification: |
                  Callers and higher layers need structured refusal reasons to surface what went
                  wrong without guessing.
                tests:
                  - ScratchFolder_Prepare_CleanIfDocDownOnUserFolder_RefusesAndPreservesContents
                  - ScratchFolder_Prepare_EscapingManifestPath_Refuses
