---
# Software Unit Requirements for ImageTextSelector
#
# ImageTextSelector is the shared, format-agnostic policy that ranks the text candidates a
# backend gathers for an image, discards empty and auto-generated names, and reports how
# confidently the chosen text describes the picture so callers can use it honestly.

sections:
  - title: DocDownCore Requirements
    sections:
      - title: Output Requirements
        sections:
          - title: ImageTextSelector Requirements
            requirements:
              - id: DocDownCore-Output-ImageTextSelector-RanksBySource
                title: >-
                  ImageTextSelector shall choose the highest-ranked candidate by source preference and
                  mark an authored source as descriptive.
                justification: |
                  A document may offer several texts about one image, and the most directly descriptive
                  must win regardless of the order the backend gathered them. Ranking by source
                  preference — description, title, caption, object name, heading, media name — and
                  marking an authored source descriptive gives every backend one consistent choice.
                tests:
                  - ImageTextSelector_Select_DescriptionPresent_OutranksWeakerSources
                  - ImageTextSelector_Select_MeaningfulPictureName_IsDescriptive

              - id: DocDownCore-Output-ImageTextSelector-GatesByConfidence
                title: >-
                  ImageTextSelector shall mark a nearby heading as contextual and the media name as a
                  bare fallback rather than descriptive.
                justification: |
                  A heading locates a picture but does not describe it, and the media name describes
                  nothing at all. Marking them contextual and fallback lets a caller use them to name a
                  file yet refuse to assert them as a description, which is the honesty property the
                  whole policy exists to guarantee.
                tests:
                  - ImageTextSelector_Select_OnlyHeadingAndUri_ChoosesHeadingAsContextual
                  - ImageTextSelector_Select_OnlyUri_ChoosesUriAsFallback

              - id: DocDownCore-Output-ImageTextSelector-FiltersAutoGeneratedNames
                title: >-
                  ImageTextSelector shall discard an auto-generated object name so a weaker but honest
                  source is chosen instead.
                justification: |
                  A tool-assigned placeholder such as "Picture 1" is not a description, and presenting
                  it as one would mislead. Discarding a generic name — with or without a trailing number
                  — while keeping a meaningful one lets the policy fall through to an honest source.
                tests:
                  - ImageTextSelector_Select_AutoGeneratedPictureName_FallsThroughToNextSource
                  - ImageTextSelector_IsAutoGeneratedName_GenericNames_ReturnTrue
                  - ImageTextSelector_IsAutoGeneratedName_MeaningfulNames_ReturnFalse

              - id: DocDownCore-Output-ImageTextSelector-IgnoresEmptyText
                title: >-
                  ImageTextSelector shall ignore empty candidate text, trim the chosen text, and return
                  nothing when no candidate is usable.
                justification: |
                  Empty or whitespace-only text says nothing about a picture, and a guessed description
                  is worse than none. Ignoring empty candidates, trimming the winner, and returning
                  nothing when all are empty keeps the result honest and lets the caller fall back
                  deterministically.
                tests:
                  - ImageTextSelector_Select_NoUsableText_ReturnsNull
                  - ImageTextSelector_Select_PaddedText_IsTrimmed

              - id: DocDownCore-Output-ImageTextSelector-NamesProvenance
                title: ImageTextSelector shall project every source to a distinct camelCase provenance name.
                justification: |
                  A backend records where a description came from so a reader can weigh it, and that
                  provenance must be a stable, machine-comparable string. Projecting every source to a
                  distinct camelCase name keeps the recorded provenance consistent across formats.
                tests:
                  - ImageTextSelector_SourceName_EverySource_ProjectsDistinctCamelCase
