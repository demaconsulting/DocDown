---
# Software Unit Requirements for WordOpenXmlExtractor
#
# WordOpenXmlExtractor is the managed backend the engine selects and invokes. It reports
# availability, reads the document, emits the content through the shared emitter, and exposes its
# self-validation cases.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-DeclaresCapabilities
# required capability declaration machinery. It is superseded (not satisfied) by
# DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsManagedAvailability because the backend now
# reports availability through ExtractorAvailability instead of a capability contract.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsStructuralGap
# required merged or nested table cells to be reported as a counted structural gap. It is
# superseded (not satisfied) by DocDownWord-Markdown-WordContentEmitter-ReportsFlattenedTableNote
# because the retained behavior is a short extraction note emitted by the shared reporter.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-ExplainsUnhonoredForcePng
# required force-PNG requests to be reported as counted gaps. It is superseded (not satisfied) by
# DocDownWord-Markdown-WordContentEmitter-ReportsForcePngNote, which is itself now superseded with
# no replacement because the caller-facing PNG request was removed under the simplicity principle.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-SplitsPerPart
# required per-part splitting at each top-level heading when per-part output was requested. It is
# superseded (not satisfied) with no replacement because the caller-facing split choice was removed
# under the simplicity principle; a Word document is one continuous flow and is written as one
# content.md.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsEmptyDocumentGap
# required an empty document to be reported as a gap. It is superseded (not satisfied) by
# DocDownWord-Markdown-WordContentEmitter-ReportsContentInventory because the retained behavior is a
# zero-count looked-for inventory feature.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsPageRenderingGap
# required page-rendering absence to be reported as a gap. It is superseded (not satisfied) by
# DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsManagedAvailability because the remaining behavior
# is the availability report plus the environment fact that page rendering is not provided.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlExtractor-WritesVectorImageWithCaveat
# required a caveat to accompany written vector images. It is superseded (not satisfied) by
# DocDownWord-OpenXml-WordOpenXmlExtractor-WritesVectorImageAsIs because the current behavior is to
# report only what was extracted.

sections:
  - title: DocDownWord Requirements
    sections:
      - title: OpenXml Requirements
        sections:
          - title: WordOpenXmlExtractor Requirements
            requirements:
              - id: DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsSupportedFormatAndPriority
                title: >-
                  WordOpenXmlExtractor shall report the modern Word format as supported and its
                  selection priority.
                justification: |
                  Selection ranks backends before any document is opened. Reporting the supported
                  format and priority truthfully is what makes this backend the chosen reader for
                  `.docx`.
                tests:
                  - WordOpenXmlExtractor_Descriptor_HasPriority10AndManagedAvailability

              - id: DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsManagedAvailability
                title: WordOpenXmlExtractor shall report itself available for extraction.
                justification: |
                  The backend is fully managed and ships inside the package, so its availability probe
                  is satisfied by construction and says so without an unavailable reason.
                tests:
                  - WordOpenXmlExtractor_Descriptor_HasPriority10AndManagedAvailability

              - id: DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsPageRenderingNotProvided
                title: WordOpenXmlExtractor shall report that it does not provide rendered pages.
                justification: |
                  Page rendering is outside this package, so the availability report states plainly
                  that rendered pages are not provided rather than implying work it does not perform.
                tests:
                  - WordOpenXmlExtractor_Descriptor_HasPriority10AndManagedAvailability

              - id: DocDownWord-OpenXml-WordOpenXmlExtractor-WritesVectorImageAsIs
                title: >-
                  WordOpenXmlExtractor shall write an EMF or WMF vector image in the format stored by
                  the document.
                justification: |
                  A vector image part is already the extracted image file. Writing it unchanged
                  preserves what the document carried instead of substituting or dropping it.
                tests:
                  - WordOpenXmlExtractor_Extract_VectorImage_WritesAsIs

              - id: DocDownWord-OpenXml-WordOpenXmlExtractor-ContributesSelfTests
                title: >-
                  WordOpenXmlExtractor shall contribute a round-trip self-test case that reads back its
                  embedded probe document.
                justification: |
                  An operator needs to confirm the backend works where it is deployed. A round-trip
                  case that reads back the embedded probe document proves the SDK is genuinely
                  functional against what Word itself emits.
                tests:
                  - WordOpenXmlExtractor_SelfValidation_ReportsCases

              - id: DocDownWord-OpenXml-WordOpenXmlExtractor-ContributesSkippedPageRenderingSelfTest
                title: >-
                  WordOpenXmlExtractor shall contribute a skipped page-rendering self-test case because
                  this package does not attempt page rendering.
                justification: |
                  A skipped case states the omitted page-rendering scope honestly instead of leaving the
                  gap unmentioned or reporting a false pass.
                tests:
                  - WordOpenXmlExtractor_SelfValidation_ReportsCases
