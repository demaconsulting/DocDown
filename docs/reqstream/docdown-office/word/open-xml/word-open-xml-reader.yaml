---
# Software Unit Requirements for WordOpenXmlReader
#
# WordOpenXmlReader turns the Open XML document into the backend-neutral model: it maps headings,
# lists, tables, fields, comments, footnotes, and Document Control, renders the accepted tracked-
# change view, detects the protected container, and surfaces the document metadata.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlReader-OmitsFurnitureAsDiagnostic
# required page-number-only header or footer content to be surfaced through diagnostic machinery.
# It is superseded (not satisfied) by
# DocDownWord-OpenXml-WordOpenXmlReader-OmitsPageFurnitureFromDocumentControl because the retained
# behavior is omission from the rendered Document Control section without extra reporting.
#
# SUPERSEDED REQUIREMENT: DocDownWord-OpenXml-WordOpenXmlReader-RendersAcceptedRevisions
# required commentary that the accepted tracked-change view was chosen. It is superseded (not
# satisfied) by DocDownWord-OpenXml-WordOpenXmlReader-RendersAcceptedView because the retained
# behavior is the accepted view itself.

sections:
  - title: DocDownWord Requirements
    sections:
      - title: OpenXml Requirements
        sections:
          - title: WordOpenXmlReader Requirements
            requirements:
              - id: DocDownWord-OpenXml-WordOpenXmlReader-ReadsStructuredBlocks
                title: >-
                  WordOpenXmlReader shall map styled paragraphs, lists, and tables into the model's
                  structured blocks.
                justification: |
                  The reader is where a `.docx` becomes the model the rest of the package works on,
                  so it must map heading styles, ordered and bulleted lists, and genuine table grids
                  into blocks the writers can render rather than a flat run of text.
                tests:
                  - WordOpenXmlReader_Read_HeadingsListsAndTables_ProducesStructuredBlocks

              - id: DocDownWord-OpenXml-WordOpenXmlReader-BuildsDocumentControl
                title: >-
                  WordOpenXmlReader shall build a Document Control section from surviving header and
                  footer content.
                justification: |
                  A document's identifying control text often lives in headers and footers. Building
                  the Document Control section from the surviving content is what surfaces that
                  information near the top of the extracted document.
                tests:
                  - WordOpenXmlReader_Read_HeaderWithRevisionAndClassification_ProducesDocumentControlSection

              - id: DocDownWord-OpenXml-WordOpenXmlReader-OmitsPageFurnitureFromDocumentControl
                title: >-
                  WordOpenXmlReader shall omit a header or footer carrying only page-numbering fields
                  from the rendered Document Control content.
                justification: |
                  A page-number-only header or footer adds no reusable document content to a
                  single-flow extraction. Omitting it from the rendered Document Control section
                  keeps the extracted content focused on document control text rather than repeated
                  page furniture.
                tests:
                  - WordOpenXmlReader_Read_FooterWithOnlyPageNumberFields_OmitsAsFurniture

              - id: DocDownWord-OpenXml-WordOpenXmlReader-DeduplicatesHeaders
                title: WordOpenXmlReader shall emit an identical header shared across sections only once.
                justification: |
                  The same header repeated across multiple sections is one piece of control content,
                  not many. Deduplicating identical headers keeps Document Control concise rather than
                  repetitive.
                tests:
                  - WordOpenXmlReader_Read_IdenticalHeaderAcrossSections_EmittedOnce

              - id: DocDownWord-OpenXml-WordOpenXmlReader-RendersAcceptedView
                title: WordOpenXmlReader shall render tracked changes in the accepted view.
                justification: |
                  A document under revision still needs one coherent extracted text flow. Keeping
                  insertions and dropping deletions yields that accepted-view reading.
                tests:
                  - WordOpenXmlReader_Read_TrackedChanges_RendersAcceptedViewWithDiagnostic

              - id: DocDownWord-OpenXml-WordOpenXmlReader-DetectsPasswordProtected
                title: >-
                  WordOpenXmlReader shall detect an encrypted document by its container signature and
                  raise `WordExtractionException`.
                justification: |
                  An encrypted `.docx` is an OLE compound file, not a Zip package, and cannot be
                  opened by the normal path. Detecting that signature up front lets the backend name
                  the condition clearly.
                tests:
                  - WordOpenXmlReader_Read_PasswordProtected_ThrowsWordExtractionException

              - id: DocDownWord-OpenXml-WordOpenXmlReader-CollectsComments
                title: WordOpenXmlReader shall collect a comment's author and text.
                justification: |
                  A comment is reviewer-authored content, and both its author and its text matter.
                  Collecting both is what lets the writer render a faithful Comments section and lets
                  the content inventory count distinct comment authors.
                tests:
                  - WordOpenXmlReader_Read_Comment_CollectsAuthorAndText

              - id: DocDownWord-OpenXml-WordOpenXmlReader-SurfacesMetadata
                title: >-
                  WordOpenXmlReader shall surface the document's declared title and author, and
                  nothing where the document declares nothing.
                justification: |
                  Metadata drives downstream routing, and a blank value is a different claim from an
                  absent one. Surfacing the declared title and author, and leaving a blank value
                  unstated, keeps those decisions on facts.
                tests:
                  - WordOpenXmlReader_Read_Metadata_TitleAndAuthorSurfaced

              - id: DocDownWord-OpenXml-WordOpenXmlReader-ReportsProducerPageCount
                title: >-
                  WordOpenXmlReader shall report the producer-stated page count from the document's
                  extended properties, and none where it is absent.
                justification: |
                  A Word document does not paginate itself during extraction, so a computed page
                  count would be fabricated. Reporting only the producer's own extended-properties
                  value keeps the page count honest.
                tests:
                  - WordOpenXmlReader_Read_ProducerPageCount_FromExtendedProperties

              - id: DocDownWord-OpenXml-WordOpenXmlReader-ReusesDeduplicatedImagePath
                title: >-
                  WordOpenXmlReader shall reuse a single written path for an image that appears in
                  both a header and the body.
                justification: |
                  A logo that appears in the header and the body is one image, and writing it twice
                  would waste space and imply two figures. Reusing the deduplicated path keeps one
                  image one file and one link target.
                tests:
                  - WordOpenXmlReader_Read_HeaderWithLogo_ReusesDeduplicatedImagePath

              - id: DocDownWord-OpenXml-WordOpenXmlReader-SelectsImageText
                title: >-
                  WordOpenXmlReader shall choose an image's naming and description text from authored
                  descriptions, titles, and object names, ignoring the auto-generated drawing name.
                justification: |
                  An image is far more useful when its file name and alt text describe it, so the
                  reader gathers the authored description, drawing title, and picture object name and
                  hands them to the shared policy. It never reads the auto-generated `wp:docPr/@name`,
                  which is a placeholder rather than a description.
                tests:
                  - WordOpenXmlReader_Read_ImageWithDescription_UsesDescriptionForNameAltAndManifest
                  - WordOpenXmlReader_Read_ImageWithTitleOnly_UsesTitleAsDescriptive
                  - WordOpenXmlReader_Read_ImageWithObjectName_UsesPictureNameNotDocPrName

              - id: DocDownWord-OpenXml-WordOpenXmlReader-ReadsCaptionStructurally
                title: >-
                  WordOpenXmlReader shall read an adjacent caption's text, including its SEQ field
                  number, through the field-aware walker.
                justification: |
                  A figure caption describes its image and carries a SEQ-numbered label. Reading the
                  adjacent Caption-styled paragraph through the same field-aware walk the body uses
                  surfaces the number structurally rather than by matching digits in rendered text.
                tests:
                  - WordOpenXmlReader_Read_ImageWithCaption_ReadsSeqNumberStructurally

              - id: DocDownWord-OpenXml-WordOpenXmlReader-HeadingNamesButNeutralAlt
                title: >-
                  WordOpenXmlReader shall let a nearby heading name an image and record it in the
                  manifest with its source, but shall not assert the heading as the image's alt text.
                justification: |
                  A section heading locates a picture but does not describe it. The reader may use
                  the heading to seed the file name and record it honestly in the manifest, yet it
                  leaves the alt text neutral so the extraction does not claim the document gave a
                  description it never gave.
                tests:
                  - WordOpenXmlReader_Read_ImageWithOnlyHeading_NamesFromHeadingButKeepsNeutralAlt
                  - WordOpenXmlReader_Read_ImageWithNoSources_FallsBackToMediaNameWithoutDescription
