---
# Software Subsystem Requirements for DocDownWord OpenXml
#
# The OpenXml subsystem is the managed backend: the extractor the engine selects, the reader that
# turns the Open XML DOM into the backend-neutral model, and the image reader that yields each
# embedded image's bytes and provenance.

sections:
  - title: DocDownWord Requirements
    sections:
      - title: OpenXml Requirements
        requirements:
          - id: DocDownWord-OpenXml-Extraction
            title: >-
              The subsystem shall orchestrate a managed `.docx` extraction, report its availability,
              and emit content through the shared pipeline.
            justification: |
              The extractor is the backend the engine selects and invokes, so it owns the managed
              extraction path: availability, environment facts, document buffering, reader
              invocation, split handling, and self-validation.
            children:
              - DocDownWord-OpenXml-WordOpenXmlExtractor-ReportsManagedAvailability
              - DocDownWord-OpenXml-WordOpenXmlExtractor-WritesVectorImageAsIs
              - DocDownWord-OpenXml-WordOpenXmlExtractor-ContributesSelfTests
            tests:
              - WordOpenXmlExtractor_Descriptor_HasPriority10AndManagedAvailability

          - id: DocDownWord-OpenXml-Reading
            title: >-
              The subsystem shall read the Open XML document into the backend-neutral model, mapping
              structure and detecting the conditions the model must record.
            justification: |
              The reader is where a `.docx` becomes the model the rest of the package works on, so
              it maps headings, lists, tables, fields, comments, footnotes, and Document Control,
              renders the accepted tracked-change view, detects the protected container, and
              surfaces the document metadata.
            children:
              - DocDownWord-OpenXml-WordOpenXmlReader-ReadsStructuredBlocks
              - DocDownWord-OpenXml-WordOpenXmlReader-BuildsDocumentControl
              - DocDownWord-OpenXml-WordOpenXmlReader-OmitsPageFurnitureFromDocumentControl
              - DocDownWord-OpenXml-WordOpenXmlReader-DeduplicatesHeaders
              - DocDownWord-OpenXml-WordOpenXmlReader-RendersAcceptedView
              - DocDownWord-OpenXml-WordOpenXmlReader-DetectsPasswordProtected
              - DocDownWord-OpenXml-WordOpenXmlReader-CollectsComments
              - DocDownWord-OpenXml-WordOpenXmlReader-SurfacesMetadata
              - DocDownWord-OpenXml-WordOpenXmlReader-ReportsProducerPageCount
              - DocDownWord-OpenXml-WordOpenXmlReader-ReusesDeduplicatedImagePath
              - DocDownWord-OpenXml-WordOpenXmlReader-SelectsImageText
              - DocDownWord-OpenXml-WordOpenXmlReader-ReadsCaptionStructurally
              - DocDownWord-OpenXml-WordOpenXmlReader-HeadingNamesButNeutralAlt
            tests:
              - WordOpenXmlReader_Read_HeadingsListsAndTables_ProducesStructuredBlocks

          - id: DocDownWord-OpenXml-Images
            title: >-
              The subsystem shall yield each embedded image's bytes with a passthrough transform and
              an honest media type.
            justification: |
              An Open XML image part is a complete image file, so the image reader passes its bytes
              through unchanged, leaves pixel dimensions unstated when only a display extent is
              available, and reports the part's own media type.
            children:
              - DocDownWord-OpenXml-WordOpenXmlImageReader-YieldsPassthroughImages
              - DocDownWord-OpenXml-WordOpenXmlImageReader-RecordsPassthroughProvenance
              - DocDownWord-OpenXml-WordOpenXmlImageReader-ReportsVectorMediaType
            tests:
              - WordOpenXmlImageReader_Read_Png_YieldsPassthroughWithNullDimensions
