---
# Software Unit Requirements for PowerPointOpenXmlExtractor
#
# PowerPointOpenXmlExtractor is the managed backend the engine selects for a content extraction. It
# exposes the selection surface the engine sees, probes unconditionally, records the environment facts,
# buffers and opens the deck, hands the stream to PowerPointOpenXmlReader, delegates emission to
# PowerPointContentEmitter, and contributes the self-tests that describe its own behavior.
#
# SUPERSEDED REQUIREMENT: DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-DeclaresCapabilities
# required the managed backend to declare a capability set. That requirement is superseded (not
# satisfied) by DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-DescribesSelectionSurface,
# because selection now turns on supported format, priority, page-rendering applicability, and the
# availability result rather than a capability set.

sections:
  - title: DocDownPowerPoint Requirements
    sections:
      - title: OpenXml Requirements
        sections:
          - title: PowerPointOpenXmlExtractor Requirements
            requirements:
              - id: DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-DescribesSelectionSurface
                title: >-
                  PowerPointOpenXmlExtractor shall identify itself as the managed `.pptx` backend,
                  keep the higher selection priority, and remain applicable to rendering requests even
                  though it does not provide rendered pages.
                justification: |
                  Selection ranks backends before any deck is opened. Exposing the stable backend
                  identity, supported format, higher priority, and rendering applicability is what
                  makes this managed backend the chosen reader for default content extraction while
                  still letting the engine consider it when a `.pptx` extraction request mentions
                  page rendering.
                tests:
                  - PowerPointOpenXmlExtractor_Descriptor_MatchesContract

              - id: DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-ReportsPageRenderingNotProvided
                title: >-
                  PowerPointOpenXmlExtractor shall report itself available and shall state, through
                  both availability and an environment fact, that this extractor does not provide
                  rendered pages.
                justification: |
                  Rasterizing a slide needs a renderer this package's managed backend deliberately
                  does not ship, so the probe reports available without rendered-page support and the
                  extraction records that page rendering is not provided here. That keeps the boundary
                  explicit rather than discovering it as a missing pages folder.
                tests:
                  - PowerPointOpenXmlExtractor_ProbeAvailability_AlwaysAvailable
                  - DocDownPowerPoint_Extract_Pptx_SelectsOpenXml

              - id: DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-ProbesUnconditionally
                title: >-
                  PowerPointOpenXmlExtractor shall answer the availability probe unconditionally,
                  performing no I/O.
                justification: |
                  Nothing about this backend is environment-dependent — no native binary and no
                  external application — so there is nothing to probe: the Open XML SDK is a managed
                  assembly that ships inside the package, and the probe reports available everywhere
                  the package loads.
                tests:
                  - PowerPointOpenXmlExtractor_ProbeAvailability_AlwaysAvailable

              - id: DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-OrchestratesExtraction
                title: >-
                  PowerPointOpenXmlExtractor shall record its environment facts, buffer and open the
                  deck, read it into the model, delegate emission to the shared emitter, and return a
                  produced outcome when the extraction completes.
                justification: |
                  The extractor owns orchestration: it records what parsed the deck and that this
                  extractor does not render, buffers the source because a stream is not guaranteed
                  seekable, hands the reader a seekable stream, and writes no bytes itself because the
                  sink is the only output channel.
                tests:
                  - DocDownPowerPoint_Extract_Pptx_SelectsOpenXml

              - id: DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-ContributesSelfTests
                title: >-
                  PowerPointOpenXmlExtractor shall contribute self-test cases, including an honest
                  skip for slide rendering.
                justification: |
                  An operator needs to confirm the backend works where it is deployed. A round-trip
                  case that reads back the embedded probe deck proves the SDK is genuinely functional
                  against what PowerPoint itself emits, and a
                  skipped page-rendering case keeps a behavior the managed backend does not provide
                  from being reported as a pass or a failure.
                tests:
                  - PowerPointOpenXmlExtractor_SelfTestCases_RoundTripPassesAndRenderingSkipped
