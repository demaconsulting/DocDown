---
# Software Unit Requirements for PowerPointDocDownBuilderExtensions
#
# PowerPointDocDownBuilderExtensions is the one visible edge from a host to this package: the explicit,
# reflection-free call that adds the PowerPoint backend to a DocDown builder. It is a direct unit of
# the DemaConsulting.DocDown.PowerPoint system.
#
# SUPERSEDED REQUIREMENT: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-OrdersManagedAboveCom
# required the managed backend to register at a higher selection priority than a COM automation
# backend. That requirement is superseded (not satisfied) because this package no longer registers a
# COM backend at all — there is nothing left to outrank.

sections:
  - title: DocDownPowerPoint Requirements
    sections:
      - title: PowerPointDocDownBuilderExtensions Requirements
        requirements:
          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-RegistersManagedBackend
            title: >-
              PowerPointDocDownBuilderExtensions shall add the managed Open XML backend to the builder
              it is called on.
            justification: |
              A host that asks for PowerPoint support wants a deck's content handled deterministically
              on every platform. Adding the managed backend as a deferred factory from a single call is
              what gives the resulting engine that reach: the managed backend is the guaranteed content
              path, with no platform-specific dependency.
            tests:
              - AddPowerPoint_RegistersOpenXmlBackend

          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-ReturnsBuilderForChaining
            title: PowerPointDocDownBuilderExtensions shall return the builder it was called on.
            justification: |
              A host that registers several backends should be able to express that as one readable
              configuration sequence rather than as a series of disconnected statements.
            tests:
              - AddPowerPoint_ReturnsSameBuilder

          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-RejectsNullBuilder
            title: PowerPointDocDownBuilderExtensions shall reject a missing builder at the point of the call.
            justification: |
              Failing where the mistake was made names the offending call site. Deferring the failure to
              build time would report it against configuration the host wrote correctly.
            tests:
              - AddPowerPoint_NullBuilder_Throws
