---
# Software Unit Requirements for PowerPointDocDownBuilderExtensions
#
# PowerPointDocDownBuilderExtensions is the one visible edge from a host to this package: the explicit,
# reflection-free call that adds the PowerPoint backends to a DocDown builder. It is a direct unit of
# the DocDown.PowerPoint system.

sections:
  - title: DocDownPowerPoint Requirements
    sections:
      - title: PowerPointDocDownBuilderExtensions Requirements
        requirements:
          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-RegistersBothBackends
            title: >-
              PowerPointDocDownBuilderExtensions shall add both the managed Open XML backend and the COM
              automation backend to the builder it is called on.
            justification: |
              A host that asks for PowerPoint support wants a deck's content handled deterministically on
              every platform and its slides rendered where Microsoft PowerPoint is present. Adding both
              backends as deferred factories from a single call is what gives the resulting engine that
              reach: the managed backend is the guaranteed content path, and the COM backend adds the
              render when the environment can supply it.
            tests:
              - AddPowerPoint_RegistersOpenXmlAndComBackends

          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-OrdersManagedAboveCom
            title: >-
              PowerPointDocDownBuilderExtensions shall register the managed backend at a higher selection
              priority than the COM backend.
            justification: |
              Talking to Microsoft PowerPoint is expensive and environment-dependent, so it must be
              reached only when rendering is actually requested. Giving the managed backend the higher
              priority is what makes it the chosen reader for every extraction that does not ask for
              rendered pages, leaving the COM backend selected only when its rendering is the reason to
              pay that cost.
            tests:
              - AddPowerPoint_ManagedBackend_HasHigherPriorityThanCom

          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-ReturnsBuilderForChaining
            title: PowerPointDocDownBuilderExtensions shall return the builder it was called on.
            justification: |
              A host that registers several backends should be able to express that as one readable
              configuration sequence rather than as a series of disconnected statements.
            tests:
              - AddPowerPoint_ReturnsSameBuilder

          - id: DocDownPowerPoint-PowerPointDocDownBuilderExtensions-RejectsNullBuilder
            title: PowerPointDocDownBuilderExtensions shall reject a missing builder at the point of the call.
            justification: |
              Failing where the mistake was made names the offending call site. Deferring the failure to
              build time would report it against configuration the host wrote correctly.
            tests:
              - AddPowerPoint_NullBuilder_Throws
