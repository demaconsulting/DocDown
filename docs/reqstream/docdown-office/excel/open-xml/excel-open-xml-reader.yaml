---
# Software Unit Requirements for ExcelOpenXmlReader
#
# ExcelOpenXmlReader is the one place that touches the Open XML spreadsheet object model. It walks
# each worksheet in workbook order, resolves shared strings, keeps only cells that carry a value or a
# formula, and never truncates a value.

sections:
  - title: DocDownExcel Requirements
    sections:
      - title: OpenXml Requirements
        sections:
          - title: ExcelOpenXmlReader Requirements
            requirements:
              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-PreservesVerbatimValues
                title: >-
                  ExcelOpenXmlReader shall preserve a cell's text value verbatim at full length, never
                  truncating a long prose block.
                justification: |
                  A cell holding a page of pasted prose must survive intact, because losing length is
                  exactly the failure the Excel intent forbids. Shared-string and inline-string cells
                  resolve to their complete text, with rich-text runs concatenated into the whole value.
                tests:
                  - ExcelOpenXmlReader_Read_LongProseCell_PreservedVerbatimAtFullLength

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-ReadsNumericValuesVerbatim
                title: >-
                  ExcelOpenXmlReader shall read a numeric or other typed cell value exactly as stored, at
                  full precision.
                justification: |
                  A number, date serial, or error is taken exactly as stored so no precision is lost to a
                  reformat; substituting a formatted rendering for the stored value would lose the exact
                  quantity the workbook exists to carry.
                tests:
                  - ExcelOpenXmlReader_Read_NumericCells_ReadVerbatim

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-KeepsFormulaAndValue
                title: >-
                  ExcelOpenXmlReader shall keep a computed cell's formula alongside its cached value and
                  its address.
                justification: |
                  The formula states the engineering relationship and the value states one evaluation of
                  it, so both are retained on the cell model — the formula without its leading equals, the
                  value verbatim, and the A1 address — so a fact stays both readable and citable.
                tests:
                  - ExcelOpenXmlReader_Read_FormulaCell_KeepsFormulaAndValueAndAddress

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-PreservesSheetIdentity
                title: >-
                  ExcelOpenXmlReader shall return the worksheets in workbook order, each carrying the
                  name shown on its tab.
                justification: |
                  A worksheet's tab name is the citable identity of a sheet, and the workbook order is the
                  order a reader sees, so the reader carries both — a fact extracted from a sheet can be
                  traced back to the sheet that holds it.
                tests:
                  - ExcelOpenXmlReader_Read_TwoSheetWorkbook_ReturnsSheetsInOrderWithNames

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-DropsEmptyCells
                title: >-
                  ExcelOpenXmlReader shall keep only cells that carry a value or a formula, yielding a
                  worksheet with no cells when none do.
                justification: |
                  A cell with neither a value nor a formula contributes nothing, so a sparse sheet yields
                  only its real content and a genuinely empty sheet yields a sheet with no cells rather
                  than a grid of blanks the emitter would have to strip.
                tests:
                  - ExcelOpenXmlReader_Read_EmptySheet_YieldsSheetWithNoCells

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-ReadsLegacyComments
                title: >-
                  ExcelOpenXmlReader shall read each worksheet's legacy cell comments, resolving each
                  comment's author through the comments part's own author list.
                justification: |
                  A legacy comment is the only form a workbook authored before threaded comments can
                  carry, and it names its author only by index into a list the part itself holds, so the
                  list is resolved first. An index naming no author yields no attribution rather than a
                  guess, because inventing a reviewer's name is worse than stating none.
                tests:
                  - ExcelOpenXmlReader_Read_LegacyCommentWorkbook_ReadsCommentWithAuthor

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-ReadsThreadedComments
                title: >-
                  ExcelOpenXmlReader shall read each worksheet's modern threaded comments, resolving
                  each comment's author through the workbook's person list.
                justification: |
                  A threaded comment carries only a person identifier, and the display names live once in
                  the workbook's person part, so the names are loaded up front and each comment resolves
                  through them. A reply order is preserved because a conversation read out of order
                  misstates who answered whom, and an identifier the person list does not name yields no
                  attribution rather than a raw identifier that would read as a name without being one.
                tests:
                  - ExcelOpenXmlReader_Read_ThreadedCommentWorkbook_ReadsCommentWithResolvedPerson

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-DeduplicatesThreadedAndLegacyComments
                title: >-
                  ExcelOpenXmlReader shall report a cell carrying both a threaded comment and a legacy
                  comment once, keeping the threaded comment and suppressing the legacy entry.
                justification: |
                  A spreadsheet application writing a threaded comment also writes a legacy entry beside
                  it so older readers still see something on the cell, so reporting both would show the
                  same remark twice and read as two reviewers raising the same point. The threaded
                  comment is kept because it is the authored one and the legacy entry is the
                  backward-compatibility stand-in. The rule is positional rather than textual — a legacy
                  comment is kept only where no threaded comment exists for that cell reference — because
                  the placeholder wording varies by application version and locale and matching it would
                  be guessing.
                tests:
                  - ExcelOpenXmlReader_Read_ThreadedAndLegacyOnSameCell_KeepsOnlyThreadedComment

              - id: DocDownExcel-OpenXml-ExcelOpenXmlReader-AttributesCommentsToSheet
                title: >-
                  ExcelOpenXmlReader shall record each comment against the worksheet that carries it and
                  the cell it annotates, and yield no comments for a workbook that has none.
                justification: |
                  A remark is only actionable if a reader can take it back to the cell it was made about,
                  so the sheet and the A1 cell reference travel with the comment. A workbook with no
                  comment parts yields no comments rather than an error, because having nothing to say is
                  the ordinary case and not a fault.
                tests:
                  - ExcelOpenXmlReader_Read_MultiSheetCommentWorkbook_AttributesCommentsToOwningSheet
                  - ExcelOpenXmlReader_Read_WorkbookWithoutComments_YieldsNoComments
