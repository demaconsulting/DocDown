---
# Software Unit Requirements for ExcelOpenXmlExtractor
#
# ExcelOpenXmlExtractor is the managed backend the engine selects and invokes. It identifies the
# supported workbook surface, reports page rendering not applicable, probes unconditionally, reads
# the workbook, emits the content through the shared emitter, and contributes the self-tests that
# describe its own behavior.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-DeclaresCapabilities
# DocDownExcel-OpenXml-ExcelOpenXmlExtractor-DeclaresCapabilities described the extractor surface in
# terms of capabilities. The Excel reporting contract no longer models capabilities. The supported
# surface is now described through the extractor's identity, supported format, priority, and page-
# rendering flag. The requirement is superseded (not satisfied) by
# DocDownExcel-OpenXml-ExcelOpenXmlExtractor-ReportsSupportedSurface.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-DeclaresPageRenderingNotApplicable
# DocDownExcel-OpenXml-ExcelOpenXmlExtractor-DeclaresPageRenderingNotApplicable tied the
# non-applicability of page rendering to a removed capability declaration. The retained behavior is
# that the extractor reports `PageRenderingApplicable = false` for a non-paginated workbook. The
# requirement is superseded (not satisfied) by
# DocDownExcel-OpenXml-ExcelOpenXmlExtractor-ReportsPageRenderingNotApplicable.

sections:
  - title: DocDownExcel Requirements
    sections:
      - title: OpenXml Requirements
        sections:
          - title: ExcelOpenXmlExtractor Requirements
            requirements:
              - id: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-ReportsSupportedSurface
                title: >-
                  ExcelOpenXmlExtractor shall identify itself as the managed `.xlsx` extractor with the
                  higher selection priority.
                justification: |
                  Selection chooses among registered extractors before any workbook is opened. The
                  extractor therefore publishes a stable identity, supported format, display name, and
                  priority that let the engine pick the intended backend deterministically.
                tests:
                  - ExcelOpenXmlExtractor_Descriptor_MatchesContract

              - id: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-ReportsPageRenderingNotApplicable
                title: >-
                  ExcelOpenXmlExtractor shall report page rendering not applicable to a non-paginated
                  workbook.
                justification: |
                  A workbook has no page grid to rasterize, so a page-rendering request applies to
                  nothing. Reporting that fact at the extractor surface lets the engine honor a
                  spreadsheet page request with silence rather than pretending additional work remains.
                tests:
                  - ExcelOpenXmlExtractor_Descriptor_MatchesContract

              - id: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-ProbesUnconditionally
                title: >-
                  ExcelOpenXmlExtractor shall answer the availability probe unconditionally, performing
                  no I/O.
                justification: |
                  Nothing about this backend is environment-dependent — no native binary and no external
                  application — so there is nothing to probe: the Open XML SDK is a managed assembly
                  that ships inside the package, and the probe reports available everywhere the package
                  loads.
                tests:
                  - ExcelOpenXmlExtractor_ProbeAvailability_AlwaysAvailable

              - id: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-OrchestratesExtraction
                title: >-
                  ExcelOpenXmlExtractor shall record its environment facts, buffer and open the
                  workbook, read it into the model, delegate emission to the shared emitter, and return
                  `Produced` for a readable workbook.
                justification: |
                  The extractor owns orchestration: it records what parsed the workbook and that a
                  workbook is non-paginated, buffers the source because a stream is not guaranteed
                  seekable, hands the reader a seekable stream, and delegates all extracted content to
                  the shared emitter while keeping the sink as the only output channel.
                tests:
                  - DocDownExcel_Extract_Xlsx_SelectsOpenXml

              - id: DocDownExcel-OpenXml-ExcelOpenXmlExtractor-ContributesSelfTests
                title: >-
                  ExcelOpenXmlExtractor shall contribute self-test cases, including a skipped
                  page-rendering case for the non-paginated workbook surface.
                justification: |
                  An operator needs to confirm the backend works where it is deployed. A round-trip case
                  that builds and reads a workbook proves the SDK is genuinely functional, and a skipped
                  page-rendering case keeps a non-applicable request from being reported as a pass or a
                  failure.
                tests:
                  - ExcelOpenXmlExtractor_SelfTestCases_RoundTripPassesAndRenderingSkipped
