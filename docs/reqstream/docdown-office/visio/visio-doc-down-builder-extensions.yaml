---
# Software Unit Requirements for VisioDocDownBuilderExtensions
#
# SUPERSEDED REQUIREMENT: DocDownVisio-VisioDocDownBuilderExtensions-RegistersBothBackends
# required this unit to add both the managed Open Packaging backend and a COM automation backend.
# That requirement is superseded (not satisfied) by
# DocDownVisio-VisioDocDownBuilderExtensions-RegistersManagedBackend, because this unit now
# registers only the managed backend; rendered page images are a separate, opt-in concern
# registered through DemaConsulting.DocDown.Visio.Rendering's own `AddVisioRendering`.
#
# SUPERSEDED REQUIREMENT: DocDownVisio-VisioDocDownBuilderExtensions-OrdersManagedAboveCom
# required this unit to register the managed backend at a higher selection priority than a COM
# backend it also registered. That requirement is superseded (not satisfied) with no replacement
# here, because this unit registers only one backend now, so no priority ordering between two
# backends registered by the same call applies.
#
# VisioDocDownBuilderExtensions is the one visible edge from a host to this package: the explicit,
# reflection-free call that adds the managed Visio backend to a DocDown builder. It is a direct
# unit of the DemaConsulting.DocDown.Visio system.

sections:
  - title: DocDownVisio Requirements
    sections:
      - title: VisioDocDownBuilderExtensions Requirements
        requirements:
          - id: DocDownVisio-VisioDocDownBuilderExtensions-RegistersManagedBackend
            title: >-
              VisioDocDownBuilderExtensions shall add the managed Open Packaging backend to the
              builder it is called on, and only that backend.
            justification: |
              A host that asks for Visio support wants a drawing's page names, shape text, and
              directed topology handled deterministically on every platform. Adding the managed
              backend as a deferred factory from a single call is what gives the resulting engine
              that reach; rendered page images are a separate, opt-in concern a host registers
              explicitly through DemaConsulting.DocDown.Visio.Rendering's own `AddVisioRendering`.
            tests:
              - AddVisio_RegistersOpenXmlBackend

          - id: DocDownVisio-VisioDocDownBuilderExtensions-ReturnsBuilderForChaining
            title: VisioDocDownBuilderExtensions shall return the builder it was called on.
            justification: |
              A host that registers several backends should be able to express that as one readable
              configuration sequence — `AddVisio().AddVisioRendering()` — rather than as a series of
              disconnected statements.
            tests:
              - AddVisio_ReturnsSameBuilder

          - id: DocDownVisio-VisioDocDownBuilderExtensions-RejectsNullBuilder
            title: VisioDocDownBuilderExtensions shall reject a missing builder at the point of the call.
            justification: |
              Failing where the mistake was made names the offending call site. Deferring the failure to
              build time would report it against configuration the host wrote correctly.
            tests:
              - AddVisio_NullBuilder_Throws
