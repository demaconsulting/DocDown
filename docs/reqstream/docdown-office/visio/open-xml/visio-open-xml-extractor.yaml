---
# Software Unit Requirements for VisioOpenXmlExtractor
#
# SUPERSEDED REQUIREMENT: DocDownVisio-OpenXml-VisioOpenXmlExtractor-DeclaresCapabilities
# described the retired capability-set selection model. Selection no longer negotiates over that
# set. The observable selection behavior is now captured by
# DocDownVisio-OpenXml-VisioOpenXmlExtractor-ParticipatesInSelection.
#
# SUPERSEDED REQUIREMENT:
# DocDownVisio-OpenXml-VisioOpenXmlExtractor-DeclaresPageRenderingNotProvided required the managed
# backend to describe rendering through a capability declaration. Rendering support is now conveyed
# only through ProbeAvailability(): the managed backend reports Available() and therefore does not
# claim rendered-page support in the current environment. That behavior is captured by
# DocDownVisio-OpenXml-VisioOpenXmlExtractor-ProbesUnconditionally.
#
# VisioOpenXmlExtractor is the managed backend the engine selects for content extraction. It
# identifies the modern Visio drawings it can read, probes available everywhere the package can
# load, records the environment facts for the managed path, reads the drawing into the shared
# model, delegates emission to the shared emitter, and contributes self-tests that describe its own
# behavior.

sections:
  - title: DocDownVisio Requirements
    sections:
      - title: OpenXml Requirements
        sections:
          - title: VisioOpenXmlExtractor Requirements
            requirements:
              - id: DocDownVisio-OpenXml-VisioOpenXmlExtractor-ParticipatesInSelection
                title: >-
                  VisioOpenXmlExtractor shall identify itself as the higher-priority backend for
                  `.vsdx` and `.vsdm` drawings, with page rendering marked as a meaningful request
                  for this document family.
                justification: |
                  Backend selection first needs to know which drawings a backend can read and how it
                  should rank against companions that handle the same format. The managed backend is
                  the ordinary default for modern Visio drawings, so it identifies `.vsdx` and
                  `.vsdm` and carries the higher priority, while leaving page rendering applicable at
                  the format level because a companion backend can render pages for the same
                  drawings.
                tests:
                  - VisioOpenXmlExtractor_Descriptor_MatchesContract

              - id: DocDownVisio-OpenXml-VisioOpenXmlExtractor-ProbesUnconditionally
                title: >-
                  VisioOpenXmlExtractor shall answer the availability probe as available everywhere
                  it runs, without reporting rendered-page support and without performing I/O.
                justification: |
                  Nothing about this backend depends on the host environment beyond the .NET runtime:
                  it uses managed packaging APIs and no external application. The probe therefore
                  reports Available() on every platform the package can load, performs no I/O, and
                  leaves rendered-page support false so the renderer decision stays with the COM
                  backend.
                tests:
                  - VisioOpenXmlExtractor_ProbeAvailability_AlwaysAvailable

              - id: DocDownVisio-OpenXml-VisioOpenXmlExtractor-OrchestratesExtraction
                title: >-
                  VisioOpenXmlExtractor shall record the managed-path environment facts, buffer and
                  open the drawing, read it into the shared model, delegate emission to the shared
                  emitter, and return `Produced` on normal completion.
                justification: |
                  The managed backend owns orchestration for ordinary Visio extraction. It records
                  what parsed the drawing and that rendering is not provided by this extractor,
                  buffers the source because the package reader must seek, hands the reader a
                  seekable stream, and routes every emitted artifact through the shared sink. Normal
                  completion writes the standard layout and is therefore reported as Produced.
                tests:
                  - DocDownVisio_Extract_Vsdx_SelectsOpenXml

              - id: DocDownVisio-OpenXml-VisioOpenXmlExtractor-ContributesSelfTests
                title: >-
                  VisioOpenXmlExtractor shall contribute self-test cases covering a topology
                  round-trip and the managed backend's non-rendering role.
                justification: |
                  Operators need to confirm the managed backend works where it is deployed. A
                  round-trip case that builds a drawing with a directed edge and reads it back proves
                  the topology path is genuinely functional, and the page-rendering case reports a
                  skip with a reason so the managed backend's role is described honestly rather than
                  implied by absence.
                tests:
                  - VisioOpenXmlExtractor_SelfTestCases_RoundTripPassesAndRenderingSkipped
