---
# System-Level Platform Requirements for DemaConsulting.DocDown.Visio
#
# These requirements specify the platforms and frameworks the package must support. DemaConsulting.DocDown.Visio's
# managed Open Packaging backend is 100% managed and runtime-identifier agnostic, so its platform
# evidence is the end-to-end extraction test, which selects the managed backend and produces the full
# output contract and so passes on every runtime the package targets. Rendered page images are a
# separate, opt-in concern delivered entirely by the DemaConsulting.DocDown.Visio.Rendering package,
# which carries its own platform requirements and never gates this package's platform proof.
#
# Test links can include a source filter prefix (e.g. "windows@", "ubuntu@", "net8.0@") to restrict
# which test results count as evidence for a requirement. This is critical for platform and framework
# requirements - removing these filters invalidates the evidence-based proof.
#
# Source filter prefixes:
#   windows@TestName  - proves the test passed on a Windows platform
#   ubuntu@TestName   - proves the test passed on a Linux (Ubuntu) platform
#   macos@TestName    - proves the test passed on a macOS platform
#   net8.0@TestName   - proves the test passed under the .NET 8 runtime
#   net9.0@TestName   - proves the test passed under the .NET 9 runtime
#   net10.0@TestName  - proves the test passed under the .NET 10 runtime
#   net11.0@TestName  - proves the test passed under the .NET 11 runtime

sections:
  - title: DocDownVisio Requirements
    requirements:
      - id: DocDownVisio-Platform-Windows
        title: The package shall build and extract on Windows platforms.
        tags: [system]
        justification: |
          Windows is a major DEMA Consulting development platform, and the managed Open Packaging backend
          must read a drawing and produce the full output contract there.
        tests:
          - "windows@DocDownVisio_Extract_Vsdx_SelectsOpenXml"

      - id: DocDownVisio-Platform-Linux
        title: The package shall build and extract on Linux platforms.
        tags: [system]
        justification: |
          Linux is the primary CI/CD and container target, and the managed Open Packaging backend must
          read a drawing and produce the full output contract there with no Visio installation present.
        tests:
          - "ubuntu@DocDownVisio_Extract_Vsdx_SelectsOpenXml"

      - id: DocDownVisio-Platform-MacOS
        title: The package shall build and extract on macOS platforms.
        tags: [system]
        justification: |
          macOS support serves developers on Apple platforms, and the managed Open Packaging backend must
          read a drawing and produce the full output contract there.
        tests:
          - "macos@DocDownVisio_Extract_Vsdx_SelectsOpenXml"

      - id: DocDownVisio-Platform-Net8
        title: The package shall support the .NET 8 runtime.
        tags: [system]
        justification: |
          .NET 8 is a Long-Term Support (LTS) release that reached end of support in November 2026.
          The package continues to support this runtime so that library consumers who have not yet
          migrated to a newer release, such as enterprise environments with slow upgrade cycles, can
          keep using it.
        tests:
          - "net8.0@DocDownVisio_Extract_Vsdx_SelectsOpenXml"

      - id: DocDownVisio-Platform-Net9
        title: The package shall support the .NET 9 runtime.
        tags: [system]
        justification: |
          .NET 9 is a Standard-Term Support (STS) release that has reached end of support. The
          package continues to support this runtime so that library consumers who have not yet
          migrated to a newer release can keep using it.
        tests:
          - "net9.0@DocDownVisio_Extract_Vsdx_SelectsOpenXml"

      - id: DocDownVisio-Platform-Net10
        title: The package shall support the .NET 10 runtime.
        tags: [system]
        justification: |
          .NET 10 is the current Long-Term Support (LTS) release. Supporting this runtime provides a
          stable, long-term supported target for library consumers who prefer LTS releases.
        tests:
          - "net10.0@DocDownVisio_Extract_Vsdx_SelectsOpenXml"

      - id: DocDownVisio-Platform-Net11
        title: The package shall support the .NET 11 runtime.
        tags: [system]
        justification: |
          .NET 11 is the latest release in the .NET platform roadmap. Supporting this runtime
          ensures the package works for library consumers as they adopt the newest .NET version.
        tests:
          - "net11.0@DocDownVisio_Extract_Vsdx_SelectsOpenXml"
