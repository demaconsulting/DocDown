---
# Software Subsystem Requirements for DemaConsulting.DocDown.PowerPoint
#
# These requirements describe the externally visible behavior of the PowerPoint extraction subsystem
# from the perspective of a host that registers it, without specifying implementation details. Each
# decomposes into subsystem and unit requirements linked below via children, and is proven by
# subsystem-level tests or the closest package-level evidence available in
# DemaConsulting.DocDown.Office.Tests. DemaConsulting.DocDown.PowerPoint has two child subsystems (Markdown, OpenXml)
# and one direct unit (PowerPointDocDownBuilderExtensions).
#
# A slide is a visual composition, but a deck also carries content that no render can supply. These
# requirements describe a single obligation: always extract, from the file itself, the slide text,
# the slide title where one exists, the speaker notes, the slide order, the embedded images, and the
# document metadata. Reporting follows the governing principle for this subsystem: DocDown reports what
# it extracted and where it wrote it. The content inventory states what was looked for, including
# counted zeros, and a short plain note is used only when DocDown attempted a step and could not
# complete it.
#
# Earlier requirements about counted gaps, charts, vector-image caveats, declared capability sets, and
# this subsystem's own slide rendering were retired (see version control history); rendering is now
# governed by docs/reqstream/docdown-powerpoint-rendering.yaml.

sections:
  - title: DocDownPowerPoint Requirements
    requirements:
      - id: DocDownPowerPoint-Registration
        title: >-
          The subsystem shall register its PowerPoint backend through an explicit extension method
          without reflection or assembly scanning.
        tags: [system]
        justification: |
          A host must be able to read its own dependency graph off its own code. Registration that
          happens because a package is present on disk makes the set of active backends a deployment
          accident rather than a decision, which cannot be audited; one explicit call keeps the edge
          from host to backend visible and reviewable. PowerPoint registers one backend — the managed
          Open XML content backend — so the single call must add it without hiding it.
        children:
          - DocDownPowerPoint-PowerPointDocDownBuilderExtensions-RegistersManagedBackend
          - DocDownPowerPoint-PowerPointDocDownBuilderExtensions-ReturnsBuilderForChaining
          - DocDownPowerPoint-PowerPointDocDownBuilderExtensions-RejectsNullBuilder
        tests:
          - AddPowerPoint_RegistersOpenXmlBackend

      - id: DocDownPowerPoint-BackendSelectionSurface
        title: >-
          The subsystem shall expose backend selection through explicit backend identities, supported
          formats, stable priorities, page-rendering applicability, and availability results that
          state whether rendered pages are provided.
        tags: [system]
        justification: |
          Backend selection is a control-plane decision that must be readable before any document is
          opened. The host needs to see which PowerPoint backend exists, which format it supports,
          whether page rendering is relevant to the backend at all, and whether the currently
          available backend will actually provide rendered pages. These facts replace the removed
          capability-set negotiation and keep selection honest up front.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-DescribesSelectionSurface
        tests:
          - AddPowerPoint_RegistersOpenXmlBackend
          - PowerPointOpenXmlExtractor_Descriptor_MatchesContract

      - id: DocDownPowerPoint-Extraction
        title: >-
          The subsystem shall extract each slide of a deck as content — its title, text, speaker
          notes, and reviewer comments — along with its images and metadata, into the DocDown output
          contract.
        tags: [system]
        justification: |
          The subsystem exists to turn a deck into the invariant DocDown output layout so a downstream
          agent sees the same artifact structure it sees for every other format. A deck carries
          content that never appears in any render, so extracting each slide's text, title, and
          speaker notes from the file itself — rather than relying on a picture of the slide — is
          what makes the deck's content recoverable on any machine and in CI.
        children:
          - DocDownPowerPoint-OpenXml-Extraction
          - DocDownPowerPoint-OpenXml-Reading
          - DocDownPowerPoint-Markdown-ModelEmission
        tests:
          - DocDownPowerPoint_Extract_Pptx_SelectsOpenXml

      - id: DocDownPowerPoint-SlideText
        title: >-
          The subsystem shall extract the text of every slide, including text held in tables, grouped
          shapes, and SmartArt diagrams.
        tags: [system]
        justification: |
          The words on a slide are its assertions, and they are recoverable from the file with no
          rendering. A backend that captured only a picture of each slide would leave that text
          unsearchable and impossible to cite, so the text of every slide is extracted from the file
          itself as the guaranteed outcome that no environment can take away. Text is not confined to
          plain shapes: tables, grouped shapes, and SmartArt diagrams carry assertions too, and a
          reader that walked only plain shapes would drop them without saying so.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ExtractsBodyText
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ReadsTableText
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ReadsGroupedShapeText
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ReadsSmartArtText
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ReadsBreakAndFieldText
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesSlideText
        tests:
          - PowerPointOpenXmlReader_Read_Slide_ExtractsBodyTextLines
          - PowerPointOpenXmlReader_Read_DeckWithTable_ReadsRowsAsLines
          - PowerPointOpenXmlReader_Read_DeckWithGroupedShapes_ReadsNestedGroupText
          - PowerPointOpenXmlReader_Read_DeckWithSmartArt_ReadsNodeText

      - id: DocDownPowerPoint-SlideTitle
        title: The subsystem shall extract each slide's title where one exists.
        tags: [system]
        justification: |
          A slide's title names what the slide is about, and a reader navigates and cites a deck by
          those titles. Separating the title placeholder from the body text keeps the title available
          as the heading it is, and a slide that carries no title is left without a fabricated one.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ExtractsTitle
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesTitle
        tests:
          - PowerPointContentEmitter_Emit_WritesTitleBodyAndNotes

      - id: DocDownPowerPoint-SpeakerNotes
        title: The subsystem shall always extract the speaker notes attached to each slide.
        tags: [system]
        justification: |
          Speaker notes hold the narration, the caveats, and the argument the slide only gestures at,
          and they are invisible to any renderer. They are the clearest case of content that never
          appears in any render, so they must be recovered from the file itself on every extraction,
          independent of whether rendering is possible.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ExtractsSpeakerNotes
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesNotes
        tests:
          - DocDownPowerPoint_Extract_DeckWithNotes_ExtractsSpeakerNotes

      - id: DocDownPowerPoint-SpeakerNotesAbsenceInventory
        title: >-
          The subsystem shall state the number of slides carrying speaker notes in the content
          inventory, including a count of zero, so a reader can tell a deck that has no notes apart
          from notes that were not looked for.
        tags: [system]
        justification: |
          Speaker notes are half the deck's content and no render can supply them, so a reader must be
          able to tell "this deck carries no speaker notes" from "speaker notes are not something
          DocDown counts." That distinction is a fact about the deck, and the inventory is where
          facts about the document belong: the notes count is reported whether or not any notes exist,
          and a notes-less deck stays a clean success.
        children:
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsSpeakerNotesAbsenceInInventory
        tests:
          - PowerPointContentEmitter_Emit_NoNotes_ReportsZeroNotesFeatureWithoutNote
          - DocDownPowerPoint_Extract_DeckWithoutNotes_ReportsZeroNotesInSummaryAndManifest

      - id: DocDownPowerPoint-SlideOrder
        title: The subsystem shall preserve the slides in presentation order.
        tags: [system]
        justification: |
          A deck's argument is sequential: the order the presenter chose is part of the meaning, and
          a set of slides shuffled into document-part order is a different argument. Walking the
          slide-id list rather than the package parts is what keeps the extracted slides in the order
          the deck declares, so the sequence the author built survives extraction.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-PreservesSlideOrder
        tests:
          - PowerPointOpenXmlReader_Read_DeckWithNotes_ReturnsSlidesInOrder

      - id: DocDownPowerPoint-PageRendering
        title: >-
          The subsystem's own backend shall never render a slide to an image itself, and shall always
          state plainly that rendered pages are not provided.
        tags: [system]
        justification: |
          What a slide means is largely how it looks, but this subsystem's content path is the
          guaranteed, deterministic read of a deck's file-level content and never opens an external
          application. Rendered slide images are a separate, opt-in concern delivered entirely by the
          DocDownPowerPoint.Rendering package; this subsystem's own backend states plainly, on every
          extraction, that it provides no rendered pages rather than ever fabricating one.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-ReportsPageRenderingNotProvided
        tests:
          - PowerPointOpenXmlExtractor_Descriptor_MatchesContract

      - id: DocDownPowerPoint-EmbeddedImages
        title: >-
          The subsystem shall write a deck's embedded images into the images folder, link them from the
          slide that shows them, and record which slide each belongs to.
        tags: [system]
        justification: |
          A slide can paste a photograph or a diagram, and a text-only extraction discards it
          silently. Writing the images out, linking them inline under the slide section, and
          recording the slide association keeps a consumer's view of the deck complete and keeps an
          image citable back to the slide it appears on.
        children:
          - DocDownPowerPoint-OpenXml-Images
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-LinksImages
        tests:
          - DocDownPowerPoint_Extract_DeckWithImage_WritesEmbeddedImage

      - id: DocDownPowerPoint-VectorImagePassthrough
        title: >-
          The subsystem shall write an EMF or WMF embedded image unchanged as extracted content, with
          no PowerPoint-specific note.
        tags: [system]
        justification: |
          A vector metafile's stored bytes are already the extracted image file, so writing them
          through loses nothing the deck carried. Because the extraction completed exactly what the
          deck supplied, this subsystem records no additional PowerPoint-specific note for that case.
        children:
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesVectorImagesWithoutNote
        tests:
          - DocDownPowerPoint_Extract_DeckWithVectorImage_Succeeds

      - id: DocDownPowerPoint-EmptyDeckInventory
        title: >-
          The subsystem shall describe a deck with no slides by writing empty content and zero-count
          inventory entries for the looked-for document structure.
        tags: [system]
        justification: |
          A deck with no slides is still a document state the caller needs to see clearly. Writing an
          empty content file and reporting zero slides and zero speaker-note sets makes that state
          explicit without turning ordinary document content into a statement about extraction quality.
        children:
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsEmptyDeckInInventory
        tests:
          - PowerPointContentEmitter_Emit_EmptyDeck_WritesEmptyContentAndZeroInventory

      - id: DocDownPowerPoint-ContentOutline
        title: >-
          The subsystem shall report an outline of what the content contains — slides, slide titles,
          sets of speaker notes, inline images, comments, and distinct comment authors — counted from
          the model.
        tags: [system]
        justification: |
          A character count says nothing about whether the deck's speaker notes — the half no
          rendered slide image can supply — are present in the text, nor how many slides carry a
          title worth navigating by, nor whether reviewers left commentary. Counting each content
          kind from the model the reader built gives a reader an honest shape of the deck before
          reading a single slide.
        children:
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsContentFeatures
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-InventoriesComments
        tests:
          - PowerPointContentEmitter_Emit_Deck_ReportsContentFeaturesIncludingSpeakerNotes
          - DocDownPowerPoint_Extract_DeckWithNotes_ReportsSpeakerNotesInventory
          - DocDownPowerPoint_Extract_DeckWithComment_WritesReviewComments

      - id: DocDownPowerPoint-ReviewComments
        title: >-
          The subsystem shall extract each slide's legacy reviewer comments, with their resolved
          authors, into the review-comments artifact qualified by slide number, and keep them out of
          the slide text.
        tags: [system]
        justification: |
          A reviewer's remark is commentary about the deck rather than part of it, and in a draft it
          is often the most valuable content while being the least visible from a rendered slide.
          Reporting each comment with its author and the slide it was made on lets a reader act on
          it, and keeping it out of the slide text stops a consumer mistaking a reviewer's words for
          the author's.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ReadsSlideComments
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ResolvesCommentAuthors
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsReviewComments
        tests:
          - DocDownPowerPoint_Extract_DeckWithComment_WritesReviewComments

      - id: DocDownPowerPoint-ModernCommentsNote
        title: >-
          The subsystem shall state in an extraction note the number of modern persona-based comments
          it does not read and the number of slides carrying them, and shall record no note for a deck
          without them.
        tags: [system]
        justification: |
          Modern comments are not read, because resolving their authors could not be validated. A deck
          whose comments are all modern would otherwise read as a deck nobody commented on, which
          states something untrue about the document. Counting them and saying so in the output makes
          the boundary visible to whoever holds the output, so an absence caused by the extractor is
          reported rather than rendered as an absence in the document.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-ExcludesModernPersonaComments
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlReader-CountsModernPersonaComments
          - DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsModernCommentsNote
        tests:
          - DocDownPowerPoint_Extract_DeckWithModernComments_ReportsUnreadCommentsNote

      - id: DocDownPowerPoint-LegacyFormatRefusal
        title: >-
          The subsystem shall refuse a legacy binary PowerPoint deck with an unreadable result carrying
          a plain explanation, and without an exception reaching the caller.
        tags: [system]
        justification: |
          This subsystem reads Open XML presentations and nothing else, and DocDown does not support the
          legacy binary formats at all. A caller who hands the engine a `.ppt` therefore deserves a
          plain statement of that fact with the full output layout still written — not an exception,
          and not an instruction pointing at an environment that cannot deliver the capability.
        tests:
          - DocDownPowerPoint_Extract_LegacyPpt_FailsWithUnsupportedFormatExplanation

      - id: DocDownPowerPoint-SelfValidation
        title: The subsystem shall contribute self-validation cases describing its own extraction behavior.
        tags: [system]
        justification: |
          An operator needs to confirm the backends actually work where they are deployed, not merely
          that they are present. The managed backend contributes a parse round-trip case and an honest
          skip for slide rendering, so that confirmation is available on demand where the deployment
          runs the self-test tool.
        children:
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-ContributesSelfTests
          - DocDownPowerPoint-OpenXml-PowerPointOpenXmlExtractor-ExplainsRenderingSkip
        tests:
          - PowerPointOpenXmlExtractor_SelfTestCases_RoundTripPassesAndRenderingSkipped
