---
# Software Unit Requirements for PowerPointContentEmitter
#
# PowerPointContentEmitter is the single emission path: it writes a read deck model's per-slide content
# — title, body text, and speaker notes — plus its inline images, its content outline, and any plain
# notes the model and options imply, through the sink.
#
# SUPERSEDED REQUIREMENT: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsSpeakerNotesAbsenceGap
# required the whole-deck absence of speaker notes to be reported as a counted gap with a reason. It
# was authored as a statement of intent before the repository owner established the governing
# principle that DocDown reports what was extracted and where and makes no acceptability judgement
# about the content — a shortfall report must describe what DocDown could not do, never what the
# document does not contain. A notes-less deck cost the extraction nothing, so the requirement is
# superseded (not satisfied) by
# DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsSpeakerNotesAbsenceInInventory, which
# places the same distinction in the content inventory as a counted zero.
#
# SUPERSEDED REQUIREMENT: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsVectorImageCaveat
# required an informational note for EMF or WMF images. That requirement is superseded (not
# satisfied) by DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesVectorImagesWithoutNote,
# because the image bytes are written as found and the completed extraction records no
# PowerPoint-specific note.
#
# SUPERSEDED REQUIREMENT: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsChartsNotExtracted
# required separate reporting for charts this backend does not read. That requirement is superseded
# (not satisfied) with no replacement, because chart-specific reporting was removed from this system.
#
# SUPERSEDED REQUIREMENT: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsEmptyDeckGap
# required a deck with no slides to be classified as an extraction shortfall. That requirement is
# superseded (not satisfied) by
# DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsEmptyDeckInInventory, because an empty
# deck is now described by empty content and zero-count inventory entries.

sections:
  - title: DocDownPowerPoint Requirements
    sections:
      - title: Markdown Requirements
        sections:
          - title: PowerPointContentEmitter Requirements
            requirements:
              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesTitle
                title: >-
                  PowerPointContentEmitter shall write each slide's title as its heading, and use a
                  neutral slide heading when the slide has none.
                justification: |
                  A reader navigates a deck by its slide titles, so each slide's title becomes the
                  heading of its section; a title-less slide is given a neutral ordinal heading rather
                  than a fabricated title, so the reader can still find the slide without being misled
                  about what it is called.
                tests:
                  - PowerPointContentEmitter_Emit_WritesTitleBodyAndNotes

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesSlideText
                title: PowerPointContentEmitter shall write each slide's body text under its slide heading.
                justification: |
                  The words on a slide are its assertions, recoverable from the file with no render, so
                  the emitter writes each slide's body lines under the slide's heading, keeping the text
                  searchable and citable independent of whether the slide was ever rendered.
                tests:
                  - PowerPointContentEmitter_Emit_WritesTitleBodyAndNotes

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesNotes
                title: >-
                  PowerPointContentEmitter shall write each slide's speaker notes under its slide,
                  marked as speaker notes.
                justification: |
                  Speaker notes are the half of a deck no render can supply, so the emitter writes
                  them into the content under their slide, marked as notes so a reader can tell the
                  narration apart from the slide's own text.
                tests:
                  - PowerPointContentEmitter_Emit_WritesTitleBodyAndNotes

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsSpeakerNotesAbsenceInInventory
                title: >-
                  PowerPointContentEmitter shall report the count of slides carrying speaker notes in
                  the content inventory, including a count of zero, and shall record no note for a
                  deck that carries none.
                justification: |
                  Speaker notes are half the deck's content and no render can supply them, so a reader
                  must be able to tell "this deck carries no speaker notes" from "speaker notes are not
                  something DocDown counts." Reporting the count whether or not any notes exist keeps
                  that distinction available to a consuming agent from the inventory alone.
                tests:
                  - PowerPointContentEmitter_Emit_NoNotes_ReportsZeroNotesFeatureWithoutNote
                  - PowerPointContentEmitter_Emit_NotesPresent_ReportsSpeakerNotesFeature

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-LinksImages
                title: >-
                  PowerPointContentEmitter shall write a deck's embedded images through the sink and
                  link each from the slide that shows it only when a path was returned.
                justification: |
                  A slide's pictures are linked inline at their point of occurrence, mirroring the
                  Word convention, and a link is emitted only when the sink returned a path so a
                  suppressed or otherwise unwritten image never leaves a link pointing at nothing.
                tests:
                  - PowerPointContentEmitter_Emit_WithRasterImages_WritesThroughSink
                  - PowerPointContentEmitter_Emit_SlideImage_LinksInlineFromContent
                  - PowerPointContentEmitter_Emit_ImagesSuppressed_NoDanglingLink
                  - PowerPointContentEmitter_Emit_ImagesDisabled_WritesNone

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesVectorImagesWithoutNote
                title: >-
                  PowerPointContentEmitter shall write an EMF or WMF embedded image unchanged and
                  shall record no PowerPoint-specific note for that completed image write.
                justification: |
                  A vector metafile's bytes are already the extracted image file, so writing them
                  through loses nothing the deck carried. Because the extraction completed exactly what
                  the deck supplied, the emitter records no additional PowerPoint-specific note.
                tests:
                  - PowerPointContentEmitter_Emit_VectorImage_WritesWithoutNote

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsEmptyDeckInInventory
                title: >-
                  PowerPointContentEmitter shall write empty content and zero-count inventory entries
                  when the deck has no slides.
                justification: |
                  A deck with no slides is still a document state the caller needs to see clearly.
                  Writing empty content and reporting zero slides and zero speaker-note sets makes that
                  state explicit without turning ordinary document content into a statement about the
                  extraction.
                tests:
                  - PowerPointContentEmitter_Emit_EmptyDeck_WritesEmptyContentAndZeroInventory

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-ReportsContentFeatures
                title: >-
                  PowerPointContentEmitter shall report a content outline counting the model's slides,
                  slide titles, sets of speaker notes, and inline images.
                justification: |
                  A character count does not tell a paste-in reader that the deck's speaker notes —
                  the half no rendered slide image can supply — are present in the text, nor how many
                  slides carry a title worth navigating by. The counts come from the model the reader
                  built and from the image paths the sink actually allocated.
                tests:
                  - PowerPointContentEmitter_Emit_Deck_ReportsContentFeaturesIncludingSpeakerNotes
                  - PowerPointContentEmitter_Emit_NoImages_ReportsZeroInlineImagesWithoutNote

              - id: DocDownPowerPoint-Markdown-PowerPointContentEmitter-WritesSingleFlow
                title: >-
                  PowerPointContentEmitter shall write the deck as one content flow whose inline
                  image links resolve on disk.
                justification: |
                  A deck reads as one narrative and every slide carries its own heading in the flow,
                  so a reader finds a slide in content.md without opening a file per slide; the
                  links the flow carries must resolve from the scratch root where it is written.
                tests:
                  - PowerPointContentEmitter_Emit_ImageLinks_ResolveOnDisk
