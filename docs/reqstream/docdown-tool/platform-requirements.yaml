---
# System-Level Platform Requirements for DocDown.Tool
#
# These requirements specify the platforms and frameworks the tool must support.
#
# Test links can include a source filter prefix (e.g. "windows@", "ubuntu@", "net8.0@") to restrict
# which test results count as evidence for a requirement. This is critical for platform and framework
# requirements - removing these filters invalidates the evidence-based proof.
#
# Source filter prefixes:
#   windows@TestName  - proves the test passed on a Windows platform
#   ubuntu@TestName   - proves the test passed on a Linux (Ubuntu) platform
#   macos@TestName    - proves the test passed on a macOS platform
#   net8.0@TestName   - proves the test passed under the .NET 8 runtime
#   net9.0@TestName   - proves the test passed under the .NET 9 runtime
#   net10.0@TestName  - proves the test passed under the .NET 10 runtime

sections:
  - title: DocDownTool Requirements
    requirements:
      - id: DocDownTool-Platform-Windows
        title: The tool shall build and run on Windows platforms.
        tags: [system]
        justification: |
          DEMA Consulting tools must support Windows as a major development platform.
        tests:
          - "windows@DocDownTool_Extract_GeneratedPdf_PrintsAbsoluteSummaryPathAndExitsZero"

      - id: DocDownTool-Platform-Linux
        title: The tool shall build and run on Linux platforms.
        tags: [system]
        justification: |
          DEMA Consulting tools must support Linux for CI/CD and containerized environments.
        tests:
          - "ubuntu@DocDownTool_Extract_GeneratedPdf_PrintsAbsoluteSummaryPathAndExitsZero"

      - id: DocDownTool-Platform-MacOS
        title: The tool shall build and run on macOS platforms.
        tags: [system]
        justification: |
          DEMA Consulting tools must support macOS for developers using Apple platforms.
        tests:
          - "macos@DocDownTool_Extract_GeneratedPdf_PrintsAbsoluteSummaryPathAndExitsZero"

      - id: DocDownTool-Platform-Net10
        title: The tool shall support the .NET 10 runtime.
        tags: [system]
        justification: |
          .NET 10 is the runtime the tool is packaged for, and the only one it claims. A .NET tool is
          executed rather than referenced, so it needs exactly one framework; multi-targeting it
          duplicated the PDF rasterizer's native binaries once per framework and made the download
          many times larger than the code it delivered. The .NET 8 and .NET 9 requirements that stood
          here were removed with that change rather than left as claims no evidence could support:
          the tool's test project targets net10.0 alone, so no net8.0- or net9.0-filtered result can
          exist. The libraries continue to require and prove all three runtimes - see the
          DocDownCore platform requirements - so a library consumer is unaffected by the tool's
          choice.
        tests:
          - "net10.0@DocDownTool_Extract_GeneratedPdf_PrintsAbsoluteSummaryPathAndExitsZero"
