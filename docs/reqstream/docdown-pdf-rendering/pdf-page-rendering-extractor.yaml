---
# Software Unit Requirements for PdfPageRenderingExtractor
#
# PdfPageRenderingExtractor is the superset backend: it is unconditionally available with
# rendered-page support, delegates the managed aspects to the base PDF backend, rasterizes
# the requested pages, and reports every per-page failure as a plain note.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PdfPageRenderingExtractor-DeclaresCapabilities required the
# extractor to declare a four-capability superset. It is superseded (not satisfied)
# by DocDownPdfRendering-PdfPageRenderingExtractor-ReportsUnconditionalAvailability
# because the extractor now reports only whether it is available here and whether it
# provides rendered pages here; it no longer negotiates a capability set.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PdfPageRenderingExtractor-IsolatesPageFailures required
# per-page faults to become a counted gap. It is superseded (not satisfied) by
# DocDownPdfRendering-PdfPageRenderingExtractor-ReportsPageFailuresAsNotes because
# this unit now records only the factual note that a page could not be rasterized
# and still returns Produced.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PdfPageRenderingExtractor-ProbeIsCheapAndSafe required a cheap,
# non-throwing probe that could still report unavailable. It is superseded (not
# satisfied) by DocDownPdfRendering-PdfPageRenderingExtractor-ReportsUnconditionalAvailability
# because CanvasNet.Pdf is fully managed and the extractor's availability no longer
# depends on an environment probe at all; it always reports available.

sections:
  - title: DocDownPdfRendering Requirements
    sections:
      - title: PdfPageRenderingExtractor Requirements
        requirements:
          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ReportsUnconditionalAvailability
            title: >-
              PdfPageRenderingExtractor shall unconditionally report itself available with
              rendered-page support.
            justification: |
              CanvasNet.Pdf is fully managed and carries no runtime-identifier-specific asset, so there
              is no environment in which this backend cannot rasterize. Reporting availability
              unconditionally, rather than through a probe that could report otherwise, is what lets
              Core choose this backend without an environment-dependent guess.
            tests:
              - PdfPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReportsUnconditionallyAvailable

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-DelegatesManagedAspects
            title: >-
              PdfPageRenderingExtractor shall obtain text, embedded images, and document metadata by
              delegating to the managed PDF backend with rendering suppressed.
            justification: |
              Re-implementing the managed aspects would duplicate faithful, well-tested behavior and
              risk divergence. Delegating with rendering suppressed reuses one source of truth and
              keeps this unit focused on rasterization alone.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-WritesRenderedPages
            title: >-
              PdfPageRenderingExtractor shall write a valid PNG image for each rendered page through
              the sink.
            justification: |
              The rendered page is the artifact this package adds. Writing it through the sink, named
              by its document page number, is what makes the mapping from output file to source page
              unambiguous and the image a real, decodable PNG.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs
              - DocDownPdfRendering_Render_GeneratedPdf_ProducesValidPngPages

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ReportsPageFailuresAsNotes
            title: >-
              PdfPageRenderingExtractor shall report a per-page rasterization failure as the plain note
              `Page N could not be rasterized.`, continue with the remaining pages, and not throw to
              the caller.
            justification: |
              One unrenderable page must not abort a whole extraction or reach the caller as an
              exception. Catching each page's fault, naming the page in a short factual note, and
              continuing is what keeps the run honest and alive without adding any extra judgement.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_PageRenderFaults_ReportsNoteWithoutThrowing

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ReportsEmptySelectionAsNote
            title: >-
              PdfPageRenderingExtractor shall report the plain note "Page rendering was requested and
              a renderer was available, but no pages were produced." itself whenever page rendering
              was requested and no page was selected to render.
            justification: |
              Core cannot distinguish this backend's own empty-outcome explanation from an unrelated
              note the delegated managed backend may already have recorded during the earlier,
              separate extraction phase (for example, an embedded-image fault), so it no longer
              attempts to infer or suppress a generic note on this backend's behalf. Recording the
              note from the backend's own selected-page count, which is immune to any unrelated note
              recorded elsewhere, is what keeps the empty-pages outcome explained exactly once without
              relying on sink history.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_PageRangeSelectsNoPage_ReportsEmptyPagesNote

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ContributesSelfTests
            title: >-
              PdfPageRenderingExtractor shall contribute a render round-trip self-test case named
              distinctly from the managed backend's cases, which passes in every environment.
            justification: |
              An operator needs to confirm rendering genuinely works wherever DocDown is deployed. A
              distinctly named case that renders the embedded document and always passes — because
              CanvasNet.Pdf carries no environment-dependent failure mode — provides that confirmation
              without colliding with the managed backend's own case names.
            tests:
              - PdfPageRenderingExtractor_GetSelfTestCases_AnyEnvironment_PassesRenderCase
