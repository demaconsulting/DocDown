---
# Software Unit Requirements for PdfPageRenderingExtractor
#
# PdfPageRenderingExtractor is the superset backend: it probes the native stack cheaply,
# reports rendered-page support only when that stack is usable, delegates the managed
# aspects to the base PDF backend, rasterizes the requested pages, and reports every
# per-page failure as a plain note.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PdfPageRenderingExtractor-DeclaresCapabilities required the
# extractor to declare a four-capability superset. It is superseded (not satisfied)
# by DocDownPdfRendering-PdfPageRenderingExtractor-ReportsRenderedPagesAvailability
# because the extractor now reports only whether it is available here and whether it
# provides rendered pages here; it no longer negotiates a capability set.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PdfPageRenderingExtractor-IsolatesPageFailures required
# per-page faults to become a counted gap. It is superseded (not satisfied) by
# DocDownPdfRendering-PdfPageRenderingExtractor-ReportsPageFailuresAsNotes because
# this unit now records only the factual note that a page could not be rasterized
# and still returns Produced.

sections:
  - title: DocDownPdfRendering Requirements
    sections:
      - title: PdfPageRenderingExtractor Requirements
        requirements:
          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ProbeIsCheapAndSafe
            title: >-
              PdfPageRenderingExtractor shall report availability from a cheap, non-throwing probe that
              does not rasterize.
            justification: |
              The probe is consulted on every engine build, including for plain extractions. It must
              answer whether the native stack can load without paying rasterization cost or throwing,
              so a plain extraction is never taxed by rendered-page work it did not request.
            tests:
              - PdfPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReflectsNativeStackWithoutThrowing

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ReportsRenderedPagesAvailability
            title: >-
              PdfPageRenderingExtractor shall report rendered-page support only when the native
              rasterizer is usable in the current environment, and otherwise shall report itself
              unavailable with a reason.
            justification: |
              Selection needs to know whether this backend can actually produce rendered pages here,
              not whether it could in some other deployment. Reporting rendered-page support only for
              the usable environment, and otherwise carrying a reason, is what lets Core choose
              honestly before any document is opened.
            tests:
              - PdfPageRenderingExtractor_ProbeAvailability_AnyEnvironment_ReflectsNativeStackWithoutThrowing

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-DelegatesManagedAspects
            title: >-
              PdfPageRenderingExtractor shall obtain text, embedded images, and document metadata by
              delegating to the managed PDF backend with rendering suppressed.
            justification: |
              Re-implementing the managed aspects would duplicate faithful, well-tested behavior and
              risk divergence. Delegating with rendering suppressed reuses one source of truth and
              keeps this unit focused on rasterization alone.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-WritesRenderedPages
            title: >-
              PdfPageRenderingExtractor shall write a valid PNG image for each rendered page through
              the sink.
            justification: |
              The rendered page is the artifact this package adds. Writing it through the sink, named
              by its document page number, is what makes the mapping from output file to source page
              unambiguous and the image a real, decodable PNG.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_RenderRequested_WritesPagePngs
              - DocDownPdfRendering_Render_GeneratedPdf_ProducesValidPngPages

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ReportsPageFailuresAsNotes
            title: >-
              PdfPageRenderingExtractor shall report a per-page rasterization failure as the plain note
              `Page N could not be rasterized.`, continue with the remaining pages, and not throw to
              the caller.
            justification: |
              One unrenderable page must not abort a whole extraction or reach the caller as an
              exception. Catching each page's fault, naming the page in a short factual note, and
              continuing is what keeps the run honest and alive without adding any extra judgement.
            tests:
              - PdfPageRenderingExtractor_ExtractAsync_PageRenderFaults_ReportsNoteWithoutThrowing

          - id: DocDownPdfRendering-PdfPageRenderingExtractor-ContributesSelfTests
            title: >-
              PdfPageRenderingExtractor shall contribute a render round-trip self-test case named
              distinctly from the managed backend's cases.
            justification: |
              An operator needs to confirm the native stack genuinely rasterizes where it is installed.
              A distinctly named case that renders the embedded document provides that
              confirmation without colliding with the managed backend's own case names.
            tests:
              - PdfPageRenderingExtractor_GetSelfTestCases_AnyEnvironment_ReportsHonestRenderCaseStatus
