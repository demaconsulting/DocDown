---
# Software Unit Requirements for PageRenderer
#
# PageRenderer is the single rasterization seam: it opens a CanvasNet.Pdf document per call,
# rasterizes one page to a PNG, and reads the page count, with no instance or shared mutable
# state between calls.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PageRenderer-ProbeCheapAndNonThrowing required a cheap, non-throwing
# question about whether the native stack can load for the current runtime identifier. It is
# superseded (removed, not replaced) because CanvasNet.Pdf is fully managed and carries no
# runtime-identifier-specific asset, so there is nothing for this unit to probe.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PageRenderer-ReportsUnavailableWithReason required a non-empty reason on
# an unavailable probe result. It is superseded (removed, not replaced) for the same reason:
# there is no unavailable outcome to carry a reason.
#
# SUPERSEDED REQUIREMENT:
# DocDownPdfRendering-PageRenderer-SerializesNativeCalls required every native rasterization
# call to be serialized process-wide behind a lock, because PDFium was not thread-safe. It is
# superseded (not satisfied) by DocDownPdfRendering-PageRenderer-ConcurrentCallsDoNotInterfere
# because this unit now opens an independent `PdfDocument` per call with no field or static
# mutable state, so concurrent calls do not share anything a lock would need to protect;
# CanvasNet's own thread-safety is not documented either way, and the accepted residual risk
# (CanvasNet's lazy-initialized system font catalog) is recorded in the system design document
# rather than mitigated by a lock here.

sections:
  - title: DocDownPdfRendering Requirements
    sections:
      - title: PageRenderer Requirements
        requirements:
          - id: DocDownPdfRendering-PageRenderer-RendersPageToPng
            title: PageRenderer shall rasterize one page of a PDF to valid PNG bytes at a requested DPI.
            justification: |
              This unit is the only place CanvasNet.Pdf is called, so the promise that a page becomes
              a real, decodable PNG at the requested resolution lives here. Everything upstream
              depends on this producing genuine image bytes rather than an opaque buffer.
            tests:
              - PageRenderer_Render_SinglePage_ReturnsValidPng

          - id: DocDownPdfRendering-PageRenderer-GetsPageCount
            title: PageRenderer shall report the number of pages in a PDF document.
            justification: |
              The extractor needs the page count to honor a requested page range without rasterizing
              pages outside it, and this unit is the one place that opens the document, so it is the
              natural place to answer the question.
            tests:
              - PageRenderer_GetPageCount_MultiPageDocument_ReturnsPageCount

          - id: DocDownPdfRendering-PageRenderer-ConcurrentCallsDoNotInterfere
            title: PageRenderer shall produce correct output when called concurrently from multiple threads.
            justification: |
              Several pages, possibly from different documents, can be rendered in the same run. Each
              call opens its own `PdfDocument` and `Surface` with no shared mutable state in this unit,
              so concurrent calls must all succeed without corrupting one another's output.
            tests:
              - PageRenderer_Render_ConcurrentCalls_AllProduceValidPng

          - id: DocDownPdfRendering-PageRenderer-RejectsNullDocument
            title: PageRenderer shall reject a missing document at the point of the call.
            justification: |
              Failing where the mistake was made names the offending caller. A null document is a
              programming error, not a render fault, so it is rejected up front rather than carried
              into the rasterization call.
            tests:
              - PageRenderer_Render_NullPdf_Throws
              - PageRenderer_GetPageCount_NullPdf_Throws
