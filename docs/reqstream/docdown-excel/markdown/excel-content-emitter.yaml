---
# Software Unit Requirements for ExcelContentEmitter
#
# ExcelContentEmitter is the single emission path: it writes the workbook model's worksheet parts and
# chart parts, the grid tables and verbatim listings, the shape annotations, the images, the content
# inventory, and the short notes about attempted steps that could not complete through the sink, so
# every output the model implies is produced in one place.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-Markdown-ExcelContentEmitter-ReportsChartGaps
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsChartGaps required counted reporting for unreadable,
# uncached, and bounded charts. Under the current reporting rule, only an unreadable chart records a
# note because the attempted read did not complete; a chart with no cached data or a bounded table is
# stated in its chart part. The requirement is superseded (not satisfied) by
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsAttemptNotes and DocDownExcel-Markdown-ChartRendering.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-Markdown-ExcelContentEmitter-ReportsVectorImageCaveat
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsVectorImageCaveat required a dedicated note for a
# successfully written vector image. The current reporting rule records no note when the write
# succeeded. The requirement is superseded (not satisfied) by
# DocDownExcel-Markdown-ExcelContentEmitter-LinksImages.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-Markdown-ExcelContentEmitter-ReportsEmptyWorkbookGap
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsEmptyWorkbookGap required an empty-workbook
# shortfall. The current reporting rule states an empty workbook through zero-count inventory entries
# for features the backend explicitly looked for. The requirement is superseded (not satisfied) by
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsZeroCountInventory.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-Markdown-ExcelContentEmitter-NotesEmptySheet
# DocDownExcel-Markdown-ExcelContentEmitter-NotesEmptySheet required an informational empty-sheet
# report. The current reporting rule states that fact in the sheet part itself and records no note.
# The requirement is superseded (not satisfied) by
# DocDownExcel-Markdown-ExcelContentEmitter-WritesEmptyWorksheetMessage.
#
# SUPERSEDED REQUIREMENT: DocDownExcel-Markdown-ExcelContentEmitter-ReportsGapsAndDiagnostics
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsGapsAndDiagnostics described the whole reporting path
# in terms of gaps, diagnostics, and a degraded outcome. The current reporting rule uses content
# inventory counts plus short notes about attempted steps that could not complete. The requirement is
# superseded (not satisfied) by DocDownExcel-Markdown-ExcelContentEmitter-ReportsAttemptNotes,
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsZeroCountInventory, and
# DocDownExcel-Markdown-ExcelContentEmitter-ReportsContentFeatures.

sections:
  - title: DocDownExcel Requirements
    sections:
      - title: Markdown Requirements
        sections:
          - title: ExcelContentEmitter Requirements
            requirements:
              - id: DocDownExcel-Markdown-ExcelContentEmitter-EmitsModelContent
                title: >-
                  ExcelContentEmitter shall emit a workbook model's content through the sink, one
                  content part per worksheet, driven only by the model.
                justification: |
                  Emission that depends only on the model, and never on how the model was read, is what
                  keeps the output contract in one testable place and lets a hand-built model prove a
                  mapping decision without a workbook behind it.
                tests:
                  - ExcelContentEmitter_Emit_TwoSheets_WritesTitledSheetParts

              - id: DocDownExcel-Markdown-ExcelContentEmitter-WritesSheetParts
                title: >-
                  ExcelContentEmitter shall write each worksheet as a titled Sheet content part that
                  carries each cell's address and value.
                justification: |
                  A workbook stays navigable and a cited fact keeps its sheet identity only if each
                  worksheet becomes its own titled part. The address-and-value listing under it is the
                  lossless ledger a reader cites from.
                tests:
                  - ExcelContentEmitter_Emit_TwoSheets_WritesTitledSheetParts

              - id: DocDownExcel-Markdown-ExcelContentEmitter-RendersFormula
                title: >-
                  ExcelContentEmitter shall render a computed cell's formula alongside its value and
                  address in the listing.
                justification: |
                  The formula states the relationship and the value states one evaluation of it, so the
                  listing writes both — the address, the verbatim value, and the formula — so neither
                  half of a computed cell is lost.
                tests:
                  - ExcelContentEmitter_Emit_FormulaCell_RendersFormulaValueAndAddress

              - id: DocDownExcel-Markdown-ExcelContentEmitter-RendersGridTable
                title: >-
                  ExcelContentEmitter shall render a grid table in addition to the listing only when the
                  populated region is dense and table-shaped.
                justification: |
                  A grid table restores the row and column relationships a reader would otherwise
                  rebuild mentally, but only for a region that is genuinely a table; a sparse scatter or
                  a single-column list gains nothing from a table that a listing does not already give,
                  and a pathologically wide region is left to the listing so the output stays readable.
                tests:
                  - ExcelContentEmitter_Emit_DenseGrid_RendersTableAndListing

              - id: DocDownExcel-Markdown-ExcelContentEmitter-ElidesLongCellsInTableOnly
                title: >-
                  ExcelContentEmitter shall elide a long or multi-line value in the grid table only,
                  keep its full verbatim value in the listing, and note the elision when one occurred.
                justification: |
                  A Markdown table cannot hold a very long or multi-line value, so eliding it in the
                  table keeps the table readable; the full value is always present verbatim in the
                  listing below, and a note near the table names the cause and where the value actually
                  is, so the elision reads as a formatting limit rather than a loss and the
                  verbatim-full-length guarantee is never weakened.
                tests:
                  - ExcelContentEmitter_Emit_LongCell_ElidedInTableVerbatimInListing

              - id: DocDownExcel-Markdown-ExcelContentEmitter-NotesMergedRanges
                title: >-
                  ExcelContentEmitter shall state a worksheet's merged cell ranges as a note beside the
                  grid table.
                justification: |
                  A merge stores its value only in the anchor cell and a GFM table cannot visually span
                  cells, so the merged ranges are stated as a note rather than spanned, keeping the
                  fact that a range was merged visible without misrepresenting the grid.
                tests:
                  - ExcelContentEmitter_Emit_MergedRanges_StatedAsNote

              - id: DocDownExcel-Markdown-ExcelContentEmitter-EmitsChartParts
                title: >-
                  ExcelContentEmitter shall write each chart a worksheet shows as its own Chart content
                  part after the sheet, and name the chart under the sheet.
                justification: |
                  A chart's cached data becomes its own part written straight after the sheet that shows
                  it, so hundreds of plotted points do not bury the sheet's cells; the worksheet part
                  still names the chart so a reader who opens only that part learns the chart exists.
                tests:
                  - ExcelContentEmitter_Emit_SheetWithChart_WritesChartPartAfterSheet

              - id: DocDownExcel-Markdown-ExcelContentEmitter-ReportsAttemptNotes
                title: >-
                  ExcelContentEmitter shall record a short plain note only when an attempted chart or
                  image step could not be completed.
                justification: |
                  The reporting contract distinguishes facts about extracted content from facts about
                  attempted steps that did not finish. An unreadable chart part and images skipped by
                  caller-supplied size limits are both incomplete steps and therefore deserve a short
                  note.
                  An empty worksheet, an empty workbook, a chart with no cached data, a bounded chart
                  table, or a vector image written successfully are reported in content or inventory
                  instead.
                tests:
                  - ExcelContentEmitter_Emit_UnreadableChart_ReportsNoteAndKeepsChartPart

              - id: DocDownExcel-Markdown-ExcelContentEmitter-WritesShapeText
                title: >-
                  ExcelContentEmitter shall write a worksheet's drawing-shape text under its own
                  heading, after the cells and before the images.
                justification: |
                  Callouts and labels carry part numbers, warnings, and legend keys that exist in no
                  cell, so a reader of the listing alone would never see them. Writing them under their
                  own heading keeps their provenance as drawing-layer text rather than cell content
                  obvious.
                tests:
                  - ExcelContentEmitter_Emit_ShapeText_WritesUnderTheSheet

              - id: DocDownExcel-Markdown-ExcelContentEmitter-LinksImages
                title: >-
                  ExcelContentEmitter shall write a workbook's embedded images through the sink and link
                  each from the worksheet that shows it, only when a path was returned.
                justification: |
                  A worksheet's pictures are linked inline at their point of occurrence, mirroring the
                  Word convention, and a link is emitted only when the sink returned a path so a
                  suppressed, size-skipped, or deduplicated-away image never leaves a link pointing at
                  nothing.
                tests:
                  - ExcelContentEmitter_Emit_SheetImage_LinksInlineFromSheet

              - id: DocDownExcel-Markdown-ExcelContentEmitter-ReportsZeroCountInventory
                title: >-
                  ExcelContentEmitter shall preserve zero-count inventory entries for features it
                  explicitly looked for but did not find.
                justification: |
                  A reader must be able to tell "none found" from "not counted." Reporting zero counts
                  for an empty workbook and for an ordinary workbook that embeds no images keeps that
                  distinction explicit without characterizing the document.
                tests:
                  - ExcelContentEmitter_Emit_EmptyWorkbook_ReportsZeroCountInventory
                  - ExcelContentEmitter_Emit_NoImages_ReportsZeroImageInventory

              - id: DocDownExcel-Markdown-ExcelContentEmitter-WritesEmptyWorksheetMessage
                title: >-
                  ExcelContentEmitter shall state in the worksheet part when a worksheet has no cell
                  content, and shall record no note for that fact.
                justification: |
                  A worksheet with no populated cells is an ordinary authoring artifact, not an
                  incomplete extraction step. Stating that fact in the worksheet part lets a reader
                  distinguish an empty sheet from missing content without wrongly describing the document.
                tests:
                  - ExcelContentEmitter_Emit_EmptySheet_WritesEmptySheetMessage

              - id: DocDownExcel-Markdown-ExcelContentEmitter-StaysSilentOnPageRequest
                title: >-
                  ExcelContentEmitter shall not answer a page-rendering request with content or a note,
                  because a workbook has no page grid to render.
                justification: |
                  A page-rendering request applies to nothing on a non-paginated workbook, so the
                  emitter reports nothing; the extractor surface and environment facts carry that
                  non-applicability, and the emitter stays silent rather than implying work was left
                  undone.
                tests:
                  - ExcelContentEmitter_Emit_RenderPagesRequested_StaysSilent

              - id: DocDownExcel-Markdown-ExcelContentEmitter-ReportsContentFeatures
                title: >-
                  ExcelContentEmitter shall report a content outline counting the model's worksheets,
                  cells, formulas, images, charts, drawing annotations, and cached chart points,
                  including zero counts for features it explicitly looked for.
                justification: |
                  The counts come from the model the reader built and give a reader deciding whether to
                  open the parts an honest shape of the workbook — one small table or tens of
                  thousands of cells — that a character count could never convey. Preserving zero counts
                  for explicitly looked for features distinguishes "none found" from "not counted."
                tests:
                  - ExcelContentEmitter_Emit_Workbook_ReportsContentFeatures
                  - ExcelContentEmitter_Emit_NoImages_ReportsZeroImageInventory
                  - ExcelContentEmitter_Emit_EmptyWorkbook_ReportsZeroCountInventory
