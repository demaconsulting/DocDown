---
# Software Unit Requirements for ExcelChartWriter
#
# ExcelChartWriter renders one chart's cached data as markdown: the labeling that makes the numbers
# mean something, then a table of categories against series values, stating every shortfall in the
# rendering itself.

sections:
  - title: DocDownExcel Requirements
    sections:
      - title: Markdown Requirements
        sections:
          - title: ExcelChartWriter Requirements
            requirements:
              - id: DocDownExcel-Markdown-ExcelChartWriter-RendersCachedSeries
                title: >-
                  ExcelChartWriter shall render a chart's cached series as a table of categories against
                  series values, with a leading point-index column, one column per series, and pipe
                  characters escaped.
                justification: |
                  Rendering the cache as a table lets a reader consume a chart with no knowledge of the
                  chart grammar; the point-index column keeps every row addressable, a series with no
                  value at an index renders as an empty cell rather than a shifted one, and escaping the
                  pipe keeps a cached label from corrupting every column to its right.
                tests:
                  - ExcelChartWriter_Render_SingleSeries_RendersLabelingAndTable

              - id: DocDownExcel-Markdown-ExcelChartWriter-StatesUnreadableAndUncached
                title: >-
                  ExcelChartWriter shall state, in the chart part itself, a chart whose part could not be
                  read and one that cached no data points.
                justification: |
                  A chart part that could not be read still gets a part that states why, and a chart that
                  caches no values says so, so neither is ever a silent absence; the emitter reports the
                  matching counted gap, but the reader of the part sees the reason first-hand.
                tests:
                  - ExcelChartWriter_Render_UnreadableChart_StatesTheReason

              - id: DocDownExcel-Markdown-ExcelChartWriter-BoundsPlottedPoints
                title: >-
                  ExcelChartWriter shall bound the rendered data table at a fixed number of plotted points
                  and state how many it dropped.
                justification: |
                  A logged sweep can cache tens of thousands of points, which would crowd out the rest of
                  the workbook, so the table is capped; the truncation is never silent — the table says
                  what it dropped and the emitter reports a counted gap — and a chart exactly at the bound
                  is not truncated.
                tests:
                  - ExcelChartWriter_Render_BeyondBound_TruncatesAndStatesIt

              - id: DocDownExcel-Markdown-ExcelChartWriter-DescribesChartUnderSheet
                title: >-
                  ExcelChartWriter shall produce a one-line description of a chart naming it and its part
                  for use under the owning worksheet.
                justification: |
                  A reader who opens only a worksheet part must still learn the sheet shows a chart and
                  where its data lives, so the description names the chart and points at its own part
                  without burying the sheet's cells under the plotted points.
                tests:
                  - ExcelChartWriter_Describe_ReadableChart_NamesChartAndItsPart
