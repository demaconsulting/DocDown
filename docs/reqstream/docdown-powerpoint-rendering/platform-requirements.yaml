---
# System-Level Platform Requirements for DemaConsulting.DocDown.PowerPoint.Rendering
#
# These requirements specify the platforms and frameworks the package must support.
# CanvasNet.Pptx is fully managed and carries no runtime-identifier-specific asset, so the
# platform evidence is the same end-to-end render test run on each operating system and
# framework in the CI matrix, which produces a real PNG on every one of them.
#
# Test links can include a source filter prefix (e.g. "windows@", "ubuntu@", "net8.0@") to restrict
# which test results count as evidence for a requirement. This is critical for platform and framework
# requirements - removing these filters invalidates the evidence-based proof.

sections:
  - title: DocDownPowerPointRendering Requirements
    requirements:
      - id: DocDownPowerPointRendering-Platform-Windows
        title: The package shall build and render pages on Windows platforms.
        tags: [system]
        justification: |
          Windows is a major DEMA Consulting development platform, and CanvasNet.Pptx must open a
          document and rasterize a slide there.
        tests:
          - "windows@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"

      - id: DocDownPowerPointRendering-Platform-Linux
        title: The package shall build and render pages on Linux platforms.
        tags: [system]
        justification: |
          Linux is the primary CI/CD and container target, and CanvasNet.Pptx must open a document and
          rasterize a slide there.
        tests:
          - "ubuntu@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"

      - id: DocDownPowerPointRendering-Platform-MacOS
        title: The package shall build and render pages on macOS platforms.
        tags: [system]
        justification: |
          macOS support serves developers on Apple platforms, and CanvasNet.Pptx must open a document
          and rasterize a slide there.
        tests:
          - "macos@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"

      - id: DocDownPowerPointRendering-Platform-Net8
        title: The package shall support the .NET 8 runtime.
        tags: [system]
        justification: |
          .NET 8 is a Long-Term Support (LTS) release that reached end of support in November 2026.
          The package continues to support this runtime so that library consumers who have not yet
          migrated to a newer release, such as enterprise environments with slow upgrade cycles, can
          keep using it.
        tests:
          - "net8.0@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"

      - id: DocDownPowerPointRendering-Platform-Net9
        title: The package shall support the .NET 9 runtime.
        tags: [system]
        justification: |
          .NET 9 is a Standard-Term Support (STS) release that has reached end of support. The
          package continues to support this runtime so that library consumers who have not yet
          migrated to a newer release can keep using it.
        tests:
          - "net9.0@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"

      - id: DocDownPowerPointRendering-Platform-Net10
        title: The package shall support the .NET 10 runtime.
        tags: [system]
        justification: |
          .NET 10 is the current Long-Term Support (LTS) release. Supporting this runtime provides a
          stable, long-term supported target for library consumers who prefer LTS releases.
        tests:
          - "net10.0@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"

      - id: DocDownPowerPointRendering-Platform-Net11
        title: The package shall support the .NET 11 runtime.
        tags: [system]
        justification: |
          .NET 11 is the latest release in the .NET platform roadmap. Supporting this runtime
          ensures the package works for library consumers as they adopt the newest .NET version.
          CanvasNet.Pptx ships no net11.0 asset; its net10.0 asset is resolved through normal
          framework compatibility, and this test proves slides render there.
        tests:
          - "net11.0@DocDownPowerPointRendering_Render_ProbePresentation_ProducesValidPngPages"
