---
# Software Unit Requirements for PdfDocumentExtractor
#
# PdfDocumentExtractor is the backend the engine selects and invokes. It reports parser context,
# opens the document, reports metadata, delegates text and image work, and records the content
# inventory for the selected pages.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfDocumentExtractor-DeclaresCapabilities
# required a capability declaration surface that no longer exists. It is superseded, not satisfied,
# because DocDown now reports only what it extracted and where and makes no acceptability judgment;
# the managed backend no longer publishes a `Capabilities` property. The replacement is
# DocDownPdf-PdfDocumentExtractor-DescribesSupportedContract together with
# DocDownPdf-PdfDocumentExtractor-ProbeIsCheapAndSafe.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfDocumentExtractor-ReportsRenderGap
# required a backend-local page-rendering gap. It is superseded, not satisfied, because DocDown now
# reports what it extracted and where and makes no acceptability judgment. The managed backend no
# longer emits a gap here; the system-level replacement is DocDownPdf-PageRenderingRequestUsesNote.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfDocumentExtractor-ReportsNoTextLayerGap
# required a diagnostic and gap for pages with no text layer. It is superseded, not satisfied,
# because DocDown now reports what it extracted and where and makes no acceptability judgment.
# Text-free pages are now described through content counts by
# DocDownPdf-PdfDocumentExtractor-ReportsContentInventory.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfDocumentExtractor-ReportsEmptyDocumentGap
# required an explicit empty-document gap. It is superseded, not satisfied, because DocDown now
# reports what it extracted and where and makes no acceptability judgment. Zero-page documents are
# now described through content counts by DocDownPdf-PdfDocumentExtractor-ReportsContentInventory.

sections:
  - title: DocDownPdf Requirements
    sections:
      - title: PdfDocumentExtractor Requirements
        requirements:
          - id: DocDownPdf-PdfDocumentExtractor-DescribesSupportedContract
            title: >-
              PdfDocumentExtractor shall expose the stable PDF backend identity, display name,
              supported format, and priority used by the engine.
            justification: |
              A host and a reviewer need a stable surface that identifies which backend was selected.
              Keeping that surface explicit makes the managed PDF backend observable without reviving
              removed pre-extraction feature negotiation semantics.
            tests:
              - PdfDocumentExtractor_Descriptor_DeclaredProperties_MatchTheSupportedContract

          - id: DocDownPdf-PdfDocumentExtractor-ProbeIsCheapAndSafe
            title: >-
              PdfDocumentExtractor shall report the managed backend available without opening the
              document, performing input or output, or throwing.
            justification: |
              The availability probe is called often and early, before a caller has committed to any
              extraction work. A probe that reads files or throws would make selection slow and
              unreliable in exactly the phase that is supposed to be cheap and total.
            tests:
              - PdfDocumentExtractor_ProbeAvailability_ManagedOnlyBackend_ReportsAvailableWithoutIo

          - id: DocDownPdf-PdfDocumentExtractor-ReportsDocumentInfo
            title: >-
              PdfDocumentExtractor shall report the document's declared title and author and its page
              count, and report nothing where the document declares nothing.
            justification: |
              Metadata drives downstream routing decisions. Reporting a blank value as though the
              document had declared one is a different claim from reporting that it declared none,
              and only the second is true of a document with an empty title key.
            tests:
              - PdfDocumentExtractor_ExtractAsync_DocumentWithMetadata_ReportsTitleAuthorAndPageCount

          - id: DocDownPdf-PdfDocumentExtractor-ReportsEnvironmentFacts
            title: >-
              PdfDocumentExtractor shall record what parsed the document and that page rendering is
              not provided by this extractor.
            justification: |
              A consumer reading the persisted environment facts needs to know which managed parser
              produced the output and whether page rendering was available from this backend.
            tests:
              - PdfDocumentExtractor_ExtractAsync_AnyDocument_ReportsEnvironmentFacts

          - id: DocDownPdf-PdfDocumentExtractor-HonorsPageRange
            title: PdfDocumentExtractor shall extract only the pages within a requested page range.
            justification: |
              A caller asking for a slice of a large document is asking for the cost to be
              proportional to that slice. Extracting outside the range would both contradict the
              request and place content in the output that the caller did not ask for.
            tests:
              - PdfDocumentExtractor_ExtractAsync_PageRange_ExtractsOnlyTheRequestedPages

          - id: DocDownPdf-PdfDocumentExtractor-ReportsContentInventory
            title: >-
              PdfDocumentExtractor shall report content-inventory counts for selected pages,
              headings, paragraphs, and inline images, including zero where it genuinely looked and
              found none.
            justification: |
              The governing reporting principle is to say what was extracted and where, not to judge
              the document. Counts from the same extraction walk that produced the output keep empty
              and text-free PDFs observable without reviving gaps or diagnostics.
            tests:
              - PdfDocumentExtractor_ExtractAsync_NoTextLayer_WritesImageBackedContentWithZeroTextCounts
              - PdfDocumentExtractor_ExtractAsync_ZeroPageDocument_ReportsZeroCountInventoryWithoutThrowing

          - id: DocDownPdf-PdfDocumentExtractor-MapsParserFailures
            title: >-
              PdfDocumentExtractor shall surface a parser fault with its explanation rather than
              suppressing it or returning a successful outcome.
            justification: |
              The engine converts a backend fault into an unreadable result that still writes the full
              output layout. Suppressing the fault here would discard the parser's own explanation and
              report a success that did not happen.
            tests:
              - PdfDocumentExtractor_ExtractAsync_MalformedDocument_PropagatesParserFaultForCore
              - PdfDocumentExtractor_ExtractAsync_EncryptedDocument_PropagatesParserFaultForCore

          - id: DocDownPdf-PdfDocumentExtractor-ContributesSelfTests
            title: >-
              PdfDocumentExtractor shall contribute self-test cases that exercise its parser and
              report a truthful skipped result for page rendering.
            justification: |
              An operator needs evidence that the backend works in the environment it was deployed
              into. Reporting page rendering as a skipped case, rather than as a failure, keeps the
              self-test result readable as a health signal.
            tests:
              - PdfDocumentExtractor_GetSelfTestCases_DeployedBackend_ReturnsParseAndRenderingCases
