---
# Software Unit Requirements for PdfTextExtractor
#
# PdfTextExtractor turns a page's positioned glyphs into markdown paragraphs in reading order,
# places the links to that page's images, marks page boundaries, and reports text structure counts
# from the same rendering pass.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfTextExtractor-ReportsNoTextLayer
# required the unit to report a separate no-text-layer condition. It is superseded, not satisfied,
# because DocDown now reports what it extracted and where and makes no acceptability judgment.
# Text-free input is now described through zero heading and paragraph counts by
# DocDownPdf-PdfTextExtractor-ReportsZeroTextCounts.

sections:
  - title: DocDownPdf Requirements
    sections:
      - title: PdfTextExtractor Requirements
        requirements:
          - id: DocDownPdf-PdfTextExtractor-ReadingOrder
            title: PdfTextExtractor shall emit a page's text as paragraphs in the order a reader would read them.
            justification: |
              Glyphs are stored in the order a producer painted them, which on a multi-column page
              interleaves text a reader would take in sequence. Restoring reading order is what makes
              the output usable as prose rather than as a transcript of drawing operations.
            tests:
              - PdfTextExtractor_Extract_SingleTextPage_RendersParagraphsInReadingOrder

          - id: DocDownPdf-PdfTextExtractor-AvoidsRawPageText
            title: >-
              PdfTextExtractor shall produce word and paragraph structure that the parser's raw page
              text does not provide.
            justification: |
              The raw page text is a single undifferentiated run in paint order. Emitting it would be
              cheap and would look like text while being wrong in ways a downstream consumer cannot
              detect, which is the worst combination available.
            tests:
              - PdfTextExtractor_Extract_AnyPage_ProducesStructureRawPageTextDoesNot
              - PdfTextExtractor_Extract_UntaggedDocument_EmitsParagraphsWithoutInventedHeadings

          - id: DocDownPdf-PdfTextExtractor-MarksPageBoundaries
            title: PdfTextExtractor shall mark where each source page's content begins.
            justification: |
              A consumer that finds a passage in the output frequently needs to cite the page it came
              from. Marking the boundaries keeps that mapping available without a second pass over
              the source document.
            tests:
              - PdfTextExtractor_Extract_MultiplePages_EmitsAPageMarkerPerPage

          - id: DocDownPdf-PdfTextExtractor-LinksImages
            title: PdfTextExtractor shall link each extracted image from the page it was found on.
            justification: |
              An image written to disk but never referenced is invisible to a consumer reading the
              content document, and one linked under the wrong page is worse than unlinked because it
              asserts a false relationship.
            tests:
              - PdfTextExtractor_Extract_ExtractedImages_LinksThemUnderTheirOwnPage

          - id: DocDownPdf-PdfTextExtractor-ReportsZeroTextCounts
            title: >-
              PdfTextExtractor shall return zero heading and paragraph counts for text-free or empty
              page selections without inventing text.
            justification: |
              A selected page may legitimately carry no glyphs, and a zero-page document supplies no
              pages at all. Returning factual zero counts keeps those cases observable without
              inventing content or reviving removed no-text-layer diagnostics.
            tests:
              - PdfTextExtractor_Extract_PageWithNoGlyphs_YieldsZeroTextCounts
              - PdfTextExtractor_Extract_NoPages_ProducesZeroCountsAndNoMarkers
