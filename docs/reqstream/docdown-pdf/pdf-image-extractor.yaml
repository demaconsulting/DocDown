---
# Software Unit Requirements for PdfImageExtractor
#
# PdfImageExtractor writes a document's embedded images through the sink. It chooses an encoding per
# image, states honestly how each written image was produced, and records plain notes for attempted
# image work it could not complete.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfImageExtractor-WritesJpeg2000WithCaveat
# required a JPEG 2000 readability caveat. It is superseded, not satisfied, because DocDown now
# reports what it extracted and where and makes no acceptability judgment; a JPEG 2000 codestream
# written successfully as `.jp2` is counted as extracted and does not warrant a note. The
# replacement is DocDownPdf-PdfImageExtractor-WritesJpeg2000Passthrough.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfImageExtractor-ReportsUndecodableEncodings
# required undecodable images to be reported as counted gaps. It is superseded, not satisfied,
# because DocDown now reports what it extracted and where and makes no acceptability judgment.
# Attempted image work that could not complete is now described by the plain-note requirement
# DocDownPdf-PdfImageExtractor-NotesUndecodableEncodings.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfImageExtractor-ExplainsUnhonoredForcePng
# required unhonored PNG output to be reported as a counted gap. It is superseded, not satisfied,
# because DocDown now reports what it extracted and where and makes no acceptability judgment. The
# replacement is DocDownPdf-PdfImageExtractor-NotesUnhonoredForcePng.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfImageExtractor-NotesUnhonoredForcePng
# required a plain note for every image whose requested PNG output could not be produced. It is
# superseded (not satisfied) with no replacement because the caller-facing PNG request was removed
# under the simplicity principle: the request never converted anything, so with it gone there is
# nothing an unhonored-conversion note could report.
#
# SUPERSEDED REQUIREMENT: DocDownPdf-PdfImageExtractor-ExplainsUnhonoredForcePng (chain note)
# was already superseded above by DocDownPdf-PdfImageExtractor-NotesUnhonoredForcePng, which is
# itself now superseded with no replacement for the reason given directly above.

sections:
  - title: DocDownPdf Requirements
    sections:
      - title: PdfImageExtractor Requirements
        requirements:
          - id: DocDownPdf-PdfImageExtractor-JpegPassthrough
            title: >-
              PdfImageExtractor shall write an image already stored as a complete JPEG file without
              altering its bytes.
            justification: |
              A JPEG stored inside a document is already the file a consumer wants. Decoding and
              re-encoding it would cost quality and time for no gain, and would make any claim that
              the output is the document's own image untrue.
            tests:
              - PdfImageExtractor_AddImage_DctImage_SetsPassthroughTransformHint
              - PdfImageExtractor_Extract_JpegImage_WritesSourceEncodingWithoutNote

          - id: DocDownPdf-PdfImageExtractor-DecodesToPng
            title: >-
              PdfImageExtractor shall produce a usable image file from an image stored as compressed
              samples rather than as a file.
            justification: |
              Most embedded images are compressed sample buffers, not image files; writing those bytes
              out would produce something no consumer can open. Converting them is the only way the
              image reaches the consumer at all.
            tests:
              - PdfImageExtractor_AddImage_FlateImage_SetsDecodedToPngTransformHint

          - id: DocDownPdf-PdfImageExtractor-WritesJpeg2000Passthrough
            title: >-
              PdfImageExtractor shall write an image stored as a JPEG 2000 codestream unchanged under
              an extension and media type describing those bytes.
            justification: |
              The bytes of a JPEG 2000 codestream are a real image file. Writing them unchanged keeps
              the output truthful and preserves content a capable downstream consumer can still use.
            tests:
              - PdfImageExtractor_AddImage_JpxImage_WritesJp2PassthroughWithoutExtraNote
              - PdfImageExtractor_Extract_Jpeg2000Image_WritesSourceEncodingWithoutNote

          - id: DocDownPdf-PdfImageExtractor-RecordsTransformProvenance
            title: PdfImageExtractor shall report, for every image it writes, how it produced the bytes.
            justification: |
              Only this unit knows whether it copied the document's bytes or produced new ones. A
              consumer judging whether an extracted image can stand for the original depends on that
              answer being reported rather than assumed, and reported per image rather than per run.
            tests:
              - PdfImageExtractor_AddImage_DctImage_SetsPassthroughTransformHint
              - PdfImageExtractor_AddImage_FlateImage_SetsDecodedToPngTransformHint

          - id: DocDownPdf-PdfImageExtractor-ReportsImageHints
            title: >-
              PdfImageExtractor shall report each image's dimensions, source page, and a stable
              reference identifying it within the document.
            justification: |
              Provenance is what lets a reader of the output find the image back in the source
              document. A reference that changes between runs would also make the output
              non-reproducible, so stability is part of the requirement rather than a detail of it.
            tests:
              - PdfImageExtractor_AddImage_AnyImage_PopulatesHintProvenanceFields

          - id: DocDownPdf-PdfImageExtractor-NotesUndecodableEncodings
            title: >-
              PdfImageExtractor shall report a plain note naming the encoding and count of every image
              it could not decode.
            justification: |
              An image this extractor cannot decode is the case where silence would be easiest and
              most damaging: the output would look complete while missing content. Naming the encoding
              and count tells a reader both how much was lost and what kind of image caused it.
            tests:
              - PdfImageExtractor_Extract_UndecodableEncoding_ReportsPlainNoteAndWritesNothingForIt

          - id: DocDownPdf-PdfImageExtractor-HonorsSuppression
            title: PdfImageExtractor shall attempt no image extraction when embedded images are disabled.
            justification: |
              A caller who disabled images asked for none to be attempted, not merely for none to be
              kept. Attempting and discarding would spend the decoding cost the caller declined and
              would produce a second, redundant account of a decision already recorded.
            tests:
              - PdfImageExtractor_Extract_ImagesDisabled_AttemptsNothing

          - id: DocDownPdf-PdfImageExtractor-HonorsSizeLimits
            title: >-
              PdfImageExtractor shall skip an image exceeding a requested size or dimension limit and
              report the skip separately from a decoding failure.
            justification: |
              A size skip is undone by relaxing an option the caller chose; a decoding failure is a
              property of the document. Reporting them as one condition would tell a reader to try a
              remedy that cannot work, or hide one that would.
            tests:
              - PdfImageExtractor_Extract_ImageOverByteLimit_ReportsSizeNoteDistinctFromDecodeFailure
              - PdfImageExtractor_Extract_ImageOverDimensionLimit_ReportsCountedSizeNote
