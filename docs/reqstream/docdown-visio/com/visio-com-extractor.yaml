---
# Software Unit Requirements for VisioComExtractor
#
# SUPERSEDED REQUIREMENT: DocDownVisio-Com-VisioComExtractor-DeclaresCapabilities described the
# retired capability-set selection model. The extractor's observable role in selection is now
# captured by DocDownVisio-Com-VisioComExtractor-ParticipatesInSelection.
#
# SUPERSEDED REQUIREMENT:
# DocDownVisio-Com-VisioComExtractor-IsolatesPageRenderFailures required per-page render failures
# to be reported as a counted gap and diagnostic. The COM extractor now records a one-sentence
# note for the page and continues, so the behavior is superseded by
# DocDownVisio-Com-VisioComExtractor-ReportsPageRenderFailureNotes.
#
# VisioComExtractor is the rendering backend for modern Visio drawings. It produces page names,
# shape text, topology, images, and metadata by delegating to the managed Open Packaging backend,
# then rasterizes each page to a PNG through Microsoft Visio over late-bound COM. Everything apart
# from talking to Visio is exercised cross-platform by injecting a stub IVisioAutomation.

sections:
  - title: DocDownVisio Requirements
    sections:
      - title: Com Requirements
        sections:
          - title: VisioComExtractor Requirements
            requirements:
              - id: DocDownVisio-Com-VisioComExtractor-ParticipatesInSelection
                title: >-
                  VisioComExtractor shall identify itself as the lower-priority backend for `.vsdx`
                  and `.vsdm` drawings, with page rendering marked as a meaningful request for the
                  format.
                justification: |
                  The COM backend exists to add rendered pages for the same modern Visio drawings the
                  managed backend reads. Selection therefore needs to see the same supported formats,
                  know that page rendering applies to this document family, and rank this backend
                  below the managed backend so ordinary content extraction stays deterministic until a
                  caller asks for rendered pages.
                tests:
                  - VisioComExtractor_Descriptor_MatchesContract

              - id: DocDownVisio-Com-VisioComExtractor-DelegatesManagedContent
                title: >-
                  VisioComExtractor shall produce the page names, shape text, topology, images, and
                  metadata by delegating to the managed backend with rendering suppressed, then add
                  the rendered pages.
                justification: |
                  Re-implementing the managed content path in the rendering backend would create a
                  second, divergent extraction. Running the managed backend against the same sink
                  with rendering forced off and then adding the rendered pages is what keeps a
                  drawing's content identical whether or not it was rendered.
                tests:
                  - VisioComExtractor_Extract_ViaStub_WritesTopologyAndRendersEveryPage

              - id: DocDownVisio-Com-VisioComExtractor-ReconcilesRenderingFacts
                title: >-
                  VisioComExtractor shall suppress the delegated managed backend's "rendering not
                  provided" fact and emit the authoritative renderer fact, so the composed report is
                  consistent.
                justification: |
                  The managed backend, unaware a rendering host is composing its output,
                  unconditionally reports that page rendering is not provided — a statement a
                  successful COM run makes false. Dropping that one contradictory fact through a
                  composing sink while emitting the authoritative "rendered by Microsoft Visio" fact
                  is what keeps the composed report internally consistent without losing any other
                  honest fact.
                tests:
                  - VisioComExtractor_Extract_ViaStub_SuppressesContradictoryPageRenderingFact

              - id: DocDownVisio-Com-VisioComExtractor-RendersEveryPage
                title: >-
                  VisioComExtractor shall render every foreground page through the automation seam at
                  the caller's requested resolution and add each successful render as a page.
                justification: |
                  The rendered appearance is the richer outcome and the caller chose the resolution,
                  so the backend passes the requested resolution through to the automation seam and
                  adds each rendered page through the sink, capturing the spatial arrangement the XML
                  cannot recover.
                tests:
                  - VisioComExtractor_Extract_PassesRenderDpiToAutomation

              - id: DocDownVisio-Com-VisioComExtractor-ReportsPageRenderFailureNotes
                title: >-
                  VisioComExtractor shall record a plain note naming any page the renderer could not
                  produce, while continuing with the remaining pages.
                justification: |
                  Rendering is worthwhile only if its shortfalls are honest: a page that dropped out
                  of the `pages/` folder silently is exactly the failure the output contract forbids.
                  Isolating each page's export so one unrenderable page becomes a short note rather
                  than an aborted run keeps a partially rendered drawing a stated fact and lets the
                  remaining pages still render.
                tests:
                  - VisioComExtractor_Extract_PageRenderFails_ReportsNote

              - id: DocDownVisio-Com-VisioComExtractor-ProbesHonestly
                title: >-
                  VisioComExtractor shall probe unavailable without throwing where no automation
                  adapter is present or Microsoft Visio cannot be reached, and never instruct an
                  installation.
                justification: |
                  Constructing the extractor must never launch Visio, and where no automation adapter
                  is present the backend cannot work regardless of the machine, so it reports
                  unavailable without throwing. Otherwise it defers to the environment check. No
                  reason it returns ever instructs an installation, matching the library-wide
                  convention.
                tests:
                  - VisioComExtractor_NullFactory_ProbesUnavailable
                  - VisioComExtractor_PublicCtor_ProbeDoesNotThrowAndNeverInstructsInstallation

              - id: DocDownVisio-Com-VisioComExtractor-ContributesComSelfTests
                title: >-
                  VisioComExtractor shall contribute a release-time availability case and a
                  release-time case that renders a page it builds itself through the real COM
                  adapter, each skipping with a stated reason where Microsoft Visio is absent.
                justification: |
                  The COM adapter cannot be exercised in CI, so the only evidence that it genuinely
                  rasterizes in a deployed environment is a case that builds a synthetic single-page
                  drawing and renders it through the shipping adapter, asserting a real PNG of
                  plausible size came back and that the Visio process the render started is gone
                  afterwards. Because rendering is environment-dependent, an environment without
                  Visio must produce a stated skip rather than a failure, so self-validation stays
                  green on a machine that legitimately cannot render.
                tests:
                  - VisioComExtractor_GetSelfTestCases_ReturnsAvailabilityAndRenderCases
                  - VisioComExtractor_RenderSelfTest_UnavailableBackend_SkipsWithReason
